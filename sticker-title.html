/* ---- the component ---- */
sticker-word{ display:inline-block; line-height:0; }
sticker-word svg{ display:block; overflow:visible; filter:drop-shadow(var(--sticker-shadow, 3px 7px 6px rgba(0,0,0,.33))); }
sticker-word text{ font-family:'StickerSans','Arial Black','Helvetica Neue',sans-serif; font-weight:900; }

/* ---- demo page only (delete everything below when you lift the component) ---- */
html,body{margin:0;height:100%}
body{
  background:transparent;
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#24303a;
  display:flex;flex-direction:column;
}
body.bare{display:block;background:transparent}
body.bare .ui,body.bare .stagewrap>.hint{display:none}
.stagewrap{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 16px;min-height:45vh;position:relative}
.stagewrap[data-bg="checks"]{
  background-color:#fff;
  background-image:linear-gradient(45deg,#e3e8ec 25%,transparent 25%),linear-gradient(-45deg,#e3e8ec 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e3e8ec 75%),linear-gradient(-45deg,transparent 75%,#e3e8ec 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;
}
.stagewrap[data-bg="white"]{background:#fff}
.stagewrap[data-bg="dark"]{background:#16202a}
.stagewrap[data-bg="photo"]{background:radial-gradient(circle at 30% 30%,#7fd4ff,#0d6fa8 60%,#08405f)}
body.bare .stagewrap{background:none;padding:0;min-height:0}
.hint{position:absolute;left:14px;bottom:10px;font-size:12px;color:#8494a1}
.stagewrap[data-bg="dark"] .hint,.stagewrap[data-bg="photo"] .hint{color:#b9cad6}
.ui{background:#f4f6f8;border-top:1px solid #dde3e8;padding:14px 18px 18px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row label{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#6a7b88}
input[type=text]{flex:1;min-width:200px;padding:9px 12px;font-size:17px;font-weight:700;border:1px solid #cdd6dd;border-radius:8px;background:#fff}
input[type=range]{width:150px}
button{border:1px solid #cdd6dd;background:#fff;border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
button:hover{background:#e9eef2}
button.on{background:#16202a;color:#fff;border-color:#16202a}
.val{font-variant-numeric:tabular-nums;color:#6a7b88;font-size:12px;min-width:34px}
</style>
</head>
<body>

<div class="stagewrap" data-bg="checks" id="stage">
  <sticker-word id="demo" text="Hey!" cap="190"></sticker-word>
  <div class="hint">transparent background — the checks are the page, not the artwork</div>
</div>

<div class="ui">
  <div class="row">
    <input type="text" id="word" value="Hey!" spellcheck="false" aria-label="word">
  </div>
  <div class="row" id="presets"></div>
  <div class="row">
    <label>size</label><input type="range" id="cap" min="60" max="300" value="190"><span class="val" id="capv">190</span>
    <label>width</label><input type="range" id="wid" min="62" max="125" value="73"><span class="val" id="widv">73</span>
    <label>tilt</label><input type="range" id="tilt" min="-25" max="25" value="-9.7" step="0.1"><span class="val" id="tiltv">-9.7</span>
    <label>grain</label><input type="range" id="grain" min="0" max="80" value="22"><span class="val" id="grainv">0.22</span>
  </div>
  <div class="row">
    <label>preview on</label>
    <button data-bg="checks" class="on">transparent</button>
    <button data-bg="white">white</button>
    <button data-bg="dark">dark</button>
    <button data-bg="photo">colour</button>
    <button id="dl" style="margin-left:auto">download SVG</button>
  </div>
</div>

<script>
/* ===========================================================================
   STICKER WORD COMPONENT
   The look lives in one object. Every band is measured from the original PSD
   as a fraction of the font size, so it scales with the word at any size.
   =========================================================================== */
const STICKER = {
  font: "'StickerSans','Arial Black','Helvetica Neue',sans-serif",
  capRatio: 0.685,          // cap-height ÷ font-size for this font
  tilt: -9.7,               // degrees, matches the original artwork
  width: 73,                // wdth axis — 73 matches the original proportions
  tracking: 0,              // letter-spacing in em
  grain: 0.22,              // watercolour mottle strength (0 = flat colour)
  // back → front. w = stroke width in em (2 × the band's thickness)
  // textured: true = gets the watercolour mottle (the white cut and the
  // letters stay clean, exactly like the printed original)
  layers: [
    { color:'#fffdf7', w:0.4715 },                  // outer sticker cut
    { color:'#0c89bf', w:0.3350, textured:true },   // blue
    { color:'#469d47', w:0.2357, textured:true },   // green
    { color:'#dcca24', w:0.1563, textured:true },   // yellow
    { color:'#c83f27', w:0.1042, textured:true },   // red/orange
    { color:'#fffdf7', w:0.0347 },                  // inner white keyline
    { color:'#0a0a0a', w:0 }                        // the letters themselves
  ]
};

let uid = 0;
const SVGNS = 'http://www.w3.org/2000/svg';

class StickerWord extends HTMLElement {
  static get observedAttributes(){ return ['text','cap','width','tilt','grain']; }
  connectedCallback(){ this.id2 = 'sw' + (++uid); this.build(); }
  attributeChangedCallback(){ if(this.id2) this.build(); }

  get cfg(){
    const n = (a,d)=> this.hasAttribute(a) ? parseFloat(this.getAttribute(a)) : d;
    return {
      text : this.getAttribute('text') || 'Hey!',
      cap  : n('cap', 180),
      width: n('width', STICKER.width),
      tilt : n('tilt', STICKER.tilt),
      grain: n('grain', STICKER.grain)
    };
  }

  build(){
    const c = this.cfg;
    const F = c.cap / STICKER.capRatio;               // font-size that gives this cap-height
    const gid = 'grain-' + this.id2;
    const tid = 'txt-' + this.id2;

    const band = l => l.w
      ? `<use href="#${tid}" fill="${l.color}" stroke="${l.color}" stroke-width="${(l.w*F).toFixed(2)}" stroke-linejoin="round" stroke-linecap="round"/>`
      : `<use href="#${tid}" fill="${l.color}"/>`;

    // keep consecutive same-texture bands together so the mottle is one pass
    let layers = '', run = [], runTex = null;
    const flush = () => {
      if(!run.length) return;
      const inner = run.map(band).join('');
      layers += (runTex && c.grain > 0) ? `<g filter="url(#${gid})">${inner}</g>` : inner;
      run = [];
    };
    STICKER.layers.forEach(l => {
      const t = !!l.textured;
      if (t !== runTex){ flush(); runTex = t; }
      run.push(l);
    });
    flush();

    this.innerHTML =
`<svg xmlns="${SVGNS}" part="svg">
  <defs>
    <text id="${tid}" x="0" y="0"
      style="font-family:${STICKER.font};font-weight:900;font-size:${F}px;
             font-variation-settings:'wght' 900,'wdth' ${c.width};
             letter-spacing:${STICKER.tracking}em;white-space:pre">${esc(c.text)}</text>
    <filter id="${gid}" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="${(3.2/F).toFixed(5)}" numOctaves="4" seed="9" result="n"/>
      <!-- turn the noise into high-contrast blotches, then tint + multiply -->
      <feColorMatrix in="n" type="matrix" result="blotch"
        values="0 0 0 0 .22  0 0 0 0 .20  0 0 0 0 .16  2.4 0 0 0 -1.15"/>
      <feComponentTransfer in="blotch" result="blotchA">
        <feFuncA type="linear" slope="${c.grain.toFixed(3)}"/>
      </feComponentTransfer>
      <feComposite in="blotchA" in2="SourceGraphic" operator="in" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
    </filter>
  </defs>
  <g id="rot-${this.id2}">${layers}</g>
</svg>`;

    this.fit(F);
    if (document.fonts){
      document.fonts.ready.then(()=> this.fit(F));
    }
  }

  /* bbox of the word itself, stroke excluded */
  measure(){
    const svg = this.querySelector('svg');
    const uses = this.querySelectorAll('use');
    let b = null;
    try { b = uses[uses.length-1].getBBox(); } catch(e){ b = null; }
    if (!b || !b.width){                      // fallback for engines that
      const tmp = this.querySelector('text').cloneNode(true);   // won't measure <use>
      tmp.removeAttribute('id');
      tmp.setAttribute('visibility','hidden');
      svg.appendChild(tmp);
      try { b = tmp.getBBox(); } catch(e){ b = null; }
      tmp.remove();
    }
    return b;
  }

  /* measure the text, pad by the widest band, rotate, and set the viewBox so
     the artwork always sits snugly in the box whatever the word is */
  fit(F){
    const svg  = this.querySelector('svg');
    const grp  = this.querySelector('[id^="rot-"]');
    if(!svg || !grp) return;
    const c = this.cfg;
    const b = this.measure();
    if(!b || !b.width) return;

    const pad = STICKER.layers[0].w * F / 2 + F*0.012;   // half of the outer stroke
    const x0 = b.x - pad, y0 = b.y - pad;
    const x1 = b.x + b.width + pad, y1 = b.y + b.height + pad;
    const cx = (x0+x1)/2, cy = (y0+y1)/2;

    grp.setAttribute('transform', `rotate(${c.tilt} ${cx} ${cy})`);

    const r = c.tilt * Math.PI/180, cos = Math.cos(r), sin = Math.sin(r);
    let X0=Infinity, Y0=Infinity, X1=-Infinity, Y1=-Infinity;
    for (const [px,py] of [[x0,y0],[x1,y0],[x1,y1],[x0,y1]]){
      const dx = px-cx, dy = py-cy;
      const rx = cx + dx*cos - dy*sin, ry = cy + dx*sin + dy*cos;
      X0=Math.min(X0,rx); Y0=Math.min(Y0,ry); X1=Math.max(X1,rx); Y1=Math.max(Y1,ry);
    }
    const w = X1-X0, h = Y1-Y0;
    svg.setAttribute('viewBox', `${X0.toFixed(2)} ${Y0.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)}`);
    svg.setAttribute('width',  w.toFixed(1));
    svg.setAttribute('height', h.toFixed(1));
    svg.style.filter = `drop-shadow(${(F*0.008).toFixed(1)}px ${(F*0.020).toFixed(1)}px ${(F*0.016).toFixed(1)}px rgba(0,0,0,.35))`;
    this.dispatchEvent(new CustomEvent('fitted',{detail:{w,h}}));
  }

  /* standalone SVG string you can save or drop into another page */
  toSVG(){
    const s = this.querySelector('svg').cloneNode(true);
    s.setAttribute('xmlns', SVGNS);
    return '<?xml version="1.0" encoding="UTF-8"?>\n' + s.outerHTML;
  }
}
const esc = s => s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
customElements.define('sticker-word', StickerWord);

/* ===========================================================================
   demo page wiring (safe to delete)
   =========================================================================== */
(function(){
  const bare = new URLSearchParams(location.search).has('bare');
  if (bare) document.body.classList.add('bare');

  const el = document.getElementById('demo');
  const stage = document.getElementById('stage');
  const word = document.getElementById('word');
  if(!el) return;

  word.addEventListener('input', ()=> el.setAttribute('text', word.value || ' '));

  const PRESETS = ['Hey!','¡Hola!','Bonjour !','Hallo!','Olá!','Ciao!','Chào!','Cześć!','Habari!','Selam!','Moni!','Hei!'];
  const box = document.getElementById('presets');
  PRESETS.forEach(p=>{
    const b = document.createElement('button');
    b.textContent = p;
    b.onclick = ()=>{ word.value = p; el.setAttribute('text', p); };
    box.appendChild(b);
  });

  const bind = (id, attr, fmt) => {
    const r = document.getElementById(id), out = document.getElementById(id+'v');
    r.addEventListener('input', ()=>{
      el.setAttribute(attr, r.value);
      out.textContent = fmt ? fmt(r.value) : r.value;
    });
  };
  bind('cap','cap'); bind('wid','width'); bind('tilt','tilt');
  const gr = document.getElementById('grain');
  gr.addEventListener('input', ()=>{
    el.setAttribute('grain', (gr.value/100).toFixed(3));
    document.getElementById('grainv').textContent = (gr.value/100).toFixed(2);
  });

  document.querySelectorAll('.ui [data-bg]').forEach(b=>{
    b.onclick = ()=>{
      stage.dataset.bg = b.dataset.bg;
      document.querySelectorAll('.ui [data-bg]').forEach(o=>o.classList.toggle('on', o===b));
    };
  });

  document.getElementById('dl').onclick = ()=>{
    const blob = new Blob([el.toSVG()], {type:'image/svg+xml'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (el.getAttribute('text')||'word').replace(/[^\w]+/g,'_') + '.svg';
    a.click();
  };
})();
</script>
