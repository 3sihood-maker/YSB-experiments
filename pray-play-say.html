<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pray Play Say — Matchday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B1220;
    --bg-elev: #131C2B;
    --bg-elev-2: #1A2436;
    --line: #253248;
    --line-soft: #1D2839;
    --text: #EDEFF4;
    --text-dim: #8B96AC;
    --text-faint: #5B6579;
    --gold: #E8B23D;
    --gold-soft: rgba(232,178,61,0.14);
    --teal: #2FB6A5;
    --teal-soft: rgba(47,182,165,0.14);
    --coral: #E85D4E;
    --coral-soft: rgba(232,93,78,0.14);
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .display{ font-family:'Anton', sans-serif; letter-spacing: 0.02em; text-transform: uppercase; }
  .mono{ font-family:'Space Mono', monospace; }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    background:
      radial-gradient(120% 60% at 50% -10%, #17223590 0%, transparent 60%),
      var(--bg);
  }
  /* ===== HEADER / SCOREBOARD ===== */
  .scoreboard{
    padding: 22px 18px 16px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #0E1727 0%, #0B1220 100%);
    position: relative;
    overflow: hidden;
  }
  .scoreboard::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,0.015) 3px, rgba(255,255,255,0.015) 4px);
    pointer-events:none;
  }
  .sb-top{
    display:flex; align-items:center; justify-content:space-between;
    position: relative; z-index:1;
  }
  .sb-brand{
    display:flex; align-items:center; gap:9px;
  }
  .sb-crest{
    width:30px; height:30px; border-radius:8px;
    background: linear-gradient(135deg, var(--gold), var(--coral));
    display:flex; align-items:center; justify-content:center;
    font-family:'Anton',sans-serif; font-size:14px; color:#0B1220;
    flex-shrink:0;
  }
  .sb-brand-text{ line-height:1.05; }
  .sb-brand-text .l1{ font-size:10px; letter-spacing:0.18em; color:var(--text-dim); text-transform:uppercase; }
  .sb-brand-text .l2{ font-size:14px; font-weight:800; letter-spacing:0.02em; }
  .sb-name-pill{
    font-size:11px; color:var(--text-dim); background: var(--bg-elev-2);
    border:1px solid var(--line); padding:5px 10px; border-radius:20px;
    cursor:pointer; white-space:nowrap;
  }
  .sb-main{
    display:flex; align-items:flex-end; gap:18px; margin-top:18px; position:relative; z-index:1;
  }
  .sb-streak{
    display:flex; flex-direction:column; align-items:flex-start;
  }
  .sb-streak .digits{
    font-family:'Anton',sans-serif;
    font-size: 58px;
    line-height: 0.85;
    display:flex; gap:2px;
  }
  .digit{
    background: #0F1826; border:1px solid var(--line);
    border-radius: 6px; padding: 2px 8px 0;
    min-width: 40px; text-align:center;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
  }
  /* The gradient sits on the numeral itself, not on the row. On the row it was
     clipped to the text but then painted over by each box's own opaque
     background, so the streak showed as two empty boxes. */
  .digit b{
    font-weight: 400;
    background: linear-gradient(180deg,#fff, #C9CEDA);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sb-streak .lbl{ font-size:10.5px; letter-spacing:0.16em; color:var(--text-dim); text-transform:uppercase; margin-top:6px;}
  .sb-mini-stats{
    flex:1; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; margin-bottom:4px;
  }
  .mini-stat{
    background: var(--bg-elev); border:1px solid var(--line-soft); border-radius:10px;
    padding:7px 6px; text-align:center;
  }
  .mini-stat .n{ font-family:'Space Mono',monospace; font-size:15px; font-weight:700; }
  .mini-stat .k{ font-size:8.5px; letter-spacing:0.1em; color:var(--text-faint); text-transform:uppercase; margin-top:2px;}
  .mini-stat.pray .n{ color:var(--gold); }
  .mini-stat.play .n{ color:var(--teal); }
  .mini-stat.say .n{ color:var(--coral); }
  .sb-today-progress{
    margin-top:14px; position:relative; z-index:1;
  }
  .sb-today-progress .bar{
    height:6px; border-radius:4px; background: var(--bg-elev-2); overflow:hidden; display:flex;
  }
  .sb-today-progress .bar .seg{ flex:1; background: var(--line-soft); }
  .sb-today-progress .bar .seg.on.pray{ background: var(--gold); }
  .sb-today-progress .bar .seg.on.play{ background: var(--teal); }
  .sb-today-progress .bar .seg.on.say{ background: var(--coral); }
  .sb-today-progress .cap{ font-size:10px; color:var(--text-faint); margin-top:6px; letter-spacing:0.04em; }
  /* ===== CONTENT ===== */
  #content{
    flex:1; padding: 18px 18px 100px;
    overflow-y:auto;
  }
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;
  }
  .section-head h1{
    font-family:'Anton',sans-serif; font-size:24px; margin:0; letter-spacing:0.01em;
  }
  .section-head .sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .eyebrow{
    font-size:10.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-faint); margin-bottom:4px; display:block;
  }
  /* ===== CHALLENGE CARDS ===== */
  .challenge-stack{ display:flex; flex-direction:column; gap:12px; }
  .ccard{
    border-radius: var(--radius);
    border:1px solid var(--line);
    background: var(--bg-elev);
    padding: 16px 16px 14px;
    position:relative;
    overflow:hidden;
    transition: transform .15s ease;
  }
  .ccard::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
  }
  .ccard.pray::before{ background: var(--gold); }
  .ccard.play::before{ background: var(--teal); }
  .ccard.say::before{ background: var(--coral); }
  .ccard.done{ opacity:0.55; }
  .ccard .row1{ display:flex; align-items:center; justify-content:space-between; }
  .tag{
    font-family:'Space Mono',monospace; font-weight:700; font-size:11px; letter-spacing:0.14em;
    padding:4px 9px; border-radius:20px; text-transform:uppercase;
  }
  .tag.pray{ background:var(--gold-soft); color:var(--gold); }
  .tag.play{ background:var(--teal-soft); color:var(--teal); }
  .tag.say{ background:var(--coral-soft); color:var(--coral); }
  .ccard .num{ font-family:'Space Mono',monospace; font-size:11px; color:var(--text-faint); }
  .ccard .ctext{ font-size:16.5px; line-height:1.35; margin:12px 0 14px; font-weight:500; }
  .ccard .verse{ font-size:11.5px; color:var(--text-faint); margin-bottom:12px; font-style:italic; }
  .btn{
    border:none; border-radius:10px; padding:11px 16px; font-weight:700; font-size:13.5px;
    cursor:pointer; letter-spacing:0.02em; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition: transform .08s ease, opacity .15s ease;
    font-family:'Work Sans',sans-serif;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-block{ width:100%; }
  .btn-pray{ background:var(--gold); color:#241802; }
  .btn-play{ background:var(--teal); color:#04211D; }
  .btn-say{ background:var(--coral); color:#2B0B08; }
  .btn-ghost{ background: var(--bg-elev-2); color:var(--text); border:1px solid var(--line); }
  .btn-done{ background: var(--bg-elev-2); color:var(--text-dim); border:1px solid var(--line); }
  .btn:disabled{ opacity:0.6; cursor:default; }
  .all-done-banner{
    margin-top:14px; padding:16px; border-radius: var(--radius); text-align:center;
    background: linear-gradient(135deg, var(--gold-soft), var(--teal-soft));
    border:1px solid var(--line);
  }
  .all-done-banner .big{ font-family:'Anton',sans-serif; font-size:19px; margin-bottom:3px;}
  .all-done-banner .small{ font-size:12px; color:var(--text-dim); }
  /* ===== NAV ===== */
  #navbar{
    position: sticky; bottom:0; left:0; right:0;
    max-width:480px; margin:0 auto;
    background: rgba(11,18,32,0.92); backdrop-filter: blur(10px);
    border-top:1px solid var(--line);
    display:flex;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    z-index:20;
  }
  .navbtn{
    flex:1; background:none; border:none; color:var(--text-faint);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 1px 6px; cursor:pointer; font-family:'Work Sans',sans-serif;
    border-radius:10px; min-width:0;
  }
  .navbtn .ic{ font-size:16px; line-height:1;}
  .navbtn .lb{ font-size:8.6px; letter-spacing:0.03em; text-transform:uppercase; font-weight:600;}
  .navbtn.active{ color:var(--text); background: var(--bg-elev-2); }
  .navbtn .dot{
    position:absolute; margin-left:14px; margin-top:-2px; width:6px; height:6px; border-radius:50%; background:var(--coral);
  }
  /* ===== GENERIC CARDS ===== */
  .card{
    background: var(--bg-elev); border:1px solid var(--line); border-radius: var(--radius);
    padding:16px; margin-bottom:12px;
  }
  .card h3{ font-family:'Anton',sans-serif; font-size:17px; margin:0 0 6px; letter-spacing:0.01em; font-weight:400;}
  .card p{ font-size:13.5px; color:var(--text-dim); line-height:1.5; margin:0 0 10px;}
  textarea, input[type=text]{
    width:100%; background: var(--bg-elev-2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-family:'Work Sans',sans-serif; font-size:13.5px; padding:11px 12px;
    resize:vertical; margin-bottom:10px;
  }
  textarea:focus, input[type=text]:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  label.flabel{ font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); display:block; margin-bottom:6px;}
  /* Journal entries */
  .jentry{
    border-left:3px solid var(--line); padding: 4px 0 4px 12px; margin-bottom:14px;
  }
  .jentry .jdate{ font-family:'Space Mono',monospace; font-size:10.5px; color:var(--text-faint); margin-bottom:4px;}
  .jentry .jrow{ margin-bottom:6px; font-size:13px; line-height:1.4; }
  .jentry .jrow b{ color: var(--text-dim); font-weight:700; margin-right:4px;}
  .jbadges{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .jbadge{ font-size:9.5px; padding:3px 8px; border-radius:20px; background:var(--bg-elev-2); border:1px solid var(--line); color:var(--text-dim); }
  .del-link{ font-size:11px; color:var(--text-faint); background:none; border:none; cursor:pointer; text-decoration:underline; margin-top:4px; padding:0;}
  /* Stories */
  .story-card{
    display:flex; gap:12px; align-items:center; cursor:pointer;
  }
  .story-ic{
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:20px;
    background: var(--bg-elev-2); border:1px solid var(--line);
  }
  .story-meta{ flex:1; }
  .story-meta .st{ font-size:14.5px; font-weight:700; margin-bottom:2px;}
  .story-meta .sd{ font-size:12px; color:var(--text-dim); }
  .story-arrow{ color:var(--text-faint); font-size:18px; }
  .story-scene{ }
  .story-scene .scene-eyebrow{ font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color: var(--text-faint); margin-bottom:8px;}
  .story-scene .scene-text{ font-size:15.5px; line-height:1.55; margin-bottom:16px; }
  .choice-btn{
    display:block; width:100%; text-align:left; background: var(--bg-elev-2); border:1px solid var(--line);
    color:var(--text); padding:13px 14px; border-radius:12px; margin-bottom:10px; font-size:13.5px; cursor:pointer;
    font-family:'Work Sans',sans-serif; line-height:1.4;
  }
  .choice-btn:active{ transform: scale(0.98); }
  .choice-btn .cletter{ font-family:'Space Mono',monospace; color:var(--text-faint); margin-right:8px; }
  .end-badge{ display:inline-block; font-size:10.5px; padding:4px 10px; border-radius:20px; margin-bottom:12px; font-weight:700; letter-spacing:0.04em;}
  .end-badge.pray{ background:var(--gold-soft); color:var(--gold); }
  .end-badge.play{ background:var(--teal-soft); color:var(--teal); }
  .end-badge.say{ background:var(--coral-soft); color:var(--coral); }
  /* Missions */
  .mission-hero{
    background: linear-gradient(135deg, #16223A, #101929);
    border:1px solid var(--line); border-radius: var(--radius); padding:18px; margin-bottom:14px;
  }
  .mission-week{ font-family:'Space Mono',monospace; font-size:11px; color:var(--text-faint); margin-bottom:6px;}
  .mission-hero h2{ font-family:'Anton',sans-serif; font-size:20px; margin:0 0 10px; font-weight:400;}
  .mtask{ display:flex; gap:10px; align-items:flex-start; margin-bottom:10px; padding:10px; border-radius:10px; background: rgba(255,255,255,0.02); }
  .mtask .mtag{ flex-shrink:0; }
  .mtask .mtext{ font-size:13px; line-height:1.4; }
  /* Progress / badges */
  .streak-hero{
    text-align:center; padding: 26px 16px; border-radius: var(--radius);
    background: radial-gradient(120% 100% at 50% 0%, #1B2A44 0%, #101929 70%);
    border:1px solid var(--line); margin-bottom:16px;
  }
  .streak-hero .n{ font-family:'Anton',sans-serif; font-size:64px; line-height:1; background:linear-gradient(180deg,#fff,#C9CEDA); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .streak-hero .l{ font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-dim); margin-top:6px;}
  .streak-hero .best{ margin-top:12px; font-size:11.5px; color:var(--text-faint);}
  .badge-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom:16px;}
  .badge{
    background: var(--bg-elev); border:1px solid var(--line); border-radius:14px; padding:12px 8px;
    text-align:center; opacity:0.35;
  }
  .badge.unlocked{ opacity:1; border-color: rgba(232,178,61,0.4); box-shadow: 0 0 0 1px rgba(232,178,61,0.08) inset;}
  .badge .bic{ font-size:22px; margin-bottom:6px; }
  .badge .bn{ font-size:10px; font-weight:700; line-height:1.25;}
  .badge .bd{ font-size:8.5px; color:var(--text-faint); margin-top:3px; line-height:1.3;}
  .cert-wrap{ text-align:center; }
  canvas#certCanvas{ width:100%; border-radius:12px; border:1px solid var(--line); margin-bottom:12px; }
  /* Onboarding modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(5,8,14,0.75); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background: var(--bg-elev); border:1px solid var(--line); border-radius: var(--radius);
    padding:24px; max-width:380px; width:100%; box-shadow: var(--shadow);
  }
  .modal h2{ font-family:'Anton',sans-serif; font-size:22px; margin:0 0 8px; font-weight:400;}
  .modal p{ font-size:13px; color:var(--text-dim); line-height:1.5; margin:0 0 16px;}
  .toast{
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
    background: var(--bg-elev-2); border:1px solid var(--line); padding:10px 18px; border-radius:30px;
    font-size:12.5px; z-index:60; box-shadow: var(--shadow); opacity:0; pointer-events:none; transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(-6px); }
  ::-webkit-scrollbar{ width:0; height:0; }
  a{ color: var(--teal); }
  .empty-state{ text-align:center; padding: 40px 16px; color: var(--text-faint); }
  .empty-state .ic{ font-size:30px; margin-bottom:10px; }
  .empty-state .t{ font-size:13px; }
  .footnote{ font-size:10.5px; color:var(--text-faint); text-align:center; margin-top:18px; line-height:1.5;}
  /* ===== TRAINING / BIBLE DISCOVERY ===== */
  .tdots{ display:flex; gap:6px; margin-bottom:16px; }
  .tdot{ flex:1; height:4px; border-radius:3px; background: var(--line-soft); }
  .tdot.on{ background: var(--gold); }
  .tdot.past{ background: var(--text-faint); }
  .train-hero{
    padding:22px 18px; border-radius: var(--radius); margin-bottom:14px;
    background: radial-gradient(120% 100% at 50% 0%, #1B2A44 0%, #101929 70%);
    border:1px solid var(--line);
  }
  .train-hero .kicker{ font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-faint); margin-bottom:8px;}
  .train-hero h2{ font-family:'Anton',sans-serif; font-size:24px; margin:0 0 10px; font-weight:400; line-height:1.15;}
  .train-hero p{ font-size:13.5px; color:var(--text-dim); line-height:1.55; margin:0;}
  .passage-box{
    background: var(--bg-elev-2); border-left:3px solid var(--gold); border-radius:10px;
    padding:14px 15px; margin: 14px 0; font-size:14px; line-height:1.6; font-style:italic; color: var(--text);
  }
  .passage-box.play{ border-left-color: var(--teal); }
  .passage-box.say{ border-left-color: var(--coral); }
  .passage-ref{ font-style:normal; font-family:'Space Mono',monospace; font-size:10.5px; color:var(--text-faint); display:block; margin-top:8px; letter-spacing:0.04em;}
  .discover-q{ font-size:14.5px; font-weight:700; margin: 4px 0 10px; line-height:1.4; }
  .reveal-box{
    background: rgba(255,255,255,0.03); border:1px dashed var(--line); border-radius:10px; padding:13px 14px;
    font-size:13.5px; line-height:1.55; color: var(--text-dim); margin-top:10px; display:none;
  }
  .reveal-box.shown{ display:block; }
  .reveal-box b{ color: var(--text); }
  .example-box{
    margin-top:12px; padding:13px 14px; border-radius:10px;
    background: var(--gold-soft); border:1px solid rgba(232,178,61,0.25);
  }
  .example-box.play{ background: var(--teal-soft); border-color: rgba(47,182,165,0.25); }
  .example-box.say{ background: var(--coral-soft); border-color: rgba(232,93,78,0.25); }
  .example-box .exlbl{ font-size:10px; letter-spacing:0.12em; text-transform:uppercase; font-weight:700; margin-bottom:5px; }
  .example-box.pray .exlbl{ color: var(--gold); }
  .example-box.play .exlbl{ color: var(--teal); }
  .example-box.say .exlbl{ color: var(--coral); }
  .example-box .extext{ font-size:13px; line-height:1.5; color: var(--text); }
  .tnav{ display:flex; gap:10px; margin-top:18px; }
  .tnav .btn{ flex:1; }
  .quiz-progress{ font-family:'Space Mono',monospace; font-size:11px; color:var(--text-faint); margin-bottom:10px; text-align:center;}
  .quiz-q{ font-size:16px; font-weight:700; line-height:1.4; margin-bottom:16px; }
  .quiz-opt{
    display:block; width:100%; text-align:left; background: var(--bg-elev-2); border:1px solid var(--line);
    color:var(--text); padding:13px 14px; border-radius:12px; margin-bottom:10px; font-size:13.5px; cursor:pointer;
    font-family:'Work Sans',sans-serif; line-height:1.4;
  }
  .quiz-opt.correct{ border-color: var(--teal); background: var(--teal-soft); }
  .quiz-opt.incorrect{ border-color: var(--coral); background: var(--coral-soft); }
  .quiz-opt:disabled{ cursor:default; }
  .quiz-explain{
    background: rgba(255,255,255,0.03); border-radius:10px; padding:13px 14px; font-size:13px;
    line-height:1.5; color: var(--text-dim); margin: 6px 0 4px;
  }
  .quiz-explain b{ color: var(--text); }
  .score-hero{ text-align:center; padding: 30px 16px; }
  .score-ring{
    width:120px; height:120px; border-radius:50%; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center; position:relative;
    background: conic-gradient(var(--gold) calc(var(--pct)*1%), var(--line-soft) 0);
  }
  .score-ring::before{
    content:""; position:absolute; inset:8px; border-radius:50%; background: var(--bg);
  }
  .score-ring span{ position:relative; z-index:1; font-family:'Anton',sans-serif; font-size:26px; }
  .score-msg{ font-size:14px; color:var(--text-dim); margin-bottom:20px; line-height:1.5; }
  .recap-row{ display:flex; align-items:center; gap:12px; cursor:pointer; }

/* =========================================================
   Storage
   ---------------------------------------------------------
   The app was written against a `window.storage` API that does
   not exist in a browser, and every call to it sits inside a
   try/catch — so nothing was ever written, every read came back
   empty, and the streak, journal, badges, missions and stories
   all reset on reload without any visible error.

   This backs the exact same shape with real localStorage, so
   the rest of the code below is untouched. Everything stays on
   the device; nothing is sent anywhere.
   ========================================================= */
window.storage = window.storage || (function(){
  const P = 'pray-play-say-v1:';
  return {
    async get(key){
      try{
        const v = localStorage.getItem(P + key);
        return v === null ? null : { value: v };
      }catch(e){ return null; }
    },
    async set(key, value){
      try{ localStorage.setItem(P + key, value); }catch(e){}
    },
    async delete(key){
      try{ localStorage.removeItem(P + key); }catch(e){}
    }
  };
})();

function dayOfYear(d){

function getDay(dateStr){
  if(!dailyLog[dateStr]) dailyLog[dateStr] = { pray:false, play:false, say:false };
  return dailyLog[dateStr];
}
function isFullDay(dateStr){
  const d = dailyLog[dateStr];
  return !!(d && d.pray && d.play && d.say);
}
function computeStreak(){
  let streak = 0;
  let cursor = new Date();
  if(!isFullDay(fmtDate(cursor))){
    cursor.setDate(cursor.getDate()-1);
  }
  while(isFullDay(fmtDate(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function computeLongestStreak(){
  const dates = Object.keys(dailyLog).filter(isFullDay).sort();
  if(dates.length === 0) return 0;
  let longest = 1, run = 1;
  for(let i=1;i<dates.length;i++){
    const prev = new Date(dates[i-1]);
    const cur = new Date(dates[i]);
    const diff = Math.round((cur-prev)/86400000);
    if(diff === 1){ run++; } else { run = 1; }
    longest = Math.max(longest, run);
  }
  return Math.max(longest, computeStreak());
}
function computeCounts(){
  let pray=0, play=0, say=0, fullDays=0, activeDays=0;
  Object.values(dailyLog).forEach(d=>{
    if(d.pray) pray++;
    if(d.play) play++;
    if(d.say) say++;
    if(d.pray || d.play || d.say) activeDays++;
    if(d.pray && d.play && d.say) fullDays++;
  });
  return { pray, play, say, fullDays, activeDays };
}
function missionsDoneCount(){
  return Object.values(missions).filter(m=>m.done).length;
}
function computeBadgeState(){
  const counts = computeCounts();
  const s = {
    counts,
    journalCount: journal.length,
    fullDays: counts.fullDays,
    activeDays: counts.activeDays,
    longestStreak: computeLongestStreak(),
    missionsDone: missionsDoneCount(),
    storiesDone: Object.keys(storiesSeen).length,
    trainingDone: !!(profile && profile.trainingDone),
    otherUnlocked: 0
  };
  let unlockedIds = [];
  BADGE_DEFS.forEach(b=>{
    if(b.id === "full_squad") return;
    if(b.check(s)) unlockedIds.push(b.id);
  });
  s.otherUnlocked = unlockedIds.length;
  if(BADGE_DEFS.find(b=>b.id==="full_squad").check(s)) unlockedIds.push("full_squad");
  return { s, unlockedIds };
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}

   ========================================================= */
function renderHeader(){
  const streak = computeStreak();
  const padded = String(streak).padStart(2,"0");
  document.getElementById('streakDigits').innerHTML =
    padded.split("").map(c=>`<span class="digit"><b>${c}</b></span>`).join("");
  const c = computeCounts();
  document.getElementById('statPray').textContent = c.pray;
  document.getElementById('statPlay').textContent = c.play;
  document.getElementById('statSay').textContent = c.say;
  const day = getDay(todayStr());
  const doneCount = ["pray","play","say"].filter(k=>day[k]).length;
  document.querySelectorAll('#todayBar .seg').forEach(seg=>{
    const k = seg.getAttribute('data-k');
    seg.classList.toggle('on', !!day[k]);
    seg.classList.toggle(k, !!day[k]);
  });
  document.getElementById('todayCap').textContent = `${doneCount} of 3 done today`;
  document.getElementById('nameBtn').textContent = profile.name ? profile.name : "Set name";
}

function renderTraining(el){
  // Returning, already-trained users land on a recap screen unless
  // they're mid-way through a fresh run (trainingStep > 0).
  if(profile.trainingDone && trainingStep === 0){
    return renderTrainingRecap(el);
  }
  if(trainingStep === 0) return renderTrainingIntro(el);
  if(trainingStep === 1) return renderDiscovery(el, 'pray', 2);
  if(trainingStep === 2) return renderDiscovery(el, 'play', 3);
  if(trainingStep === 3) return renderDiscovery(el, 'say', 4);
  if(trainingStep === 4) return renderQuizQuestion(el);
  if(trainingStep === 5) return renderQuizResults(el);
}
function trainingDots(activeIndex, total){
  let dots = '';
  for(let i=0;i<total;i++){
    const cls = i < activeIndex ? 'past' : (i === activeIndex ? 'on' : '');
    dots += `<div class="tdot ${cls}"></div>`;
  }
  return `<div class="tdots">${dots}</div>`;
}

function renderQuizQuestion(el){
  if(quizIndex === 0 && quizAnswers.length === 0){ /* fresh start, nothing to reset here */ }
  const total = QUIZ.length;
  const q = QUIZ[quizIndex];
  const answeredAlready = quizAnswers[quizIndex] !== undefined;
  el.innerHTML = `
    ${trainingDots(4,6)}
    <div class="section-head">
      <div><span class="eyebrow">Quick Quiz</span><h1 style="font-size:22px;">Lock It In</h1></div>
    </div>
    <div class="quiz-progress">QUESTION ${quizIndex+1} OF ${total}</div>
    <div class="card">
      <div class="quiz-q">${q.q}</div>
      <div id="quizOpts">
        ${q.options.map((opt,i)=>`<button class="quiz-opt" data-i="${i}">${opt}</button>`).join('')}
      </div>
      <div id="quizFeedback"></div>
    </div>
    <div class="tnav" id="quizNavRow" style="display:none;">
      <button class="btn btn-block btn-say" id="quizNext">${quizIndex === total-1 ? 'See My Score' : 'Next Question'}</button>
    </div>
  `;
  function showFeedback(selectedIndex){
    const opts = el.querySelectorAll('.quiz-opt');
    opts.forEach((btn,i)=>{
      btn.disabled = true;
      if(i === q.correct) btn.classList.add('correct');
      else if(i === selectedIndex) btn.classList.add('incorrect');
    });
    document.getElementById('quizFeedback').innerHTML = `
      <div class="quiz-explain"><b>${selectedIndex === q.correct ? "That's it. " : "Not quite — "}</b>${q.explain}</div>
    `;
    document.getElementById('quizNavRow').style.display = 'flex';
  }
  if(answeredAlready){
    showFeedback(quizAnswers[quizIndex]);
  } else {
    el.querySelectorAll('.quiz-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = parseInt(btn.getAttribute('data-i'),10);
        quizAnswers[quizIndex] = i;
        showFeedback(i);
      });
    });
  }
  document.getElementById('quizNext').addEventListener('click', ()=>{
    if(quizIndex < total-1){
      quizIndex += 1;
      render();
    } else {
      trainingStep = 5;
      render();
    }
  });
}
async function renderQuizResults(el){
  const total = QUIZ.length;
  const correctCount = quizAnswers.filter((a,i)=>a===QUIZ[i].correct).length;

  profile.trainingDone = true;
  profile.quizScore = correctCount;
  await saveProfile();
  await checkNewBadges();
  const msg = correctCount === total
    ? "Perfect score. You've got Pray, Play, and Say down cold."
    : correctCount >= Math.ceil(total*0.6)
      ? "Solid! You've got the core idea — feel free to revisit any part."
      : "Good starting point — consider a quick replay of the discovery pages.";
  el.innerHTML = `
    ${trainingDots(5,6)}

        <div class="bn">Playbook Complete</div>
      </div>
    </div>
    <div class="tnav">
      <button class="btn btn-ghost" id="tRetake">Retake Quiz</button>
      <button class="btn btn-block btn-pray" id="tFinish">Go to Today's Challenge</button>

  `;
  document.getElementById('tRetake').addEventListener('click', ()=>{
    quizIndex = 0;
    quizAnswers = [];

  const day = getDay(todayStr());
  const cards = [
    { key:'pray', label:'Pray', text: PRAY_PROMPTS[idxPray], verse: "Colossians 4:2 — devote yourselves to prayer.", num: idxPray+1, total: PRAY_PROMPTS.length },
    { key:'play', label:'Play', text: PLAY_PROMPTS[idxPlay], verse: "Colossians 4:5 — be wise in how you act.", num: idxPlay+1, total: PLAY_PROMPTS.length },
    { key:'say', label:'Say', text: SAY_PROMPTS[idxSay], verse: "Colossians 4:6 — let your speech be gracious.", num: idxSay+1, total: SAY_PROMPTS.length }
  ];
  const allDone = day.pray && day.play && day.say;
  el.innerHTML = `
    <div class="section-head">
      <div>
        <span class="eyebrow">Daily Challenge Cards</span>
        <h1>Today's Set</h1>
      </div>
    </div>
    <div class="challenge-stack">
      ${cards.map(c => `
        <div class="ccard ${c.key} ${day[c.key] ? 'done' : ''}">
          <div class="row1">
            <span class="tag ${c.key}">${c.label}</span>
            <span class="num">${c.num}/${c.total}</span>
          </div>
          <div class="ctext">${c.text}</div>
          <div class="verse">${c.verse}</div>
          <button class="btn btn-block ${day[c.key] ? 'btn-done' : 'btn-'+c.key}" data-done="${c.key}" ${day[c.key] ? 'disabled' : ''}>
            ${day[c.key] ? '✓ Done today' : 'Mark Done'}
          </button>
        </div>
      `).join('')}
    </div>
    ${allDone ? `
      <div class="all-done-banner">
        <div class="big">🔥 Full Day Complete</div>
        <div class="small">Pray, Play, and Say — all logged. Your streak keeps rolling.</div>
      </div>
    ` : ''}
    <p class="footnote">New challenges roll over every day. Miss a day? No shame — just pick back up tomorrow.</p>
  `;
  el.querySelectorAll('[data-done]').forEach(btn=>{

      await checkNewBadges();
      render();
    });
  });
}

function weekKey(){
  const d = new Date();
  const onejan = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
  return d.getFullYear() + "-W" + week;
}
function renderMissions(el){
  const wk = weekKey();
  const doy = dayOfYear(new Date());
  const weekNum = Math.floor(doy/7) % WEEKLY_MISSIONS.length;
  const mission = WEEKLY_MISSIONS[weekNum];
  if(!missions[wk]) missions[wk] = { reflection:"", done:false, doneAt:null, title: mission.title };
  const state = missions[wk];
  const pastWeeks = Object.keys(missions).filter(k=>k!==wk && missions[k].done).sort().reverse();
  el.innerHTML = `
    <div class="section-head">
      <div><span class="eyebrow">Weekly Mission Quest</span><h1>This Week</h1></div>
    </div>
    <div class="mission-hero">
      <div class="mission-week mono">${wk}</div>
      <h2>${mission.title}</h2>
      <div class="mtask"><span class="mtag tag pray">Pray</span><span class="mtext">${mission.pray}</span></div>
      <div class="mtask"><span class="mtag tag play">Play</span><span class="mtext">${mission.play}</span></div>
      <div class="mtask"><span class="mtag tag say">Say</span><span class="mtext">${mission.say}</span></div>
    </div>
    <div class="card">
      <label class="flabel">Reflection — text or describe your video</label>
      <textarea id="missionReflect" rows="4" placeholder="What happened when you tried this mission? (A file picker below lets you preview a video on this device — it isn't uploaded or saved.)">${state.reflection || ''}</textarea>
      <input type="file" id="missionVideo" accept="video/*" style="margin-bottom:10px;font-size:11px;color:var(--text-faint);">
      <video id="missionVideoPreview" style="width:100%;border-radius:10px;display:none;margin-bottom:10px;" controls></video>
      ${state.done
        ? `<button class="btn btn-block btn-done" disabled>✓ Mission Complete</button>`
        : `<button class="btn btn-block btn-say" id="missionSubmit">Mark Mission Complete</button>`
      }
    </div>
    ${pastWeeks.length ? `
      <div class="section-head" style="margin-top:22px;"><div><span class="eyebrow">Completed</span><h1 style="font-size:19px;">Past Missions</h1></div></div>
      ${pastWeeks.map(k=>`
        <div class="card">
          <div class="mono" style="font-size:10.5px;color:var(--text-faint);margin-bottom:4px;">${k}</div>
          <h3 style="font-size:14.5px;">${missions[k].title}</h3>
          <p style="margin:0;">${escapeHtml(missions[k].reflection || 'No reflection written.')}</p>
        </div>
      `).join('')}
    ` : ''}
  `;
  const videoInput = document.getElementById('missionVideo');
  const preview = document.getElementById('missionVideoPreview');
  videoInput.addEventListener('change', ()=>{
    if(videoInput.files && videoInput.files[0]){
      preview.src = URL.createObjectURL(videoInput.files[0]);
      preview.style.display = 'block';
    }
  });
  const submitBtn = document.getElementById('missionSubmit');
  if(submitBtn){
    submitBtn.addEventListener('click', async ()=>{
      const text = document.getElementById('missionReflect').value.trim();
      missions[wk].reflection = text;
      missions[wk].done = true;
      missions[wk].doneAt = todayStr();
      missions[wk].title = mission.title;
      await saveMissions();
      toast('Weekly mission complete 🎯');
      await checkNewBadges();
      render();
    });
  }
}
function renderProgress(el){
  const { s, unlockedIds } = computeBadgeState();
  const streak = computeStreak();
  const longest = computeLongestStreak();
  el.innerHTML = `
    <div class="section-head">
      <div><span class="eyebrow">Your Progress</span><h1>Scoreboard</h1></div>
    </div>
    <div class="streak-hero">
      <div class="n">${streak}</div>
      <div class="l">Current Day Streak</div>
      <div class="best">Longest streak: <b class="mono" style="color:var(--text);">${longest} days</b></div>
    </div>
    <div class="section-head"><div><span class="eyebrow">${unlockedIds.length}/${BADGE_DEFS.length} Unlocked</span><h1 style="font-size:19px;">Badges</h1></div></div>
    <div class="badge-grid">
      ${BADGE_DEFS.map(b=>`
        <div class="badge ${unlockedIds.includes(b.id) ? 'unlocked' : ''}">
          <div class="bic">${b.ic}</div>
          <div class="bn">${b.name}</div>
          <div class="bd">${b.desc}</div>
        </div>
      `).join('')}
    </div>
    <div class="section-head"><div><span class="eyebrow">Milestone</span><h1 style="font-size:19px;">Certificate</h1></div></div>
    <div class="card cert-wrap">
      <p>Generate a certificate for your current streak or badge count — download it to share or print.</p>
      <canvas id="certCanvas" width="900" height="620"></canvas>
      <button class="btn btn-block btn-pray" id="certDownload">Download Certificate</button>
    </div>
  `;
  drawCertificate(document.getElementById('certCanvas'), profile.name || 'Player', longest, unlockedIds.length);
  document.getElementById('certDownload').addEventListener('click', ()=>{
    const canvas = document.getElementById('certCanvas');
    const link = document.createElement('a');
    link.download = 'pray-play-say-certificate.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}
function drawCertificate(canvas, name, longestStreak, badgeCount){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const grad = ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0, '#0E1727');
  grad.addColorStop(1, '#0B1220');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = '#E8B23D';
  ctx.lineWidth = 4;
  ctx.strokeRect(24,24,w-48,h-48);
  ctx.strokeStyle = '#253248';
  ctx.lineWidth = 1;
  ctx.strokeRect(38,38,w-76,h-76);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8B96AC';
  ctx.font = '20px "Space Mono", monospace';
  ctx.fillText('PRAY · PLAY · SAY · TOGETHER', w/2, 100);
  ctx.fillStyle = '#EDEFF4';
  ctx.font = '54px Anton, sans-serif';
  ctx.fillText('CERTIFICATE OF FAITHFULNESS', w/2, 170);
  ctx.fillStyle = '#8B96AC';
  ctx.font = '18px "Work Sans", sans-serif';
  ctx.fillText('This certifies that', w/2, 240);
  ctx.fillStyle = '#E8B23D';
  ctx.font = '46px Anton, sans-serif';
  ctx.fillText(name.toUpperCase(), w/2, 305);
  ctx.fillStyle = '#C9CEDA';
  ctx.font = '18px "Work Sans", sans-serif';
  ctx.fillText('has trained faithfully in prayer, play, and speech,', w/2, 350);
  ctx.fillText('honoring Colossians 4:2–6 on and off the field.', w/2, 376);
  ctx.font = '16px "Space Mono", monospace';
  ctx.fillStyle = '#2FB6A5';
  ctx.fillText(`LONGEST STREAK: ${longestStreak} DAYS      BADGES UNLOCKED: ${badgeCount}`, w/2, 430);
  ctx.fillStyle = '#5B6579';
  ctx.font = '13px "Space Mono", monospace';
  ctx.fillText(new Date().toDateString(), w/2, 560);
  ctx.font = '30px sans-serif';
  ctx.fillText('🏅', w/2 - 200, 500);
  ctx.fillText('🙏', w/2, 500);
  ctx.fillText('🏃', w/2 + 200, 500);
}
async function checkNewBadges(){
  // recompute silently; toasts for streak milestones are handled elsewhere.
  const { unlockedIds } = computeBadgeState();
  let prevUnlocked = [];
  try{
    const p = await window.storage.get('badges-cache');
    if(p && p.value) prevUnlocked = JSON.parse(p.value);
  }catch(e){}
  const newOnes = unlockedIds.filter(id => !prevUnlocked.includes(id));
  if(newOnes.length){
    const def = BADGE_DEFS.find(b=>b.id===newOnes[0]);
    toast(`🏅 New badge: ${def.name}`);
  }
  try{ await window.storage.set('badges-cache', JSON.stringify(unlockedIds), false); }catch(e){}
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
/* =========================================================
   Onboarding
   ========================================================= */
function showOnboarding(){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h2>Welcome to the Squad</h2>
      <p>Pray | Play | Say helps you connect your faith with your sport — one day at a time. What should we call you on your certificates and badges?</p>
      <input type="text" id="onName" placeholder="Your first name" maxlength="24">
      <button class="btn btn-block btn-pray" id="onSave">Start Training</button>
    </div>
  `;
  document.body.appendChild(backdrop);
  document.getElementById('onSave').addEventListener('click', async ()=>{
    const val = document.getElementById('onName').value.trim();
    profile.name = val || 'Player';
    await saveProfile();
    document.body.removeChild(backdrop);
    currentView = 'training';
    trainingStep = 0;
    render();
  });
}
function showNamePrompt(){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h2>Update Name</h2>
      <p>This shows on your certificate and around the app.</p>
      <input type="text" id="onName2" placeholder="Your first name" maxlength="24" value="${profile.name || ''}">
      <button class="btn btn-block btn-pray" id="onSave2">Save</button>
    </div>
  `;
  document.body.appendChild(backdrop);
  document.getElementById('onSave2').addEventListener('click', async ()=>{
    const val = document.getElementById('onName2').value.trim();
    profile.name = val || 'Player';
    await saveProfile();
    document.body.removeChild(backdrop);
    render();
  });
}
/* =========================================================
   Init
   ========================================================= */
document.querySelectorAll('.navbtn').forEach(b=>{
  b.addEventListener('click', ()=>{
    currentView = b.getAttribute('data-view');
    render();
  });
});
document.getElementById('nameBtn').addEventListener('click', showNamePrompt);
(async function init(){
  await loadState();
  if(onboarded && !profile.trainingDone){
    currentView = 'training';
  }
  render();
  if(!onboarded){ showOnboarding(); }
})();
</script>
