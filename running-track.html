<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Track</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#fff; --dim:rgba(255,255,255,0.7); --cy:#7fd4ff; }
  *{box-sizing:border-box}
  html,body{
    margin:0; height:100%; overflow:hidden; background:#0b1830;
    font-family:"Archivo",system-ui,-apple-system,sans-serif;
    color:var(--ink); touch-action:none; -webkit-font-smoothing:antialiased;
  }
  canvas{position:fixed; inset:0; display:block}
  #hit{position:fixed; inset:0; z-index:2; cursor:grab}
  #hit.grabbing{cursor:grabbing}
  #hit:focus-visible{outline:2px solid var(--cy); outline-offset:-6px}

  .chrome{position:fixed; z-index:3; pointer-events:none}
  #brand{
    top:max(16px,env(safe-area-inset-top)); left:0; right:0; text-align:center;
    font-size:11px; font-weight:600; letter-spacing:.34em; text-transform:uppercase;
    color:rgba(255,255,255,0.45);
  }
  #read{
    top:max(14px,env(safe-area-inset-top)); left:max(18px,env(safe-area-inset-left));
    font-variant-numeric:tabular-nums;
  }
  #read b{
    display:block; font-size:26px; font-weight:800; line-height:1; letter-spacing:-0.01em;
  }
  #read span{
    display:block; margin-top:4px; font-size:10px; font-weight:600; letter-spacing:.2em;
    text-transform:uppercase; color:rgba(255,255,255,0.42);
  }
  #hint{
    bottom:calc(18px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center;
    font-size:11px; font-weight:500; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(255,255,255,0.38);
  }

  #run{
    position:fixed; z-index:4; right:max(18px,env(safe-area-inset-right));
    bottom:calc(18px + env(safe-area-inset-bottom));
    font:800 13px/1 "Archivo",system-ui,sans-serif; letter-spacing:.22em; text-transform:uppercase;
    color:#04121f; background:var(--cy); border:0; border-radius:999px;
    padding:15px 26px; cursor:pointer; box-shadow:0 8px 28px rgba(20,140,220,.35);
    transition:background .2s ease, transform .12s ease;
  }
  #run:hover{background:#a5e2ff}
  #run:active{transform:translateY(1px)}
  #run[aria-pressed="true"]{background:#fff}
  #run:focus-visible{outline:2px solid #fff; outline-offset:3px}

  #boot{
    position:fixed; inset:0; z-index:9; display:grid; place-items:center;
    background:#0b1830; text-align:center; padding:28px; transition:opacity .8s ease;
    font-size:11px; font-weight:600; letter-spacing:.3em; text-transform:uppercase;
    color:rgba(255,255,255,0.45);
  }
  #boot.gone{opacity:0; pointer-events:none}
  #fallback{
    position:fixed; inset:0; z-index:20; display:none; place-items:center;
    background:#0b1830; padding:32px; text-align:center;
    font-size:14px; line-height:1.6; color:rgba(255,255,255,.7);
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="hit" tabindex="0" role="application"
     aria-label="A running track you can move along. Drag to look, arrow keys or the run button to move."></div>

<div class="chrome" id="brand">Youth Sports Bible</div>
<div class="chrome" id="read"><b>0 m</b><span>Lane 4</span></div>
<div class="chrome" id="hint">Drag to look &middot; scroll, arrows or RUN to move</div>
<button id="run" type="button" aria-pressed="false">Run</button>

<div id="boot">Building the stadium&hellip;</div>
<div id="fallback">This page needs WebGL. Try a different browser or device.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

const boot = document.getElementById('boot');
if (!window.THREE){ document.getElementById('fallback').style.display='grid'; boot.classList.add('gone'); return; }

/* ============================================================
   The track, to the real measurements.

   IAAF 400m: 36.50 m inner radius, 84.39 m straights, eight lanes
   at 1.22 m. One unit here is one metre, so everything downstream —
   eye height, stand rake, how far the fog reaches — can be set in
   numbers you can picture.
   ============================================================ */
const R0 = 36.50, STRAIGHT = 84.39, LANE = 1.22, NLANES = 8;
const TRACK_W = LANE*NLANES;
const BEND = Math.PI*R0;
const LAP = 2*STRAIGHT + 2*BEND;

// position, tangent and outward normal at s metres along the inner edge
const _p = new THREE.Vector2(), _t = new THREE.Vector2(), _n = new THREE.Vector2();
function pathAt(s, out){
  s = ((s % LAP) + LAP) % LAP;
  const o = out || { p:new THREE.Vector2(), t:new THREE.Vector2(), n:new THREE.Vector2() };
  if (s < STRAIGHT){
    o.p.set(-STRAIGHT/2 + s, R0); o.t.set(1, 0); o.n.set(0, 1);
  } else if (s < STRAIGHT + BEND){
    const f = (s - STRAIGHT)/R0;
    o.p.set(STRAIGHT/2 + R0*Math.sin(f), R0*Math.cos(f));
    o.t.set(Math.cos(f), -Math.sin(f));
    o.n.set(Math.sin(f), Math.cos(f));
  } else if (s < 2*STRAIGHT + BEND){
    const d = s - STRAIGHT - BEND;
    o.p.set(STRAIGHT/2 - d, -R0); o.t.set(-1, 0); o.n.set(0, -1);
  } else {
    const f = (s - 2*STRAIGHT - BEND)/R0;
    o.p.set(-STRAIGHT/2 - R0*Math.sin(f), -R0*Math.cos(f));
    o.t.set(-Math.cos(f), Math.sin(f));
    o.n.set(-Math.sin(f), -Math.cos(f));
  }
  return o;
}
// world point at s metres along, a metres out across the lanes, h metres up
function trackPoint(s, a, h, out){
  const o = pathAt(s, _pt);
  return (out || new THREE.Vector3()).set(o.p.x + a*o.n.x, h || 0, o.p.y + a*o.n.y);
}
const _pt = { p:new THREE.Vector2(), t:new THREE.Vector2(), n:new THREE.Vector2() };

/* ============================================================
   Palette — flat, graphic, one family of blues
   ============================================================ */
const C = {
  skyTop:   new THREE.Color('#14325c'),
  skyMid:   new THREE.Color('#3b6ea5'),
  skyLow:   new THREE.Color('#cfe2f0'),
  horizon:  new THREE.Color('#e9f2f8'),
  track:    new THREE.Color('#21406c'),
  trackIn:  new THREE.Color('#1a3459'),
  line:     new THREE.Color('#eef5fb'),
  trace:    new THREE.Color('#5fb6ff'),
  infield:  new THREE.Color('#152b48'),
  standDk:  new THREE.Color('#132844'),
  fog:      new THREE.Color('#b9d3e6')
};
C.standMd = new THREE.Color('#1d3a61');
C.standLt = new THREE.Color('#2a5183');
C.white   = new THREE.Color('#eef5fb');
C.steel   = new THREE.Color('#c8d8e6');

/* ============================================================
   Scene
   ============================================================ */
const canvas = document.getElementById('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
} catch(e){
  document.getElementById('fallback').style.display='grid'; boot.classList.add('gone'); return;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
// No output encoding: the track and sky are custom shaders that write their
// colours straight out, so converting the built-in materials would light the
// stands two stops brighter than the surface they sit beside.

const scene = new THREE.Scene();
const FOG_NEAR = 120, FOG_FAR = 520;
scene.fog = new THREE.Fog(C.fog.getHex(), FOG_NEAR, FOG_FAR);

const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 900);

scene.add(new THREE.HemisphereLight(0xcfe4f5, 0x0d1c30, 0.85));
const sun = new THREE.DirectionalLight(0xfff2dc, 0.75);
sun.position.set(-120, 90, 180);
scene.add(sun);

/* ---------- sky ---------- */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(600, 32, 20),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uTop:{value:C.skyTop}, uMid:{value:C.skyMid},
      uLow:{value:C.skyLow}, uHor:{value:C.horizon}
    },
    vertexShader: `varying vec3 vD;
      void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vD;
      uniform vec3 uTop, uMid, uLow, uHor;
      void main(){
        float h = clamp(vD.y, -1.0, 1.0);
        vec3 c = mix(uLow, uMid, smoothstep(0.0, 0.34, h));
        c = mix(c, uTop, smoothstep(0.30, 0.9, h));
        c = mix(uHor, c, smoothstep(-0.02, 0.10, h));      // pale band on the skyline
        c = mix(c, uHor*0.92, smoothstep(0.0, -0.25, h));  // below the skyline
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
sky.frustumCulled = false;
scene.add(sky);

/* ============================================================
   Track surface — the lane lines are drawn in the shader from the
   across-lane coordinate, so they stay a clean 5 cm at any distance
   instead of turning to mush in a texture's mip chain.
   ============================================================ */
function traceTexture(){
  const S = 1024, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0,0,S,S);
  g.lineCap = 'square'; g.lineJoin = 'miter';
  // circuit tracery: runs of right-angled lines with a node at the end
  for (let i=0;i<150;i++){
    let x = Math.random()*S, y = Math.random()*S;
    const bright = 26 + Math.random()*60;
    g.strokeStyle = 'rgb(' + (bright*0.5|0) + ',' + (bright*0.8|0) + ',' + (bright|0) + ')';
    g.lineWidth = 1 + Math.random()*1.6;
    g.beginPath(); g.moveTo(x, y);
    const legs = 2 + (Math.random()*3|0);
    for (let k=0;k<legs;k++){
      const len = 20 + Math.random()*150;
      if (k % 2 === 0) x += (Math.random() < 0.5 ? -len : len);
      else             y += (Math.random() < 0.5 ? -len : len);
      g.lineTo(x, y);
    }
    g.stroke();
    g.fillStyle = 'rgb(' + (bright*0.6|0) + ',' + (bright*0.9|0) + ',' + (bright*1.2|0) + ')';
    g.beginPath(); g.arc(x, y, 2 + Math.random()*3, 0, Math.PI*2); g.fill();
  }
  // a little dust so the rubber is not perfectly flat
  for (let i=0;i<9000;i++){
    const v = Math.random()*16|0;
    g.fillStyle = 'rgb(' + v + ',' + v + ',' + (v+4) + ')';
    g.fillRect(Math.random()*S, Math.random()*S, 2, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const trackMat = new THREE.ShaderMaterial({
  extensions: { derivatives: true },
  uniforms: {
    uBase:{value:C.track}, uBaseIn:{value:C.trackIn}, uLine:{value:C.line},
    uTrace:{value:traceTexture()}, uTraceCol:{value:C.trace},
    uFogCol:{value:C.fog}, uFogNear:{value:FOG_NEAR}, uFogFar:{value:FOG_FAR},
    uLap:{value:LAP}, uLanes:{value:NLANES}
  },
  vertexShader: `
    varying vec2 vUv; varying float vDist;
    void main(){
      vUv = uv;
      vec4 mv = modelViewMatrix*vec4(position,1.0);
      vDist = -mv.z;
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader: `
    varying vec2 vUv; varying float vDist;
    uniform vec3 uBase, uBaseIn, uLine, uTraceCol, uFogCol;
    uniform sampler2D uTrace;
    uniform float uFogNear, uFogFar, uLap, uLanes;

    float band(float x, float hw){          // 'half' is a reserved word in GLSL
      float aa = fwidth(x)*0.7 + 1e-6;
      return 1.0 - smoothstep(hw - aa, hw + aa, abs(x));
    }
    void main(){
      float lane = vUv.x;                       // 0..8 across the lanes
      float met  = vUv.y;                       // metres along the track

      vec3 col = mix(uBaseIn, uBase, clamp(lane/uLanes, 0.0, 1.0));
      col *= 0.94 + 0.06*sin(lane*3.1415);      // the faintest sheen down each lane

      vec3 tr = texture2D(uTrace, vec2(lane/uLanes*1.6, met/26.0)).rgb;
      col += tr*uTraceCol*0.55;

      // lane lines: 5 cm, so 0.0205 of a lane either side of each integer
      float dl = abs(lane - floor(lane + 0.5));
      float lines = band(dl, 0.0205);

      // the finish line
      float fin = band(min(met, uLap - met), 0.05);
      col = mix(col, uLine, clamp(lines + fin, 0.0, 1.0));

      float f = smoothstep(uFogNear, uFogFar, vDist);
      gl_FragColor = vec4(mix(col, uFogCol, f), 1.0);
    }`
});

function buildTrack(){
  const N = 900;                       // samples round the lap
  const pos = [], uv = [], idx = [];
  const o = { p:new THREE.Vector2(), t:new THREE.Vector2(), n:new THREE.Vector2() };
  for (let i=0;i<=N;i++){
    const s = i/N*LAP;
    pathAt(s, o);
    for (let j=0;j<=1;j++){
      const a = j*TRACK_W;
      pos.push(o.p.x + a*o.n.x, 0, o.p.y + a*o.n.y);
      uv.push(j*NLANES, s);
    }
  }
  for (let i=0;i<N;i++){                  // wound so the surface faces up, not down
    const a = i*2, b = a + 2;
    idx.push(a, a+1, b, b, a+1, b+1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return new THREE.Mesh(g, trackMat);
}
scene.add(buildTrack());

/* ---------- the ground the whole thing stands on ---------- */
(function ground(){
  const g = new THREE.Mesh(
    new THREE.CircleGeometry(420, 64),
    new THREE.MeshLambertMaterial({color:0x17314f})
  );
  g.rotation.x = -Math.PI/2;
  g.position.y = -0.06;
  scene.add(g);

  // a paler apron ring just outside the track, as the reference has
  const apron = new THREE.Mesh(
    new THREE.RingGeometry(0, 1, 4),
    new THREE.MeshLambertMaterial({color:0x1b3758})
  );
  apron.visible = false; scene.add(apron);
})();

/* ---------- infield and the kerb round it ---------- */
(function infield(){
  const shape = new THREE.Shape();
  const o = { p:new THREE.Vector2(), t:new THREE.Vector2(), n:new THREE.Vector2() };
  for (let i=0;i<=360;i++){
    pathAt(i/360*LAP, o);
    i === 0 ? shape.moveTo(o.p.x, o.p.y) : shape.lineTo(o.p.x, o.p.y);
  }
  const g = new THREE.ShapeGeometry(shape);
  g.rotateX(-Math.PI/2);        // ShapeGeometry faces +z; lay it flat facing up
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({color:C.infield}));
  m.position.y = -0.02;
  scene.add(m);

  // the raised white kerb
  const pts = [], N = 480;
  for (let i=0;i<=N;i++){
    const s = i/N*LAP; pathAt(s, o);
    pts.push(new THREE.Vector3(o.p.x, 0.03, o.p.y));
  }
  const curve = new THREE.CatmullRomCurve3(pts, true);
  const kerb = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 480, 0.05, 5, true),
    new THREE.MeshLambertMaterial({color:C.white})
  );
  scene.add(kerb);
})();

/* ============================================================
   Stands — one staircase profile swept right round the oval, so
   the bowl is continuous and the bends are not bare walls. Treads
   and risers carry their own vertex colours, which is what makes
   the rows read; a single extruded slab lights as one flat face.
   ============================================================ */
const ROWS = 17, RISE = 0.42, TREAD = 0.78, FRONT = 3.4, WALL = 1.25;

function standProfile(){
  const DK = new THREE.Color(0x132944), LT = new THREE.Color(0x2a507e),
        WH = new THREE.Color(0xdce9f4), TP = new THREE.Color(0x1b3757);
  const p = [];
  const add = (d, h, c) => p.push({ d, h, c });
  add(FRONT, 0,        DK);
  add(FRONT, WALL,     DK);
  add(FRONT, WALL+0.22, WH);           // the white band along the front wall
  add(FRONT+0.9, WALL+0.22, LT);
  let d = FRONT + 0.9, h = WALL + 0.22;
  for (let r=0;r<ROWS;r++){
    h += RISE;  add(d, h, DK);         // riser
    d += TREAD; add(d, h, LT);         // tread
  }
  add(d + 1.8, h, TP);                 // top walkway
  add(d + 1.8, h + 0.9, WH);           // a lit rail along the back
  add(d + 2.0, h + 0.9, TP);
  add(d + 2.0, 0, DK);                 // back wall, straight down
  return { pts: p, back: d + 2.0, top: h };
}

const PROF = standProfile();

(function bowl(){
  const N = 520, M = PROF.pts.length;
  const pos = [], col = [], idx = [];
  const o = { p:new THREE.Vector2(), t:new THREE.Vector2(), n:new THREE.Vector2() };
  for (let i=0;i<=N;i++){
    pathAt(i/N*LAP, o);
    for (let j=0;j<M;j++){
      const q = PROF.pts[j], a = TRACK_W + q.d;
      pos.push(o.p.x + a*o.n.x, q.h, o.p.y + a*o.n.y);
      col.push(q.c.r, q.c.g, q.c.b);
    }
  }
  for (let i=0;i<N;i++) for (let j=0;j<M-1;j++){
    const a = i*M + j, b = (i+1)*M + j;
    idx.push(a, b, a+1, b, b+1, a+1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  // Lambert is Gouraud — per vertex — so it has no flatShading to set. The rows
  // read off the vertex colours instead, which is crisper anyway.
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({
    vertexColors:true, side:THREE.DoubleSide
  })));
})();

const standA = { back: PROF.back, top: PROF.top };

/* ---------- the cantilever roof over the home straight ---------- */
(function roof(){
  const len = STRAIGHT + 46;
  const z0 = R0 + TRACK_W;
  const slab = new THREE.Mesh(
    new THREE.BoxGeometry(len, 0.5, standA.back - 1.2),
    new THREE.MeshLambertMaterial({color:0x122a47})
  );
  slab.position.set(0, standA.top + 5.6, z0 + standA.back/2 + 1.8);
  slab.rotation.x = -0.07;
  scene.add(slab);

  const edge = new THREE.Mesh(
    new THREE.BoxGeometry(len, 0.75, 0.55),
    new THREE.MeshLambertMaterial({color:C.white})
  );
  edge.position.set(0, standA.top + 5.3, z0 + 2.1);
  scene.add(edge);

  for (const x of [-len/2 + 6, -len/6, len/6, len/2 - 6]){
    const col = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, standA.top + 5.6, 0.8),
      new THREE.MeshLambertMaterial({color:0x16304f})
    );
    col.position.set(x, (standA.top + 5.6)/2, z0 + standA.back - 0.6);
    scene.add(col);
  }
})();

/* ---------- the bowl ends: a low wall plus the scoreboard ---------- */
(function ends(){
  // scoreboard beyond the far bend
  const board = new THREE.Group();
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(22, 11, 1.2),
    new THREE.MeshLambertMaterial({color:C.standDk})
  );
  const face = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 9),
    new THREE.MeshBasicMaterial({color:0x0d2036})
  );
  face.position.z = 0.65;
  board.add(frame, face);
  for (const x of [-8, 8]){
    const leg = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 15, 1.1),
      new THREE.MeshLambertMaterial({color:C.standDk})
    );
    leg.position.set(x, -13, 0); board.add(leg);
  }
  board.position.set(STRAIGHT/2 + R0 + 26, 19.5, 0);
  board.rotation.y = -Math.PI/2;
  scene.add(board);
})();

/* ---------- floodlights ---------- */
(function lights(){
  const lampTex = (function(){
    const W = 128, H = 96, c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = '#16304e'; g.fillRect(0,0,W,H);
    for (let y=0;y<5;y++) for (let x=0;x<7;x++){
      g.fillStyle = '#dbeaf7';
      g.fillRect(6 + x*17, 6 + y*18, 12, 13);
    }
    return new THREE.CanvasTexture(c);
  })();
  const mastMat = new THREE.MeshLambertMaterial({color:C.standMd});
  for (const [x, z] of [[-STRAIGHT/2 - 18, R0 + 42], [STRAIGHT/2 + 18, R0 + 42],
                        [-STRAIGHT/2 - 18, -R0 - 42], [STRAIGHT/2 + 18, -R0 - 42]]){
    const g = new THREE.Group();
    const mast = new THREE.Mesh(new THREE.BoxGeometry(1.1, 34, 1.1), mastMat);
    mast.position.y = 17; g.add(mast);
    const shell = new THREE.MeshLambertMaterial({color:C.standDk});
    const head = new THREE.Mesh(new THREE.BoxGeometry(9, 6.5, 0.8), [
      shell, shell, shell, shell,
      new THREE.MeshBasicMaterial({map:lampTex}),   // the lamps face the infield
      shell
    ]);
    head.position.y = 36; g.add(head);
    g.position.set(x, 0, z);
    g.lookAt(0, 30, 0);
    scene.add(g);
  }
})();

/* ---------- starting blocks on the line ---------- */
(function blocks(){
  const steel = new THREE.MeshLambertMaterial({color:C.steel});
  const dark  = new THREE.MeshLambertMaterial({color:C.standDk});
  for (let i=0;i<NLANES;i++){
    const g = new THREE.Group();
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.09, 1.05), steel);
    rail.position.y = 0.06; g.add(rail);
    const base = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.05, 0.30), steel);
    base.position.set(0, 0.03, 0.52); g.add(base);
    for (const [z, tilt, h] of [[0.10, 0.72, 0.22], [0.42, 0.62, 0.19]]){
      const pad = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.05, h), dark);
      pad.position.set(0, h*0.42, z); pad.rotation.x = tilt; g.add(pad);
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.07, 0.16), steel);
      foot.position.set(0, 0.04, z + 0.10); g.add(foot);
    }
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.26, 0.05), steel);
    post.position.set(0.20, 0.13, 0.28); g.add(post);
    const plate = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.16, 0.20), dark);
    plate.position.set(0.22, 0.30, 0.28); g.add(plate);

    const a = (i + 0.5)*LANE;
    const o = pathAt(LAP - 0.9, _pt);
    g.position.set(o.p.x + a*o.n.x, 0, o.p.y + a*o.n.y);
    g.rotation.y = Math.atan2(o.t.x, o.t.y);
    scene.add(g);
  }
})();

/* ---------- lane numbers painted on the track ---------- */
(function numbers(){
  for (let i=0;i<NLANES;i++){
    const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d');
    g.clearRect(0,0,S,S);
    g.fillStyle = '#eef5fb';
    g.font = '800 104px Archivo, system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(i + 1), S/2, S/2 + 4);
    const t = new THREE.CanvasTexture(c);
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(0.7, 0.9),
      new THREE.MeshBasicMaterial({map:t, transparent:true, depthWrite:false})
    );
    m.rotation.x = -Math.PI/2;
    const a = (i + 0.5)*LANE;
    const o = pathAt(LAP - 3.4, _pt);
    m.position.set(o.p.x + a*o.n.x, 0.012, o.p.y + a*o.n.y);
    m.rotation.z = -Math.atan2(o.t.x, o.t.y);
    scene.add(m);
  }
})();

/* ============================================================
   Moving along the track
   ============================================================ */
const EYE = 1.62;
const MY_LANE = 3;                       // lane 4
const laneA = (MY_LANE + 0.5)*LANE;

let s = LAP - 9;                          // just behind the blocks
let speed = 0, running = false, travelled = 0;
let yaw = 0, pitch = -0.04;               // how far the head is turned off the lane

const hit = document.getElementById('hit');
const runBtn = document.getElementById('run');
const readOut = document.querySelector('#read b');

let dragging = false, lastX = 0, lastY = 0;
hit.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  hit.setPointerCapture(e.pointerId); hit.classList.add('grabbing');
});
hit.addEventListener('pointermove', e => {
  if (!dragging) return;
  yaw   -= (e.clientX - lastX)*0.0032;
  pitch -= (e.clientY - lastY)*0.0026;
  pitch = Math.max(-0.55, Math.min(0.45, pitch));
  yaw   = Math.max(-2.2, Math.min(2.2, yaw));
  lastX = e.clientX; lastY = e.clientY;
});
function endDrag(){ dragging = false; hit.classList.remove('grabbing'); }
hit.addEventListener('pointerup', endDrag);
hit.addEventListener('pointercancel', endDrag);

hit.addEventListener('wheel', e => {
  e.preventDefault();
  speed += e.deltaY*0.012;
}, { passive:false });

runBtn.addEventListener('click', () => {
  running = !running;
  runBtn.setAttribute('aria-pressed', running ? 'true' : 'false');
  runBtn.textContent = running ? 'Stop' : 'Run';
});

const keys = {};
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','s','a','d'].includes(e.key)){
    keys[e.key] = true; e.preventDefault();
  }
});
addEventListener('keyup', e => { keys[e.key] = false; });

function resize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);
resize();

const _look = new THREE.Vector3();
let prev = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min((now - prev)/1000, 0.05); prev = now;

  if (keys.ArrowUp || keys.w) speed += 34*dt;
  if (keys.ArrowDown || keys.s) speed -= 34*dt;
  if (keys.ArrowLeft || keys.a) yaw += 1.1*dt;
  if (keys.ArrowRight || keys.d) yaw -= 1.1*dt;
  if (running) speed += (7.6 - speed)*Math.min(1, dt*1.4);   // settles to a run
  else speed *= Math.pow(0.06, dt);         // otherwise coasts to a stop in about a second
  speed = Math.max(-9, Math.min(12, speed));
  s += speed*dt;
  travelled += Math.max(0, speed*dt);

  const o = pathAt(s, _pt);
  camera.position.set(o.p.x + laneA*o.n.x, EYE, o.p.y + laneA*o.n.y);

  // look along the lane, turned by however far the head is round
  const head = Math.atan2(o.t.x, o.t.y) + yaw;
  _look.set(
    camera.position.x + Math.sin(head),
    camera.position.y + Math.tan(pitch),
    camera.position.z + Math.cos(head)
  );
  camera.lookAt(_look);
  sky.position.copy(camera.position);

  readOut.textContent = Math.round(travelled) + ' m';

  renderer.render(scene, camera);
}

boot.classList.add('gone');
setTimeout(() => boot.remove(), 900);
requestAnimationFrame(t => { prev = t; tick(t); });

})();
</script>
