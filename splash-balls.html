<script>
(()=>{
'use strict';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rr=(a,b)=>a+(b-a)*Math.random();
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ============ shared clock: slow by default, quick after a tap ============ */
let energy=0;                         // 0 = drifting, 1 = just poked
const timeScale=()=>(reduce?.35:1)*(1+energy*4.2);
let showTime=0;                       // scaled time shared by every layer
const ptr={x:0,y:0,tx:0,ty:0};
let W=1,H=1;

/* =========================================================
   LAYER 1 — grunge haze background (WebGL)
   ========================================================= */
const bgc=document.getElementById('bg');
const gl1=bgc.getContext('webgl',{antialias:false,alpha:false,depth:false});
let bgu=null;
if(gl1){
 const FS=[
 'precision highp float;',
 'uniform vec2 uRes,uPtr;uniform float uTime,uAspect,uPortrait,uSeed;uniform vec3 uTap;',
 'uniform vec4 uB1,uB2,uB3,uHA,uHB;uniform vec3 uPal;uniform vec2 uFlow;',
 'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
 'float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
 ' return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}',
 'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+17.1;a*=.5;}return v;}',
 'float fbm3(vec2 p){float v=0.,a=.5;for(int i=0;i<3;i++){v+=a*noise(p);p=p*2.07+9.3;a*=.5;}return v;}',
 'const vec3 CYAN=vec3(.10,.72,.92);',
 'const vec3 EMER=vec3(.12,.85,.55);',
 'float blob(vec2 p,vec2 c,float R,float seed,float t,float spk,float sharp){',
 '  vec2 q=p-c;float r=length(q);vec2 d=q/(r+1e-5);',
 '  float wob=fbm3(d*1.8+seed+t*.05);',
 '  float sn=noise(d*spk+seed*3.1+t*.04);',

/* =========================================================
   LAYER 2 — paint splats (2D, drawn once each, then aged)
   ========================================================= */
const pc=document.getElementById('paint');
const pctx=pc.getContext('2d');
const PAINT_ALL=['#12564f','#176b4e','#134c73','#1f7a5a','#0f4457','#227f6d','#1b5a85','#2e8a5c','#0e5566','#1a6b46','#155f61','#206b8a','#1c7a4a'];
// each load paints from its own short palette
const PAINT=(()=>{const a=PAINT_ALL.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}
  return a.slice(0,4+(Math.random()*3|0));})();

function blobPath(g,cx,cy,R,lobes){
  const N=190,pts=[];
  const ph1=rr(0,6.28),ph2=rr(0,6.28),ph3=rr(0,6.28);
  for(let i=0;i<N;i++){
    const a=i/N*6.2832;
    let r=R*(.60+.10*Math.sin(a*2+ph1)+.07*Math.sin(a*3+ph2)+.045*Math.sin(a*5+ph3));
    for(const L of lobes){
      let d=a-L.a;while(d>Math.PI)d-=6.2832;while(d<-Math.PI)d+=6.2832;
      r+=R*L.h*Math.exp(-(d*d)/(2*L.w*L.w));
    }
    pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);
  }
  g.beginPath();
  const m=(i)=>[(pts[i][0]+pts[(i+1)%N][0])/2,(pts[i][1]+pts[(i+1)%N][1])/2];
  let s=m(N-1);g.moveTo(s[0],s[1]);
  for(let i=0;i<N;i++){const e=m(i);g.quadraticCurveTo(pts[i][0],pts[i][1],e[0],e[1]);}
  g.closePath();
}

// one tapering streak that ends in a round drop — the signature of real splatter
function tendril(g,cx,cy,a,r0,len,w0,curve){
  const dx=Math.cos(a),dy=Math.sin(a),px=-dy,py=dx;
  const S=18,left=[],right=[];
  for(let i=0;i<=S;i++){
    const t=i/S;
    const off=curve*Math.sin(t*Math.PI)*len;
    const x=cx+dx*(r0+len*t)+px*off, y=cy+dy*(r0+len*t)+py*off;
    const w=Math.max(w0*Math.pow(1-t,.8),w0*.06);
    left.push([x+px*w,y+py*w]);right.push([x-px*w,y-py*w]);
  }
  g.beginPath();g.moveTo(left[0][0],left[0][1]);
  for(let i=1;i<left.length;i++)g.lineTo(left[i][0],left[i][1]);
  for(let i=right.length-1;i>=0;i--)g.lineTo(right[i][0],right[i][1]);
  g.closePath();g.fill();
  const tip=left[S];const tx=(left[S][0]+right[S][0])/2,ty=(left[S][1]+right[S][1])/2;
  if(Math.random()<.55){g.beginPath();g.arc(tx,ty,w0*rr(.35,1.1),0,6.2832);g.fill();}
  return[tx,ty];
}

function makeSplat(col,R){
  const D=rr(0,6.28);
  const aim=(spread)=>Math.random()<.62?D+rr(-spread,spread):rr(0,6.28);
  const S=Math.ceil(R*5.2),c0=document.createElement('canvas'),c1=document.createElement('canvas');
  c0.width=c0.height=S;c1.width=c1.height=S;
  const g0=c0.getContext('2d'),g1=c1.getContext('2d');
  const cx=S/2,cy=S/2;
  g0.fillStyle=col;g1.fillStyle=col;
  // core blob with finger lobes
  const lobes=[];
  for(let i=0,n=4+(Math.random()*4|0);i<n;i++)lobes.push({a:aim(1.),w:rr(.16,.45),h:rr(.12,.38)});
  for(let i=0,n=2+(Math.random()*3|0);i<n;i++)lobes.push({a:rr(0,6.28),w:rr(.09,.2),h:rr(.08,.24)});
  blobPath(g0,cx,cy,R,lobes);g0.fill();
  // a couple of fat runs off the blob
  for(let i=0,n=1+(Math.random()*3|0);i<n;i++){
    const a=aim(.8);
    const [tx,ty]=tendril(g0,cx,cy,a,R*.5,R*rr(.35,1.),R*rr(.05,.10),rr(-.12,.12));
    if(Math.random()<.5){g0.beginPath();g0.arc(tx,ty,R*rr(.06,.13),0,6.2832);g0.fill();}
  }
  // thin flying streaks + satellites go on the second sprite (they land a beat later)
  for(let i=0,n=9+(Math.random()*10|0);i<n;i++){
    const a=aim(1.1);
    const long=Math.random()<.4?rr(1.4,2.6):rr(.45,1.3);
    tendril(g1,cx,cy,a,R*rr(.55,.9),R*long,R*rr(.008,.028),rr(-.05,.05));
  }
  for(let i=0,n=16+(Math.random()*20|0);i<n;i++){
    const a=aim(1.2),d=R*rr(1.0,2.35),r=R*rr(.018,.11);
    const x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d;
    g1.save();g1.translate(x,y);g1.rotate(a);g1.beginPath();
    g1.ellipse(0,0,r*rr(1,1.7),r,0,0,6.2832);g1.fill();g1.restore();
    if(Math.random()<.25){ // a fine hair trailing back toward the blob
      g1.strokeStyle=col;g1.lineWidth=Math.max(.8,r*.35);g1.beginPath();
      g1.moveTo(x,y);g1.lineTo(cx+Math.cos(a)*(d-R*rr(.25,.7)),cy+Math.sin(a)*(d-R*rr(.25,.7)));g1.stroke();
    }
  }
  for(let i=0,n=40+(Math.random()*45|0);i<n;i++){
    const a=rr(0,6.28),d=R*rr(.9,2.5);
    g1.beginPath();g1.arc(cx+Math.cos(a)*d,cy+Math.sin(a)*d,R*rr(.005,.028),0,6.2832);g1.fill();
  }
  return{core:c0,spray:c1,S};
}

const splats=[];
let nextSplat=rr(5,14);
function spawnSplat(x,y,big){
  const R=(big?rr(.09,.17):rr(.05,.13))*Math.min(W,H);
  const s=makeSplat(pick(PAINT),R);
  splats.push({...s,x,y,t:0,life:rr(38,60),rot:0,alpha:rr(.74,.93)});

function drawSplats(dt){
  pctx.setTransform(1,0,0,1,0,0);pctx.clearRect(0,0,pc.width,pc.height);
  pctx.setTransform(pdpr,0,0,pdpr,0,0);
  for(let i=splats.length-1;i>=0;i--){
    const s=splats[i];s.t+=dt;
    if(s.t>s.life+8){splats.splice(i,1);continue;}
    const inC=Math.min(1,s.t/.22), inS=clamp((s.t-.14)/.5,0,1);
    const sc=.72+.34*(1-Math.pow(1-inC,3))-.06*Math.max(0,1-s.t/.9);
    const out=s.t>s.life?1-clamp((s.t-s.life)/8,0,1):1;
    pctx.save();pctx.translate(s.x,s.y);pctx.rotate(s.rot);
    pctx.globalAlpha=s.alpha*inC*out;
    pctx.drawImage(s.core,-s.S/2*sc,-s.S/2*sc,s.S*sc,s.S*sc);
    pctx.globalAlpha=s.alpha*inS*out;
    const ss=sc*(.86+.14*inS);
    pctx.drawImage(s.spray,-s.S/2*ss,-s.S/2*ss,s.S*ss,s.S*ss);
    pctx.restore();
  }
  pctx.globalAlpha=1;
}

  const U=n=>gl.getUniformLocation(prog,n);
  uni={rot:U('uRot'),center:U('uCenter'),scale:U('uScale'),proj:U('uProj'),camz:U('uCamZ'),
       alb:U('uAlb'),nrm:U('uNrm'),rough:U('uRough'),nscale:U('uNrmScale'),f0:U('uF0'),tint:U('uTint')};
  gl.uniform1i(uni.alb,0);gl.uniform1i(uni.nrm,1);
  gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);
  gl.clearColor(0,0,0,0);

  const b64=s=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;};
  function tex(unitData,srgbish){
    const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([128,128,255,255]));
    const im=new Image();im.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,t);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);};
    im.src='data:image/jpeg;base64,'+unitData;
    return t;
  }
  const MAT={ // roughness, normal strength, specular floor
    soccer:[.42,1.0,.05], basketball:[.62,1.25,.04], volleyball:[.38,1.0,.05],
    tennis:[.78,1.5,.02], cricket:[.28,1.0,.06], baseball:[.5,1.1,.04],
    rugby:[.45,1.1,.05], golf:[.22,1.2,.06], handball:[.5,1.1,.045], waterpolo:[.35,1.0,.05]
  };
  for(const name in BALLS_DATA){
    const d=BALLS_DATA[name],nv=d.nv,ni=d.ni,buf=b64(d.geo).buffer;
    let o=0;
    const pos=new Int16Array(buf,o,nv*3);o+=nv*6;
    const nrm=new Int8Array(buf,o,nv*3);o+=nv*3;
    const uv=new Uint16Array(buf,o,nv*2);o+=nv*4;
    const idx=new Uint16Array(buf,o,ni);
    const mkbuf=(target,data)=>{const b=gl.createBuffer();gl.bindBuffer(target,b);gl.bufferData(target,data,gl.STATIC_DRAW);return b;};
    const m=MAT[name]||[.45,1,.04];
    kinds.push({name,
      bp:mkbuf(gl.ARRAY_BUFFER,pos),bn:mkbuf(gl.ARRAY_BUFFER,nrm),bu:mkbuf(gl.ARRAY_BUFFER,uv),
      bi:mkbuf(gl.ELEMENT_ARRAY_BUFFER,idx),ni,
      ext:d.ext,scale:d.scale,mass:d.mass,
      r:Math.max(d.ext[0],d.ext[1],d.ext[2]),
      rc:(d.ext[0]+d.ext[1]+d.ext[2])/3,     // collision radius (rugby averages out)
      alb:tex(d.tex),nrmT:tex(d.nrm),rough:m[0],ns:m[1],f0:m[2]});
  }
  ballsReady=kinds.length>0;
}

// --- world/camera: every ball sits on z=0 so relative sizes stay true ---
const CAMZ=3.2;
let proj=new Float32Array(16),worldW=1,worldH=1;
function setProj(){
  const asp=W/H;
  const visMin=1.3;                        // metres across the short side of the screen
  worldH=asp>=1?visMin:visMin/asp;
  worldW=worldH*asp;
  const f=1/Math.tan(Math.atan((worldH/2)/CAMZ));
  proj=new Float32Array([f/asp,0,0,0, 0,f,0,0, 0,0,-1.002,-1, 0,0,-.2,0]);
}

const live=[];
let spawnWait=rr(0,2);
function spawnBall(inside){
  if(!ballsReady||live.length>=3)return;
  const used=live.map(b=>b.k.name);
  let options=kinds.filter(k=>!used.includes(k.name));
  if(!options.length)options=kinds;
  const big=options.filter(k=>k.r>.08);
  const k=pick(Math.random()<.72&&big.length?big:options);
  const side=(Math.random()*4)|0;
  const m=k.r+.06;
  let x,y,vx,vy;
  const sp=rr(.038,.085);
  if(side===0){x=-worldW/2-m;y=rr(-worldH/2,worldH/2);vx=sp;vy=rr(-.4,.4)*sp;}
  else if(side===1){x=worldW/2+m;y=rr(-worldH/2,worldH/2);vx=-sp;vy=rr(-.4,.4)*sp;}
  else if(side===2){y=-worldH/2-m;x=rr(-worldW/2,worldW/2);vy=sp;vx=rr(-.4,.4)*sp;}
  else{y=worldH/2+m;x=rr(-worldW/2,worldW/2);vy=-sp;vx=rr(-.4,.4)*sp;}
  const ax=[rr(-1,1),rr(-1,1),rr(-1,1)];const al=Math.hypot(...ax);
  if(inside){
    for(let tries=0;tries<30;tries++){
      x=rr(-worldW/2+k.r,worldW/2-k.r);y=rr(-worldH/2+k.r,worldH/2-k.r);
      if(live.every(b=>Math.hypot(b.x-x,b.y-y)>b.k.rc+k.rc+.05))break;
    }
    const a=rr(0,6.28);vx=Math.cos(a)*sp;vy=Math.sin(a)*sp;
  }
  live.push({k,x,y,vx,vy,rot:identity(),ax:ax.map(v=>v/al),om:rr(.10,.35),drift:rr(0,6.28)});
}
function identity(){return new Float32Array([1,0,0, 0,1,0, 0,0,1]);}
function spin(R,axis,ang){
  const c=Math.cos(ang),s=Math.sin(ang),t=1-c,[x,y,z]=axis;
  const K=[t*x*x+c, t*x*y+s*z, t*x*z-s*y,
           t*x*y-s*z, t*y*y+c, t*y*z+s*x,
           t*x*z+s*y, t*y*z-s*x, t*z*z+c];
  const O=new Float32Array(9);
  for(let c2=0;c2<3;c2++)for(let r=0;r<3;r++){let v=0;for(let i=0;i<3;i++)v+=K[i*3+r]*R[c2*3+i];O[c2*3+r]=v;}
  return O;
}
function stepBalls(dt){
  if(!ballsReady)return;
  spawnWait-=dt;
  if(live.length<3&&spawnWait<=0){spawnBall(false);spawnWait=rr(2,8);}
  for(const b of live){
    b.drift+=dt*.3;
    b.vx+=Math.sin(b.drift)*.0015*dt;b.vy+=Math.cos(b.drift*.8)*.0015*dt;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    b.rot=spin(b.rot,b.ax,b.om*dt);
  }
  // pairwise collisions (real masses, springy)
  for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){
    const a=live[i],b=live[j];
    const dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy),R=a.k.rc+b.k.rc;
    if(d<R&&d>1e-6){
      const nx=dx/d,ny=dy/d,ov=R-d;
      const ma=a.k.mass,mb=b.k.mass,tm=ma+mb;
      a.x-=nx*ov*(mb/tm);a.y-=ny*ov*(mb/tm);
      b.x+=nx*ov*(ma/tm);b.y+=ny*ov*(ma/tm);
      const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;
      if(vn<0){
        const e=.92,J=-(1+e)*vn/(1/ma+1/mb);
        a.vx-=J*nx/ma;a.vy-=J*ny/ma;b.vx+=J*nx/mb;b.vy+=J*ny/mb;
        const kick=Math.min(1.6,Math.abs(J)*3);
        a.om=clamp(a.om+kick*.4,.05,2.2);b.om=clamp(b.om+kick*.4,.05,2.2);
      }
    }
  }
  for(let i=live.length-1;i>=0;i--){
    const b=live[i],m=b.k.r+.35;
    if(b.x<-worldW/2-m||b.x>worldW/2+m||b.y<-worldH/2-m||b.y>worldH/2+m)live.splice(i,1);
  }
}
function drawBalls(){
  if(!gl)return;
  gl.viewport(0,0,bc.width,bc.height);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  if(!ballsReady)return;
  gl.useProgram(prog);
  gl.uniformMatrix4fv(uni.proj,false,proj);gl.uniform1f(uni.camz,CAMZ);
  const aP=gl.getAttribLocation(prog,'aPos'),aN=gl.getAttribLocation(prog,'aNrm'),aU=gl.getAttribLocation(prog,'aUV');
  gl.enableVertexAttribArray(aP);gl.enableVertexAttribArray(aN);gl.enableVertexAttribArray(aU);
  for(const b of live){
    const k=b.k;
    gl.bindBuffer(gl.ARRAY_BUFFER,k.bp);gl.vertexAttribPointer(aP,3,gl.SHORT,true,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,k.bn);gl.vertexAttribPointer(aN,3,gl.BYTE,true,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,k.bu);gl.vertexAttribPointer(aU,2,gl.UNSIGNED_SHORT,true,0,0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,k.bi);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,k.alb);
    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,k.nrmT);
    gl.uniformMatrix3fv(uni.rot,false,b.rot);
    gl.uniform3f(uni.center,b.x-ptr.x*.05,b.y+ptr.y*.05,0);
    gl.uniform3f(uni.scale,k.scale,k.scale,k.scale);
    gl.uniform1f(uni.rough,k.rough);gl.uniform1f(uni.nscale,k.ns);gl.uniform1f(uni.f0,k.f0);
    gl.uniform1f(uni.tint,.35);
    gl.drawElements(gl.TRIANGLES,k.ni,gl.UNSIGNED_SHORT,0);
  }
}

/* =========================================================
   sizing, input, loop
   ========================================================= */
let dpr=Math.min(devicePixelRatio||1,2),bgScale=1,pdpr=1;
function resize(){
  W=innerWidth;H=innerHeight;
  pdpr=Math.min(devicePixelRatio||1,2);
  pc.width=Math.round(W*pdpr);pc.height=Math.round(H*pdpr);
  bc.width=Math.round(W*dpr);bc.height=Math.round(H*dpr);
  if(gl1){const s=Math.min(devicePixelRatio||1,1.5)*bgScale;
    bgc.width=Math.max(1,Math.round(W*s));bgc.height=Math.max(1,Math.round(H*s));gl1.viewport(0,0,bgc.width,bgc.height);}
  setProj();bakeLook();
}
addEventListener('resize',resize);resize();

function toWorld(cx,cy){ // screen px -> metres on the z=0 plane
  return[(cx/W-.5)*worldW,-(cy/H-.5)*worldH];
}
addEventListener('pointermove',e=>{ptr.tx=e.clientX/W*2-1;ptr.ty=-(e.clientY/H*2-1);},{passive:true});
function poke(cx,cy){
  energy=Math.min(1.35,energy+.75);
  const A=W/H;
  bgTap=[(cx/W*2-1)*A,-(cy/H*2-1),showTime];
  spawnSplat(cx,cy,true);
  if(Math.random()<.5)spawnSplat(cx+rr(-.18,.18)*W,cy+rr(-.18,.18)*H,false);
  nextSplat=Math.min(nextSplat,rr(1.5,3));
  const [wx,wy]=toWorld(cx,cy);
  for(const b of live){
    const dx=b.x-wx,dy=b.y-wy,d2=dx*dx+dy*dy+.01;
    const f=Math.min(.55,.055/d2)/Math.max(.05,b.k.mass);
    b.vx+=dx/Math.sqrt(d2)*f*.06;b.vy+=dy/Math.sqrt(d2)*f*.06;
    b.om=clamp(b.om+f*.05,.05,2.4);
  }
}
addEventListener('pointerdown',e=>poke(e.clientX,e.clientY),{passive:true});

// adaptive background resolution
let slow=0;
function tune(dt){
  if(dt>.026){slow++;if(slow>40&&bgScale>.5){bgScale=Math.max(.5,bgScale-.15);slow=0;resize();}}
  else slow=Math.max(0,slow-1);
}

const OPENERS=2+(Math.random()<.75?1:0);
setTimeout(()=>{for(let i=0;i<OPENERS;i++)spawnBall(true);},60);
// a couple of splats to start with, placed off to the sides
const OPEN_SPLATS=1+(Math.random()*3|0);
for(let i=0;i<OPEN_SPLATS;i++){
  const d=rr(.2,2.6)*1000;
  setTimeout(()=>spawnSplat(rr(.06,.94)*W,rr(.08,.92)*H,Math.random()<.4),d);
}

let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  tune(dt);
  energy*=Math.exp(-dt*1.05);
  const ts=timeScale(),sdt=dt*ts;
  showTime+=sdt;
  ptr.x+=(ptr.tx-ptr.x)*Math.min(1,dt*2.2);ptr.y+=(ptr.ty-ptr.y)*Math.min(1,dt*2.2);

  if(gl1&&bgu){
    gl1.uniform2f(bgu.res,bgc.width,bgc.height);gl1.uniform2f(bgu.ptr,ptr.x,ptr.y);
    gl1.uniform1f(bgu.time,showTime);gl1.uniform1f(bgu.aspect,bgc.width/bgc.height);
    gl1.uniform1f(bgu.portrait,W/H<.9?1:0);
    gl1.uniform1f(bgu.seed,LOOK.seed);
    gl1.uniform4fv(bgu.b1,LK.b1);gl1.uniform4fv(bgu.b2,LK.b2);gl1.uniform4fv(bgu.b3,LK.b3);
    gl1.uniform4fv(bgu.ha,LK.ha);gl1.uniform4fv(bgu.hb,LK.hb);
    gl1.uniform3fv(bgu.pal,LOOK.pal);gl1.uniform2fv(bgu.flow,LK.flow);
    gl1.uniform3f(bgu.tap,bgTap[0],bgTap[1],bgTap[2]);
    gl1.drawArrays(gl1.TRIANGLES,0,3);
  }

  nextSplat-=sdt;
  if(nextSplat<=0){spawnSplat(rr(.08,.92)*W,rr(.1,.9)*H,Math.random()<.35);nextSplat=rr(9,17);}
  drawSplats(sdt);

  stepBalls(sdt);
  drawBalls();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
