<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Freestyle Moguls</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; -webkit-user-select: none; user-select: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #frame { position: relative; width: 100vw; height: 100vh; height: 100dvh; background: #000; overflow: hidden; }
  @media (min-aspect-ratio: 3/4) and (min-width: 700px) {
    #frame { width: min(440px, 46vh); height: min(953px, 100vh); border-radius: 28px; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06); }
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #play { position: absolute; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: 58px; height: 58px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35);
    background: rgba(10,20,40,.38); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    pointer-events: auto; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  #play:active { background: rgba(10,20,40,.6); }
  #play svg { width: 26px; height: 26px; fill: #fff; }
  #play .ico-pause { display: none; }
  #play.on .ico-play { display: none; }
  #play.on .ico-pause { display: block; }
  #rail { position: absolute; right: 12px; top: 14%; bottom: 20%; width: 34px; pointer-events: auto; cursor: grab; }
  #rail::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; border-radius: 2px;
    background: rgba(255,255,255,.28); }
  #knob { position: absolute; left: 50%; top: 0; width: 18px; height: 18px; margin-left: -9px; margin-top: -9px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.45), 0 0 0 4px rgba(255,255,255,.18); }
  #hint { position: absolute; left: 0; right: 0; bottom: 96px; text-align: center; opacity: 0; transition: opacity .8s; }
  #hint span { display: inline-block; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.7); position: relative; }
  #hint span::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff;
    animation: nudge 2.2s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { transform: translateX(-7px) } 50% { transform: translateX(7px) } }
  #hint.show { opacity: .85; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #dfe9f6; transition: opacity 1.2s; z-index: 3; }
  #loading i { width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(20,40,80,.15); border-top-color: rgba(20,40,80,.6); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  #loading.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="hint"><span></span></div>
    <div id="rail"><div id="knob"></div></div>
    <button id="play" aria-label="Fly">
      <svg class="ico-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="ico-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
  </div>
  <div id="loading"><i></i></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ============================================================================
   Moguls — a procedural FIS freestyle moguls course on a mountain.
   1 unit = 1 metre. y is up. The course runs down +z.
   ========================================================================== */
const DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ---------------------------------------------------------------- FIS course
const COURSE = {
  slopeDeg: 28, lengthSlope: 235, halfWidth: 9,        // 235 m at 28°, 18 m wide
  zStart: 0,
  kickers: [70, 165],                                   // along-slope metres from the start
  kickerH: 1.25, kickerRamp: 7.5, landing: 14,
  mogulRow: 3.6, mogulCol: 3.35, mogulH: 1.05, mogulR: 2.6,
  inRun: 15, outRun: 12,
};
COURSE.cos = Math.cos(COURSE.slopeDeg * DEG);
COURSE.tan = Math.tan(COURSE.slopeDeg * DEG);
COURSE.zFinish = COURSE.zStart + COURSE.lengthSlope * COURSE.cos;   // 207.5
COURSE.drop = COURSE.lengthSlope * Math.sin(COURSE.slopeDeg * DEG); // 110.3
const FENCE_X = 12.4;      // course fencing offset from the centre line
const ARENA_END = 262;     // z where the finish arena ends

// ---------------------------------------------------------------- sun
const SUN_EL = 17 * DEG, SUN_AZ = -84 * DEG;     // low, and raking across the course from the side: 18° above the slope plane
const SUN = new THREE.Vector3(Math.cos(SUN_EL) * Math.sin(SUN_AZ), Math.sin(SUN_EL), Math.cos(SUN_EL) * Math.cos(SUN_AZ)).normalize();

// ---------------------------------------------------------------- rng + noise
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(ix, iz, seed) {
  let h = Math.imul(ix, 0x27d4eb2d) ^ Math.imul(iz, 0x165667b1) ^ Math.imul(seed | 0, 0x9E3779B1);
  h = Math.imul(h ^ h >>> 15, 0x85ebca6b); h = Math.imul(h ^ h >>> 13, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, z, seed) {
  const ix = Math.floor(x), iz = Math.floor(z); let fx = x - ix, fz = z - iz;
  fx = fx * fx * (3 - 2 * fx); fz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz, seed), b = hash2(ix + 1, iz, seed), c = hash2(ix, iz + 1, seed), d = hash2(ix + 1, iz + 1, seed);
  return lerp(lerp(a, b, fx), lerp(c, d, fx), fz) * 2 - 1;
}
function fbm(x, z, oct, seed) { let s = 0, a = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * vnoise(x, z, seed + i * 17); n += a; a *= 0.5; x = x * 2.03 + 11.7; z = z * 1.97 - 5.3; } return s / n; }
function ridged(x, z, oct, seed) { let s = 0, a = 1, n = 0; for (let i = 0; i < oct; i++) { const v = 1 - Math.abs(vnoise(x, z, seed + i * 31)); s += a * v * v; n += a; a *= 0.55; x = x * 2.1 + 3.1; z = z * 2.1 + 7.9; } return s / n; }

// ---------------------------------------------------------------- the run, summit to valley
// Horizontal control points for the groomed run: summit plateau, winding approach piste,
// start plateau, the straight course, the arena, then a run-out into the trees.
const RUN_PTS = [[-120, -560], [-112, -505], [-75, -425], [-28, -335], [6, -245], [6, -160], [0, -95], [0, -45],
  [0, 0], [0, COURSE.zFinish], [0, ARENA_END], [0, 330], [18, 420], [48, 530], [70, 660], [84, 800]];
const RUN = { pts: [], s: [], tx: [], tz: [], len: 0, sGate: 0, sFinish: 0, sPlateau: 0, sArena: 0, sOut: 0 };
(function buildRun() {
  const P = RUN_PTS, N = P.length;
  const cr = (p0, p1, p2, p3, t) => {
    const t2 = t * t, t3 = t2 * t;
    return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
  };
  const raw = [];
  for (let i = 0; i < N - 1; i++) {
    const p0 = P[Math.max(i - 1, 0)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(i + 2, N - 1)];
    const segLen = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]); const n = Math.max(4, Math.ceil(segLen / 1.5));
    for (let k = 0; k < n; k++) { const t = k / n; raw.push([cr(p0[0], p1[0], p2[0], p3[0], t), cr(p0[1], p1[1], p2[1], p3[1], t), i]); }
  }
  raw.push([P[N - 1][0], P[N - 1][1], N - 1]);
  let s = 0; const marks = {};
  for (let i = 0; i < raw.length; i++) {
    if (i > 0) s += Math.hypot(raw[i][0] - raw[i - 1][0], raw[i][1] - raw[i - 1][1]);
    RUN.pts.push(raw[i][0], raw[i][1]); RUN.s.push(s);
    if (marks[raw[i][2]] === undefined) marks[raw[i][2]] = s;
  }
  RUN.len = s;
  for (let i = 0; i < raw.length; i++) {
    const a = Math.max(i - 1, 0), b = Math.min(i + 1, raw.length - 1);
    let tx = raw[b][0] - raw[a][0], tz = raw[b][1] - raw[a][1]; const l = Math.hypot(tx, tz) || 1;
    RUN.tx.push(tx / l); RUN.tz.push(tz / l);
  }
  RUN.sPlateau = marks[7]; RUN.sGate = marks[8]; RUN.sFinish = marks[9]; RUN.sArena = marks[10]; RUN.sOut = marks[11];
})();

// Closest point on the run. Returns s (metres along), lat (signed lateral, +x when heading +z),
// beyond (distance past either end, negative at the top end), and the local tangent.
const _cp = { s: 0, lat: 0, beyond: 0, tx: 0, tz: 1, ad: 0 };
function closestOnRun(x, z) {
  if (z >= -45 && z <= 330) { _cp.s = RUN.sGate + z; _cp.lat = x; _cp.beyond = 0; _cp.tx = 0; _cp.tz = 1; _cp.ad = Math.abs(x); return _cp; }
  const n = RUN.s.length, P = RUN.pts; let best = -1, bd = 1e30;
  for (let i = 0; i < n; i += 6) { const dx = P[2 * i] - x, dz = P[2 * i + 1] - z; const d = dx * dx + dz * dz; if (d < bd) { bd = d; best = i; } }
  const lo = Math.max(best - 6, 0), hi = Math.min(best + 6, n - 1);
  for (let i = lo; i <= hi; i++) { const dx = P[2 * i] - x, dz = P[2 * i + 1] - z; const d = dx * dx + dz * dz; if (d < bd) { bd = d; best = i; } }
  const tx = RUN.tx[best], tz = RUN.tz[best]; const px = x - P[2 * best], pz = z - P[2 * best + 1];
  const along = px * tx + pz * tz; const lat = px * tz - pz * tx;
  _cp.tx = tx; _cp.tz = tz;
  if (best === 0 && along < 0) { _cp.s = 0; _cp.beyond = along; _cp.lat = lat; }
  else if (best === n - 1 && along > 0) { _cp.s = RUN.len; _cp.beyond = along; _cp.lat = lat; }
  else { _cp.s = clamp(RUN.s[best] + along, 0, RUN.len); _cp.beyond = 0; _cp.lat = lat; }
  _cp.ad = Math.abs(_cp.lat);
  return _cp;
}

// Design profile: slope angle (degrees) along the run, integrated into height. Finish line at y = 0.
const PROFILE = { table: null, s0: -600, ds: 0.5 };
(function buildProfile() {
  const g = RUN.sGate, f = RUN.sFinish, pl = RUN.sPlateau, ar = RUN.sArena, out = RUN.sOut;
  const bp = [[-600, 27], [-40, 27], [0, 5], [45, 5], [70, 19], [130, 25], [190, 25], [230, 11], [285, 11], [320, 21], [pl - 40, 21], [pl - 6, 7], [pl, 5],
    [g - 4, 5], [g, COURSE.slopeDeg], [f, COURSE.slopeDeg], [f + 6, 22], [f + 14, 11], [f + 24, 5], [ar, 5], [ar + 30, 14], [out + 60, 16], [out + 200, 16],
    [out + 330, 11], [out + 460, 6], [out + 900, 3]];
  const slopeAt = s => { if (s <= bp[0][0]) return bp[0][1]; for (let i = 1; i < bp.length; i++) if (s <= bp[i][0]) { const t = (s - bp[i - 1][0]) / (bp[i][0] - bp[i - 1][0]); const tt = t * t * (3 - 2 * t); return lerp(bp[i - 1][1], bp[i][1], tt); } return bp[bp.length - 1][1]; };
  const n = Math.ceil((RUN.len + 1400 - PROFILE.s0) / PROFILE.ds); const T = new Float64Array(n); let y = 0;
  for (let i = 0; i < n; i++) { T[i] = y; const s = PROFILE.s0 + i * PROFILE.ds; y -= Math.tan(slopeAt(s + PROFILE.ds * 0.5) * DEG) * PROFILE.ds; }
  const yf = (() => { const i = (f - PROFILE.s0) / PROFILE.ds; const j = Math.floor(i); return lerp(T[j], T[j + 1], i - j); })();
  for (let i = 0; i < n; i++) T[i] -= yf;
  PROFILE.table = T;
})();
function designY(s) { const i = clamp((s - PROFILE.s0) / PROFILE.ds, 0, PROFILE.table.length - 2); const j = Math.floor(i); return lerp(PROFILE.table[j], PROFILE.table[j + 1], i - j); }
function designSlope(s) { return (designY(s - 1) - designY(s + 1)) * 0.5; }   // rise per metre downhill (positive)

// Groomed corridor half-width along the run
function corridorHW(s) {
  if (s < RUN.sPlateau - 30) return 15;
  if (s < RUN.sGate) return lerp(15, 22, smooth(RUN.sPlateau - 30, RUN.sPlateau, s));   // start plateau opens out
  if (s < RUN.sFinish) return 11.5;
  if (s < RUN.sArena) return lerp(11.5, 34, smooth(RUN.sFinish, RUN.sFinish + 30, s));
  if (s < RUN.sOut) return 34;
  return lerp(34, 14, smooth(RUN.sOut, RUN.sOut + 60, s));
}

// ---------------------------------------------------------------- moguls + kickers (course only)
const MOG = COURSE; const RNG_M = mulberry32(7);
const MOG_JIT = []; for (let i = 0; i < 4096; i++) MOG_JIT.push(RNG_M() - 0.5);
function mogulSum(x, t) {
  // staggered lattice of bumps, rows 3.6 m apart down the slope, columns 3.35 m across
  const R = MOG.mogulR, rowP = MOG.mogulRow, colP = MOG.mogulCol; let sum = 0;
  const k0 = Math.floor((t - R) / rowP), k1 = Math.ceil((t + R) / rowP);
  for (let k = k0; k <= k1; k++) {
    const off = (k & 1) ? 0.5 : 0;
    const j0 = Math.floor((x - R) / colP - off), j1 = Math.ceil((x + R) / colP - off);
    for (let j = j0; j <= j1; j++) {
      const hsh = ((k * 73 + j * 151) & 4095);
      const cx = (j + off) * colP + MOG_JIT[hsh] * 0.5, ct = k * rowP + MOG_JIT[(hsh + 977) & 4095] * 0.45;
      const u = (x - cx) / R; let v = (t - ct) / R; v = v < 0 ? v / 0.86 : v / 1.12;
      const r2 = u * u + v * v; if (r2 < 1) { const r = Math.sqrt(r2); const w = (1 - r2) * Math.pow(1 - r, 0.55); sum += w * (1 + MOG_JIT[(hsh + 1531) & 4095] * 0.3); }   // a sharp crest, a scraped-out base
    }
  }
  return sum;
}
function kickerH(x, t) {
  let h = 0;
  for (const tk of MOG.kickers) {
    const a = tk - MOG.kickerRamp;
    if (t < a || t > tk + 0.5) continue;
    let p; if (t <= tk) { const u = (t - a) / MOG.kickerRamp; p = Math.pow(u, 1.75); } else { p = Math.sqrt(1 - (t - tk) / 0.5); }
    const lat = 1 - smooth(7.4, 8.8, Math.abs(x)); h += MOG.kickerH * p * lat;
  }
  return h;
}
function mogulMaskT(t) {
  let m = smooth(MOG.inRun, MOG.inRun + 4, t) * (1 - smooth(MOG.lengthSlope - MOG.outRun - 4, MOG.lengthSlope - MOG.outRun, t));
  for (const tk of MOG.kickers) { const a = tk - MOG.kickerRamp - 4.5; m *= 1 - smooth(a, a + 4, t) * (1 - smooth(tk + MOG.landing, tk + MOG.landing + 3.5, t)); }
  return m;
}
function courseDetail(x, z) {
  // moguls, kickers and the pushed-up snow berm along the course edges
  if (z < COURSE.zStart - 2 || z > COURSE.zFinish + 2) return 0;
  const t = (z - COURSE.zStart) / COURSE.cos; const ax = Math.abs(x); let h = 0;
  const mt = mogulMaskT(t); const mx = 1 - smooth(8.6, 10.2, ax);
  if (mt > 0 && mx > 0) h += MOG.mogulH * mogulSum(x, t) * mt * mx;
  if (t >= 0 && t <= MOG.lengthSlope) h += kickerH(x, t);
  const b = ax - 11.4; if (b > -2.5 && b < 2.5) h += 0.42 * Math.exp(-b * b * 0.9) * smooth(-3, 4, t) * (1 - smooth(MOG.lengthSlope, MOG.lengthSlope + 8, t));
  return h;
}

// ---------------------------------------------------------------- peaks
const PEAKS = [
  // x, z, radius, height, crag (0 smooth … 1 very craggy)
  // (nothing tall may sit on the sun's side — the line (-0.95t, 0.1t) from the course — or the course falls into its shadow)
  [-10, -900, 270, 430, 0.9], [760, -820, 320, 300, 0.7], [-1000, -900, 420, 540, 0.8], [60, -1100, 520, 640, 0.85],
  [560, -420, 300, 330, 0.7], [820, 140, 360, 380, 0.6], [-1700, -300, 520, 340, 0.7], [1500, -600, 600, 700, 0.8],
  [2600, 1100, 700, 900, 0.7], [-3300, -600, 760, 700, 0.75], [-2200, -1500, 800, 900, 0.7], [2300, -1600, 820, 950, 0.7], [0, -2400, 900, 1100, 0.8],
];
// the range across the valley: one long serrated ridge with summits strung along it
function massifH(x, z) {
  if (z < 1500 || z > 4200) return 0;
  const zc = 2900 + 240 * Math.sin(x * 0.0011 + 0.7) + 110 * Math.sin(x * 0.0037 + 2.0);
  const w = 560 + 160 * Math.sin(x * 0.0021 + 1.0);
  const d = (z - zc) / w; const prof = Math.exp(-d * d * 1.5); if (prof < 0.01) return 0;
  const H = 720 + 300 * vnoise(x * 0.0016, 0.5, 71) + 170 * vnoise(x * 0.0052, 0.5, 72);
  const crag = ridged(x * 0.0042, z * 0.0042, 3, 73);
  const side = smooth(-0.2, 0.9, -d);                                         // the face toward us is the craggy one
  return H * prof * (0.6 + 0.55 * crag * (0.4 + 0.6 * side));
}
function peaksH(x, z) {
  let h = 0;
  for (const p of PEAKS) {
    const dx = (x - p[0]) / p[2], dz = (z - p[1]) / p[2]; const r2 = dx * dx + dz * dz; if (r2 > 4) continue;
    const g = Math.exp(-r2 * 1.7); const rg = ridged((x - p[0]) * 0.004, (z - p[1]) * 0.004, 3, 41 + p[0] | 0);
    h += p[3] * g * (1 - p[4] * 0.55 + p[4] * 0.9 * rg);
  }
  return h;
}

// ---------------------------------------------------------------- the heightfield
// terrainBase: the mountain with the groomed run cut into it (no moguls).
function terrainBase(x, z) {
  const c = closestOnRun(x, z); const s = c.s, ad = c.ad, lat = c.lat;
  let y = designY(s);
  if (c.beyond < 0) y += -c.beyond * 0.32 + Math.min(-c.beyond, 60) * 0.1;             // above the summit: climbs into the crag
  else if (c.beyond > 0) y -= c.beyond * 0.05;                                            // valley floor keeps falling gently
  const hw = corridorHW(s);
  const m = smooth(hw, hw + 26, ad);                                                       // 0 on the piste, 1 on the mountain (fine roughness)
  const mb = smooth(hw + 8, hw + 170, ad);                                                 // the big rolling relief blends in over a long way, or it walls the run
  // lateral relief: the sun side (-x) falls away into the forest, the far side rises to a ridge
  const e = Math.max(ad - hw - 6, 0);
  let relief = lat > 0 ? Math.min(0.22 * e + 0.00022 * e * e, 900) : Math.min(-0.10 * e + 0.00012 * e * e, 320);
  if (c.beyond > 0) relief = lerp(relief, Math.min(0.12 * e, 400), smooth(0, 500, c.beyond));   // past the run-out the valley opens out — blended, or it steps
  // rolling noise, and a fine roughness for wind-worked snow — both zero on the groomed run
  const big = fbm(x * 0.0022, z * 0.0022, 3, 3) * (40 + 0.09 * Math.min(ad, 1400)) + fbm(x * 0.0085, z * 0.0085, 2, 9) * (10 + 0.02 * Math.min(ad, 800));
  const mid = fbm(x * 0.028, z * 0.028, 3, 57) * 3.2 + ridged(x * 0.016, z * 0.016, 2, 63) * 2.5;     // drifts and wind-worked undulations
  const fine = fbm(x * 0.07, z * 0.07, 2, 21) * 1.0 + vnoise(x * 0.23, z * 0.23, 33) * 0.18 + mid;
  const mp = smooth(hw + 10, hw + 160, ad);
  y += relief * (0.3 + 0.7 * m) + big * mb + fine * m + (peaksH(x, z) + massifH(x, z)) * (0.1 + 0.9 * mp);
  // groomed rollers on the approach piste are in the profile; the course itself is a true plane
  return y;
}
function terrainH(x, z) { return terrainBase(x, z) + courseDetail(x, z); }

// ============================================================================ terrain grids
class Grid {
  constructor(xs, zs, fn) {
    this.xs = xs; this.zs = zs; this.nx = xs.length; this.nz = zs.length; this.h = new Float32Array(this.nx * this.nz);
    for (let j = 0; j < this.nz; j++) for (let i = 0; i < this.nx; i++) this.h[j * this.nx + i] = fn(xs[i], zs[j]);
    this.x0 = xs[0]; this.x1 = xs[this.nx - 1]; this.z0 = zs[0]; this.z1 = zs[this.nz - 1];
    this.uni = xs.uniform && zs.uniform; this.sx = (this.x1 - this.x0) / (this.nx - 1); this.sz = (this.z1 - this.z0) / (this.nz - 1);
    let mx = -1e9; for (let i = 0; i < this.h.length; i++) if (this.h[i] > mx) mx = this.h[i]; this.maxH = mx;
    if (!this.uni) { this.tx = Grid.table(xs); this.tz = Grid.table(zs); }
  }

  _dir.set(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
  if (app.override) { const o = app.override; _pos.set(o[0], o[1], o[2]); _dir.set(o[3] - o[0], o[4] - o[1], o[5] - o[2]).normalize(); }
  camera.position.copy(_pos); camera.up.set(0, 1, 0); camera.lookAt(_pos.x + _dir.x, _pos.y + _dir.y, _pos.z + _dir.z);
  camera.rotateZ(Math.sin(time * 0.35) * 0.006);
  knob.style.top = (100 * app.u / DRONE.len) + '%';
}

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  placeCamera(dt, time);
  terrain.mat.uniforms.uCam.value.copy(camera.position); terrain.mat.uniforms.uTime.value = time;
  forest.material.uniforms.uCam.value.copy(camera.position); sky.mat.uniforms.uTime.value = time;
  scene.traverse(o => { if (o.material && o.material.uniforms && o.material.uniforms.uCam && o !== terrain.fine && o !== terrain.coarse && o !== forest) o.material.uniforms.uCam.value.copy(camera.position); });
  const t0 = performance.now();
  post.render(scene, camera, time);
  // adaptive resolution: settle where the phone keeps up
  const ft = performance.now() - t0; app.ft.push(ft); if (app.ft.length > 40) app.ft.shift();
  if (app.ft.length === 40 && app.cool-- <= 0) { const avg = app.ft.reduce((a, b) => a + b, 0) / 40;
    if (avg > 24 && app.scale > 0.55) { app.scale = Math.max(0.55, app.scale - 0.12); resize(); app.cool = 60; app.ft.length = 0; }
    else if (avg < 9 && app.scale < 1) { app.scale = Math.min(1, app.scale + 0.08); resize(); app.cool = 120; app.ft.length = 0; } }
  app.frame++;
}

window.__SLOPE = {
  jump(u) { app.u = clamp(u, 0, DRONE.len); app.orbit = 0; camY = null; }, fly(on) { setFly(on); },
  look(yaw, pitch) { app.look.yaw = yaw; app.look.pitch = pitch; app.lastInput = performance.now() + 1e9; },
  state() { const d = new THREE.Vector3(); camera.getWorldDirection(d); return { u: app.u, len: DRONE.len, flying: app.flying, cam: camera.position.toArray(), dir: d.toArray(), scale: app.scale, ft: app.ft.slice(-5), half: post.half, build: terrain.stats, trees: forest.userData.trees }; },
  h: terrainH, base: terrainBase, ground: heightAt, terrain: () => terrain, run: RUN, drone: DRONE, trace: shadowTrace, scene: () => scene,
  cam(px, py, pz, tx, ty, tz) { app.override = arguments.length ? [px, py, pz, tx, ty, tz] : null; },
  bake: (x, z) => bakeShadow(x, heightAt(x, z), z, false, SUN),
  vert(x, z) { const g = coarseGrid; const i = Grid.idx(g.xs, x), j = Grid.idx(g.zs, z); const k = j * g.nx + i; const a = terrain.coarse.geometry.attributes.aux.array, p = terrain.coarse.geometry.attributes.position.array; return { x: p[3 * k], y: p[3 * k + 1], z: p[3 * k + 2], sh: a[4 * k], type: a[4 * k + 2], gridH: g.h[k] }; },
};
setTimeout(init, 40);
</script>
