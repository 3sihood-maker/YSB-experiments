<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jesus's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12232B;
    --ink-2:#1B333D;
    --ink-3:#0D1A20;
    --paper:#F6EFDD;
    --paper-dim:#EFE4C8;
    --ink-text:#241C12;
    --gold:#D4A73D;
    --spark:#E0A83E;
    --spotlight:#3FA7A1;
    --curveball:#C9605A;
    --line: rgba(246,239,221,0.14);
    --muted: rgba(246,239,221,0.56);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
  body{
    min-height:100vh;
    background:
      radial-gradient(90% 60% at 50% 0%, rgba(212,167,61,0.10), transparent 60%),
      radial-gradient(70% 50% at 85% 100%, rgba(63,167,161,0.10), transparent 60%),
      linear-gradient(180deg, var(--ink) 0%, var(--ink-3) 100%);
    color: var(--paper);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border:none; background:none; }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:4px; }
  .shell{ max-width:760px; margin:0 auto; padding: 0 18px; }
  /* ---------- Top bar ---------- */
  .topbar{ position:sticky; top:0; z-index:20; backdrop-filter: blur(10px); background: rgba(18,35,43,0.86); border-bottom:1px solid var(--line); }
  .topbar-inner{ max-width:760px; margin:0 auto; padding: 14px 18px 12px; display:flex; flex-direction:column; gap:12px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:30px; height:30px; border-radius:50%; background: radial-gradient(circle at 35% 30%, var(--gold), #8a6a1f); flex-shrink:0; box-shadow: 0 0 0 1px rgba(212,167,61,0.4); }
  .brand-kicker{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color: var(--gold); font-weight:700; }
  .brand-title{ font-family:'Spectral', serif; font-weight:600; font-style:italic; font-size:19px; margin-top:1px; }
  .tabs{ display:flex; gap:4px; background: rgba(255,255,255,0.05); padding:4px; border-radius:100px; }
  .tab{ flex:1; padding:9px 10px; border-radius:100px; font-size:13px; font-weight:700; color: var(--muted); transition: all .2s ease; }
  .tab.active{ background: var(--paper); color: var(--ink-text); }
  .tab:not(.active):hover{ color: var(--paper); }
  main{ max-width:760px; margin:0 auto; padding: 26px 18px 0; }
  /* ---------- shared type styles ---------- */
  .type-spark{ --t: var(--spark); }
  .type-spotlight{ --t: var(--spotlight); }
  .type-curveball{ --t: var(--curveball); }
  .seal{
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:700; letter-spacing:.04em;
    width:34px; height:34px; border-radius:50%; color:#fff; background: var(--t);
    box-shadow: 0 0 0 3px rgba(0,0,0,0.18) inset, 0 4px 10px -4px rgba(0,0,0,0.5);
    flex-shrink:0;
  }
  /* ================= LEARN ================= */
  .hero{ animation: rise .6s cubic-bezier(.2,.8,.2,1); margin-bottom:8px; }
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  .kicker{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color: var(--gold); margin-bottom:10px; }
  h1{ font-family:'Spectral', serif; font-weight:700; font-size: clamp(28px,6.4vw,38px); line-height:1.15; margin:0 0 14px; letter-spacing:-0.01em; }
  h1 em{ font-style:italic; color: var(--gold); }
  .lede{ font-size:15.5px; line-height:1.65; color: rgba(246,239,221,0.82); max-width:56ch; margin:0 0 30px; }
  .type-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px; }
  @media (max-width:620px){ .type-grid{ grid-template-columns:1fr; } }
  .type-card{
    background: var(--paper); color: var(--ink-text); border-radius:18px; padding:18px 16px;
    display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden;
  }
  .type-card::before{ content:""; position:absolute; top:0; left:0; right:0; height:5px; background: var(--t); }
  .type-card .icon-wrap{ width:38px; height:38px; border-radius:10px; background: color-mix(in srgb, var(--t) 18%, transparent); display:flex; align-items:center; justify-content:center; color: var(--t); }
  .type-card .icon-wrap svg{ width:20px; height:20px; }
  .type-card .num{ font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; color: var(--t); letter-spacing:.06em; }
  .type-card h3{ font-family:'Spectral',serif; font-weight:700; font-size:19px; margin:0; }
  .type-card .tagline{ font-size:12.5px; font-weight:700; color:#5c5140; margin-top:-6px; }
  .type-card p{ font-size:13px; line-height:1.55; color:#4c4335; margin:0; }
  .type-card .example{ font-size:12px; line-height:1.5; color:#6b6150; background:#efe4c8; border-radius:10px; padding:9px 11px; margin-top:2px; }
  .type-card .example b{ color:#3a3222; }
  .bridge{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; background: rgba(255,255,255,0.05); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin:22px 0 30px; }
  .bridge p{ margin:0; font-size:14px; color: rgba(246,239,221,0.85); max-width:46ch; }
  .btn{ padding:11px 18px; border-radius:100px; font-weight:700; font-size:13.5px; display:inline-flex; align-items:center; gap:7px; transition: transform .15s ease, opacity .15s ease; white-space:nowrap; }
  .btn:active{ transform:scale(0.97); }
  .btn-gold{ background: var(--gold); color:#2a2007; }
  .btn-gold:hover{ opacity:.9; }
  .btn-outline{ background:transparent; color: var(--paper); border:1.5px solid rgba(246,239,221,0.35); }
  .btn-outline:hover{ border-color: var(--gold); color: var(--gold); }
  .btn-block{ width:100%; justify-content:center; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  /* ================= CLASSROOM ================= */
  .classroom-head{ margin-bottom:16px; }
  .subtabs{ display:inline-flex; gap:4px; background: rgba(255,255,255,0.05); padding:4px; border-radius:100px; margin:14px 0 20px; }
  .subtab{ padding:8px 18px; border-radius:100px; font-size:13px; font-weight:700; color: var(--muted); }
  .subtab.active{ background: var(--gold); color:#2a2007; }
  .artifact-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:11px; margin-bottom:20px; }
  @media (max-width:560px){ .artifact-grid{ grid-template-columns:repeat(2,1fr); } }
  .artifact{
    background: var(--paper); border-radius:14px; padding:14px 10px 12px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:8px; position:relative;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .artifact:hover{ transform: translateY(-3px); box-shadow: 0 14px 24px -14px rgba(0,0,0,0.5); }
  .artifact .medallion{ width:46px; height:46px; border-radius:50%; background: color-mix(in srgb, var(--t) 16%, #fff); display:flex; align-items:center; justify-content:center; color: var(--t); }
  .artifact .medallion svg{ width:24px; height:24px; }
  .artifact .name{ font-size:12px; font-weight:700; color:#2f2718; line-height:1.3; }
  .artifact .dot{ position:absolute; top:9px; right:9px; width:8px; height:8px; border-radius:50%; background: var(--t); }
  /* modal */
  .modal-overlay{ position:fixed; inset:0; background: rgba(9,17,21,0.72); backdrop-filter: blur(3px); z-index:50; display:flex; align-items:flex-end; justify-content:center; animation: fadeIn .2s ease; }
  @media (min-width:600px){ .modal-overlay{ align-items:center; } }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal-card{
    background: var(--paper); color: var(--ink-text); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:26px 22px 28px;
    animation: unearth .35s cubic-bezier(.2,.8,.2,1); max-height:88vh; overflow-y:auto;
  }
  @media (min-width:600px){ .modal-card{ border-radius:22px; margin-bottom:20px; } }
  @keyframes unearth{ from{ opacity:0; transform: translateY(30px) scale(0.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  .modal-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .modal-icon{ width:54px; height:54px; border-radius:14px; background: color-mix(in srgb, var(--t) 18%, transparent); color: var(--t); display:flex; align-items:center; justify-content:center; }
  .modal-icon svg{ width:28px; height:28px; }
  .modal-close{ font-size:20px; color:#8a7d5f; padding:4px 8px; }
  .modal-close:hover{ color:#2f2718; }
  .modal-card h3{ font-family:'Spectral',serif; font-size:22px; font-weight:700; margin:0 0 6px; }
  .modal-type{ display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.06em; color: var(--t); text-transform:uppercase; margin-bottom:14px; }
  .modal-card p.story{ font-size:14.5px; line-height:1.62; color:#3a3222; margin:0 0 14px; }
  .modal-note{ background:#efe4c8; border-left:3px solid var(--t); border-radius:0 10px 10px 0; padding:11px 14px; font-size:12.5px; line-height:1.5; color:#5c5140; margin-bottom:14px; }
  .modal-note b{ color:#2f2718; display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; font-family:'JetBrains Mono',monospace; margin-bottom:4px; }
  .tag-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag-chip{ font-size:11px; font-weight:600; padding:5px 10px; border-radius:100px; background:#e5dabd; color:#5c5140; }
  /* ================= MY MOMENTS ================= */
  .mm-stepper{ display:flex; gap:6px; margin-bottom:22px; }
  .mm-dot{ flex:1; height:4px; border-radius:100px; background: rgba(255,255,255,0.12); transition: background .3s ease; }
  .mm-dot.active, .mm-dot.done{ background: var(--gold); }
  .mm-card{ background: var(--paper); color: var(--ink-text); border-radius:20px; padding:24px 22px; animation: rise .4s cubic-bezier(.2,.8,.2,1); margin-bottom:16px; }
  .mm-card h2{ font-family:'Spectral',serif; font-size:22px; font-weight:700; margin:0 0 8px; }
  .mm-card .sub{ font-size:13.5px; color:#6b6150; margin:0 0 18px; line-height:1.5; }
  .type-pick-grid{ display:flex; flex-direction:column; gap:10px; }
  .type-pick{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:14px; border:1.5px solid #e5dabd; text-align:left; transition: all .15s ease; }
  .type-pick:hover{ border-color: var(--t); background:#efe4c8; }
  .type-pick.selected{ border-color: var(--t); background: color-mix(in srgb, var(--t) 12%, #fff); }
  .type-pick .icon-wrap{ width:34px; height:34px; border-radius:9px; background: color-mix(in srgb, var(--t) 20%, transparent); color: var(--t); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .type-pick .icon-wrap svg{ width:18px; height:18px; }
  .type-pick .txt b{ display:block; font-size:14px; color:#2f2718; }
  .type-pick .txt span{ font-size:12px; color:#6b6150; }
  textarea{ width:100%; border:1.5px solid #e5dabd; border-radius:12px; padding:12px 14px; font-family:'Inter',sans-serif; font-size:14px; color:#241c12; resize:vertical; min-height:90px; background:#fffdf7; }
  textarea:focus{ outline:none; border-color: var(--gold); }
  textarea::placeholder{ color:#b3a688; }
  label.field-label{ display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#8a7d5f; margin: 16px 0 8px; }
  label.field-label:first-of-type{ margin-top:0; }
  .feeling-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .feeling-chip{ font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:100px; border:1.5px solid #e5dabd; color:#4c4335; transition: all .15s ease; }
  .feeling-chip:hover{ border-color: var(--gold); }
  .feeling-chip.selected{ background: var(--gold); border-color: var(--gold); color:#2a2007; }
  /* chat */
  .chat-thread{ display:flex; flex-direction:column; gap:12px; margin-bottom:16px; }
  .bubble{ max-width:88%; padding:12px 15px; border-radius:16px; font-size:14px; line-height:1.5; }
  .bubble.mentor{ background:#efe4c8; color:#2f2718; align-self:flex-start; border-bottom-left-radius:4px; }
  .bubble.you{ background: var(--ink-text); color: var(--paper); align-self:flex-end; border-bottom-right-radius:4px; }
  .bubble.thinking{ display:flex; gap:4px; align-items:center; }
  .bubble.thinking span{ width:6px; height:6px; border-radius:50%; background:#8a7d5f; animation: bounce 1.1s infinite ease-in-out; }
  .bubble.thinking span:nth-child(2){ animation-delay:.15s; }
  .bubble.thinking span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5;} 30%{ transform:translateY(-4px); opacity:1;} }
  .chat-input-row{ display:flex; gap:8px; }
  .chat-input-row input{ flex:1; border:1.5px solid #e5dabd; border-radius:100px; padding:12px 16px; font-size:14px; font-family:'Inter',sans-serif; background:#fffdf7; color:#241c12; }
  .chat-input-row input:focus{ outline:none; border-color: var(--gold); }
  .btn-round{ width:44px; height:44px; border-radius:50%; background: var(--ink-text); color: var(--paper); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .btn-round:disabled{ opacity:.35; }
  .crisis-card{ background:#fff4f0; border:1.5px solid #f0b4a4; border-radius:16px; padding:18px; margin-bottom:16px; }
  .crisis-card b{ display:block; color:#9c3a20; font-size:14px; margin-bottom:6px; }
  .crisis-card p{ font-size:13.5px; line-height:1.55; color:#5c4030; margin:0 0 8px; }
  .crisis-card a{ color:#9c3a20; font-weight:700; text-decoration:underline; }
  .match-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
  .match-card{ display:flex; gap:12px; align-items:flex-start; padding:13px; border-radius:14px; border:1.5px solid #e5dabd; }
  .match-card .medallion{ width:38px; height:38px; border-radius:50%; background: color-mix(in srgb, var(--t) 18%, #fff); color: var(--t); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .match-card .medallion svg{ width:20px; height:20px; }
  .match-card .body b{ display:block; font-size:13.5px; color:#2f2718; margin-bottom:3px; }
  .match-card .body p{ font-size:12.5px; line-height:1.5; color:#6b6150; margin:0 0 8px; }
  .match-card .body button{ font-size:12px; font-weight:700; color: var(--t); }
  .foot-nav{ display:flex; justify-content:space-between; margin-top:6px; }
  .foot-nav button{ color: rgba(246,239,221,0.55); font-weight:600; font-size:13px; padding:8px; }
  .foot-nav button:hover:not(:disabled){ color: var(--paper); }
  .foot-nav button:disabled{ opacity:0.25; visibility:hidden; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-kicker">Field notes from</div>
        <div class="brand-title">Jesus's Classroom</div>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="learn">Learn</button>
      <button class="tab" data-tab="classroom">Classroom</button>
      <button class="tab" data-tab="moments">My Moments</button>
    </div>
  </div>
</div>
<main id="view"></main>
<div id="modalRoot"></div>
<script>
/* ============================================================
   ICONS — small line-art SVGs, colored via currentColor
   ============================================================ */
const ICON = {

  jericho_road: `<path d="M3 20c3-4 3-7 6-9s3-5 6-5 3 3 6 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="12.2" r="1" fill="currentColor"/>`,

  hillside_night: `<path d="M15.2 5a5 5 0 1 0 3.8 8.3 6 6 0 0 1-3.8-8.3z" fill="currentColor"/><path d="M3 19c3-3 6-3 9 0s6 3 9 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>`,
  funeral: `<path d="M12 3c1.5 2 2 3.3 2 4.6A2 2 0 0 1 12 9a2 2 0 0 1-2-2c0-1.3.5-2.6 2-4z" fill="currentColor"/><rect x="10.4" y="9" width="3.2" height="9" rx="0.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 20h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>`,
  tax_booth: `<rect x="4" y="8.5" width="16" height="9.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 8.5V6.3h4v2.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 12v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>`,

function wireMoments(){

  if(mm.step===0){
    document.querySelectorAll('.type-pick').forEach(b=>{

    document.querySelectorAll('.feeling-chip').forEach(chip=>{

        if(idx>-1) mm.feelings.splice(idx,1);
        else if(mm.feelings.length<3) mm.feelings.push(id);
        render();
        document.getElementById('mmText').focus();
      };
    });
    // inject a Continue button into the card
    const card = document.querySelector('.mm-card');
    const cont = document.createElement('div');
    cont.innerHTML = `<button class="btn btn-gold btn-block" id="mmToReflect" style="margin-top:20px;">Continue →</button>`;
    card.appendChild(cont.firstElementChild);
    document.getElementById('mmToReflect').onclick = () => {
      const text = (mm.text||'').trim();
      if(text.length<3 || mm.feelings.length===0){
        alert('Add a sentence about what happened and pick at least one feeling.');
        return;
      }
      mm.crisis = isCrisisText(text);
      mm.step = 2;
      mm.chat = [];
      mm.asked = [];
      render();
      if(!mm.crisis) askNextQuestion();
    };
  }
  if(mm.step===2 && !mm.crisis){
    const input = document.getElementById('chatInput');
    const send = document.getElementById('chatSend');
    const doSend = () => {
      const val = input.value.trim();
      if(!val || mm.thinking) return;
      if(isCrisisText(val)){ mm.crisis = true; render(); return; }
      mm.chat.push({role:'user', text:val});
      input.value = '';
      render();
      askNextQuestion();
    };
    if(send) send.onclick = doSend;
    if(input) input.onkeydown = (e)=>{ if(e.key==='Enter') doSend(); };
    const doneBtn = document.getElementById('mmDoneReflecting');
    if(doneBtn) doneBtn.onclick = () => { mm.step = 3; render(); };
    const thread = document.getElementById('chatThread');
    if(thread) thread.scrollTop = thread.scrollHeight;
  }
  if(mm.step===3){
    document.querySelectorAll('[data-open]').forEach(b=>{
      b.onclick = () => openArtifactModal(b.dataset.open);
    });
    const restart = document.getElementById('mmRestart');
    if(restart) restart.onclick = () => {
      mm = { step:0, type:null, text:"", feelings:[], chat:[], crisis:false, thinking:false, asked:[] };
      render();
    };
  }
}
/* ============================================================
   ASK IT BACK — the question bank

   Everything here runs on the device. Nothing typed into My Moments
   leaves the page: no account, no network call, no storage.

   The rules these questions follow, so new ones stay in keeping:
     · ask, never advise — no conclusions, verses or interpretations
     · short, plain, second person, under about twenty words
     · open at the end — never answerable with yes or no
   ============================================================ */
/* First question in, chosen by the kind of moment it was. */
const OPENERS = {
  spark: [
    "What do you think they were hoping you'd notice?",
    "When did you realise it wasn't just a game?",
    "What was going through your head while it was happening?",
    "Did it land the way they meant it to?",
    "What would have made you more willing to open up?",
    "What part of it stayed with you afterward?"
  ],
  spotlight: [
    "What made you ask it out loud, right then?",
    "How long had that question been sitting with you?",
    "What answer were you half hoping for?",
    "What made it feel safe enough to say?",
    "What would you have asked if nobody was listening?",
    "Did saying it change anything about how it felt?"
  ],
  curveball: [
    "What was the first thing you felt when it happened?",
    "What did you expect to happen instead?",
    "Who did you want to tell first, and why?",
    "What's stayed with you most since?",
    "What would you tell a friend if it happened to them?",
    "How did you get through the rest of that day?"
  ]
};
/* Deepening questions, used from the second turn on. */
const DEEPENERS = [
  "What part of that is hardest to say out loud?",
  "What would change if that turned out not to be true?",
  "Who else knows this, and who doesn't?",
  "What do you wish someone had said to you?",
  "Is there a part of it you keep going back over?",
  "What would you need to hear to feel differently?",
  "What are you telling yourself about why it happened?",
  "How much of it was actually up to you?",
  "What would you want to be true a year from now?",
  "What's the smallest thing that would help right now?",
  "If that feeling could speak, what would it say?",
  "What's underneath that, if you sit with it?",
  "What are you afraid it says about you?",
  "Has anything like this happened before?",
  "What would you do differently, knowing what you know now?",
  "What's one thing you're still not sure about?",
  "Where do you notice it in your body?",
  "What would letting go of it cost you?"
];
/* A few tuned to a particular feeling, tried first when it's the one picked. */
const BY_FEELING = {
  rejected:   ["Whose opinion of you carries the most weight right now?",
               "What did you want them to see in you?"],
  overlooked: ["What would being noticed have looked like?",
               "Who does see it, even if they didn't say so?"],
  afraid:     ["What's the worst outcome you keep picturing?",
               "What would you do if you knew it would be alright?"],
  ashamed:    ["Would you judge a friend the way you're judging yourself?",
               "Who would you want to know, if you could choose?"],
  doubtful:   ["What would it take to be more sure either way?",
               "What do you still believe, even in the doubt?"],
  stuck:      ["What's the first small step you could actually take?",
               "What are you calling failure that someone else might not?"],
  grieving:   ["What do you most want to remember?",
               "What's been the hardest hour of the day?"],
  comparing:  ["Whose life are you measuring yours against?",
               "What would be enough, if you got to decide?"],
  angry:      ["What's the anger protecting?",
               "What would justice look like here?"],
  lonely:     ["Who would you reach out to if it were easy?",
               "When did you last feel properly known?"],
  burnedout:  ["What are you carrying that isn't yours?",
               "What would you drop first if you were allowed?"],
  identity:   ["Who do you sound like when you describe yourself?",
               "What would you keep about yourself, whatever changed?"]
};
/* Pick something we haven't already asked this session. */
function pickUnused(pool){
  const fresh = pool.filter(q => !mm.asked.includes(q));
  if(!fresh.length) return null;
  return fresh[Math.floor(Math.random() * fresh.length)];
}
function nextQuestion(){
  const turn = mm.chat.filter(m => m.role === 'assistant').length;
  const tries = turn === 0
    ? [OPENERS[mm.type] || [], feelingPool(), DEEPENERS]
    : [feelingPool(), DEEPENERS, OPENERS[mm.type] || []];
  for(const pool of tries){
    const q = pickUnused(pool);
    if(q) return q;
  }
  // every question used — a plain, always-available fallback
  return "What else is worth saying about it?";
}
function feelingPool(){
  const out = [];
  mm.feelings.forEach(f => { (BY_FEELING[f] || []).forEach(q => out.push(q)); });
  return out;
}
function askNextQuestion(){
  mm.thinking = true;
  render();
  // a short beat, so the question doesn't snap in before you've finished typing
  setTimeout(() => {
    const q = nextQuestion();
    mm.asked.push(q);
    mm.chat.push({ role:'assistant', text:q });
    mm.thinking = false;
    render();
    const thread = document.getElementById('chatThread');
    if(thread) thread.scrollTop = thread.scrollHeight;
  }, 650);
}
/* ============================================================
   INIT
   ============================================================ */
render();
</script>
