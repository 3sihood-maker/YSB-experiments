  #halo{
    position:absolute;border-radius:50%;
    border:4px solid rgba(255,255,255,.95);
    box-shadow:0 0 0 10px rgba(255,214,120,.35), 0 0 46px 18px rgba(255,190,70,.65),
               inset 0 0 30px rgba(255,220,140,.35);
    animation:pulse 2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);opacity:1}
    50%{transform:scale(1.09);opacity:.55}
  }
  /* ---------- header ---------- */
  header{
    position:absolute;top:0;left:0;right:0;z-index:5;
    padding:calc(10px + env(safe-area-inset-top)) 16px 26px;
    background:linear-gradient(to bottom, rgba(6,43,59,.85), rgba(6,43,59,0));
    color:#fff;pointer-events:none;
  }
  header h1{
    font-family:'DynaPuff','Nunito','Trebuchet MS',sans-serif;
    font-size:19px;letter-spacing:.3px;font-weight:600;
    text-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  header .sub{font-size:11.5px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}
  #progressTrack{
    margin-top:9px;height:6px;border-radius:3px;background:rgba(255,255,255,.22);
    overflow:hidden;
  }
  #progressFill{
    height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,#FFB25E,var(--orange));
    transition:width .8s cubic-bezier(.45,.05,.2,1);
  }
  /* ---------- story card ---------- */
  #card{
    position:absolute;left:0;right:0;bottom:0;z-index:6;
    background:var(--card);
    border-radius:22px 22px 0 0;
    box-shadow:0 -8px 32px rgba(4,30,42,.45);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    min-height:var(--card-h);
    display:flex;flex-direction:column;
  }
  #cardInner{flex:1;transition:opacity .35s ease, transform .35s ease}
  #cardInner.swap{opacity:0;transform:translateY(8px)}
  .metaRow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .numChip{
    width:34px;height:34px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);color:#fff;font-weight:800;font-size:16px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(244,123,32,.45);
    font-family:'DynaPuff','Nunito','Trebuchet MS',sans-serif;
  }
  .testament{
    font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
    padding:4px 10px;border-radius:99px;
  }
  .testament.ot{background:#E4F1F8;color:#176A93}
  .testament.mid{background:#F0EBF9;color:#6B4FA1}
  .testament.nt{background:#FDEEDF;color:#C25E0A}
  .counter{margin-left:auto;font-size:12px;font-weight:800;color:#9AB0BE}
  #storyTitle{
    font-family:'DynaPuff','Nunito','Trebuchet MS',sans-serif;font-weight:600;
    font-size:21px;line-height:1.15;color:var(--ink);margin-bottom:6px;
  }
  #storyText{font-size:14.5px;line-height:1.5;color:var(--sub);font-weight:600}
  .refPill{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    background:#F2F7FA;border:1.5px solid #DCE8EF;color:#176A93;
    font-size:13px;font-weight:800;padding:6px 12px;border-radius:99px;
  }
  .refPill svg{flex:0 0 auto}
  /* ---------- nav ---------- */
  #nav{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-top:12px;
  }
  .navBtn{
    width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
    background:var(--orange);color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 5px 14px rgba(244,123,32,.5), inset 0 -3px 0 rgba(0,0,0,.15);
    transition:transform .15s ease, opacity .3s ease, background .3s ease;
    flex:0 0 auto;
  }
  .navBtn:active{transform:scale(.92)}
  .navBtn:disabled{background:#CBD8E0;box-shadow:none;opacity:.6;cursor:default}
  .navHint{
    flex:1;text-align:center;font-size:11.5px;font-weight:800;color:#9AB0BE;
    text-transform:uppercase;letter-spacing:1px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="scene">
    <div class="layer" id="bgLayer"></div>
    <div class="layer" id="dotsLayer"></div>
    <div class="layer" id="fgLayer"><div id="halo"></div></div>
  </div>

  <header>
    <h1>The Big Story of the Bible</h1>
    <div class="sub">A journey in 24 stops</div>
    <div id="progressTrack"><div id="progressFill"></div></div>
  </header>

  <div id="card">
    <div id="cardInner">
      <div class="metaRow">
        <div class="numChip" id="numChip">1</div>
        <div class="testament ot" id="testament">Old Testament</div>
        <div class="counter" id="counter">1 / 24</div>
      </div>
      <div id="storyTitle">Creation</div>
      <div id="storyText"></div>
      <div class="refPill" id="refPill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span id="refText">Genesis 1–2</span>
      </div>
    </div>
    <div id="nav">
      <button class="navBtn" id="prevBtn" aria-label="Previous story">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="navHint" id="navHint">Swipe or tap arrows</div>
      <button class="navBtn" id="nextBtn" aria-label="Next story">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const WORLD = {w:2600, h:1000};
const ICON_R = 83; // outer ring radius in world px

const STORIES = [
 {n:1,  x:245,  y:829, t:"Creation", tag:"ot", ref:"Genesis 1–2",
  s:"In the beginning God made everything — light, land, sea, plants, animals and people — and it was all very good. People were made to know God and care for His world."},
 {n:2,  x:497,  y:829, t:"The Fall", tag:"ot", ref:"Genesis 3",
  s:"Adam and Eve listened to the serpent and disobeyed God, eating the forbidden fruit. Sin and death entered the world — but God promised that one day a rescuer would come."},
 {n:3,  x:705,  y:711, t:"Flood Over All", tag:"ot", ref:"Genesis 6–9",
  s:"The world filled up with evil, so God sent a great flood — but He saved Noah, his family and the animals in the ark. The rainbow became the sign of God's promise."},
 {n:4,  x:501,  y:573, t:"Abraham, Isaac & Jacob", tag:"ot", ref:"Genesis 12–35",
  s:"God promised Abraham a land, a family as countless as the stars, and blessing for the whole world through his family. The promise passed on to Isaac, then Jacob — who became Israel."},
 {n:5,  x:269,  y:447, t:"Joseph, Egypt & Slavery", tag:"ot", ref:"Genesis 37–50; Exodus 1",
  s:"Joseph was sold as a slave, but God used him to save many lives in a famine, and Israel's family settled in Egypt. Years later, a new Pharaoh made God's people slaves."},
 {n:6,  x:349,  y:219, t:"Moses & the Exodus", tag:"ot", ref:"Exodus 1–20",
  s:"God heard His people's cry and rescued them through Moses — the plagues, the Passover lamb and the path through the Red Sea. At Mount Sinai He gave them His law."},
 {n:7,  x:589,  y:187, t:"Joshua's Conquest", tag:"ot", ref:"Joshua 1–24",
  s:"God kept His promise and brought Israel into the promised land. The walls of Jericho came tumbling down, and the land was shared out among the twelve tribes."},
 {n:8,  x:807,  y:313, t:"Judges", tag:"ot", ref:"Judges 2:16–19",
  s:"Israel kept forgetting God, getting into trouble, and crying out for help. Again and again God sent judges like Deborah, Gideon and Samson to rescue them."},
 {n:9,  x:895,  y:577, t:"Kings", tag:"ot", ref:"1 & 2 Samuel; 1 Kings 1–10",
  s:"Israel asked for a king. After Saul came David, a man after God's own heart, then Solomon who built the temple. God promised David a King who would reign forever."},
 {n:10, x:977,  y:819, t:"Divided Kingdoms", tag:"ot", ref:"1 Kings 12",
  s:"After Solomon, the nation split in two — Israel in the north and Judah in the south. Most kings turned away from God, and He sent prophets to warn them."},
 {n:11, x:1245, y:837, t:"Exile to Assyria & Babylon", tag:"ot", ref:"2 Kings 17; 25",
  s:"Because the people would not listen, Israel was carried off by Assyria, and later Judah by Babylon. Even far from home, God stayed with His people — like Daniel in Babylon."},
 {n:12, x:1459, y:719, t:"Return Under Persia", tag:"ot", ref:"Ezra 1; Nehemiah 1–6",
  s:"God moved Cyrus, king of Persia, to send His people home. Led by Ezra and Nehemiah they rebuilt the temple and the walls of Jerusalem."},
 {n:13, x:1353, y:507, t:"400 Years of Silence", tag:"mid", ref:"Malachi → Matthew",
  s:"Between the Old and New Testaments, no prophet spoke for around 400 years. God's people waited and watched for the promised King to come."},
 {n:14, x:1211, y:195, t:"The Birth of Jesus", tag:"nt", ref:"Luke 2:1–20; Matthew 1:18–25",
  s:"At just the right time, God's own Son was born in Bethlehem — Immanuel, 'God with us'. Angels announced the news and shepherds hurried to worship Him."},
 {n:15, x:1461, y:159, t:"Miracles are Signs", tag:"nt", ref:"John 20:30–31; Mark 4–6",
  s:"Jesus healed the sick, calmed storms, fed thousands and even raised the dead. His miracles were signs, showing that He truly is the Son of God."},
 {n:16, x:1647, y:327, t:"Teaching the Kingdom", tag:"nt", ref:"Matthew 5–7; 13",
  s:"Jesus taught what God's kingdom is like — with parables about seeds, treasure and fishing nets. He taught us to love God with all our heart and to love our neighbour."},
 {n:17, x:1675, y:573, t:"The Cross", tag:"nt", ref:"Luke 23; John 19",
  s:"Jesus died on the cross, taking the punishment for our sin in our place. 'It is finished!' — the rescue promised from the very beginning was complete."},
 {n:18, x:1823, y:779, t:"Empty Tomb — Jesus Alive!", tag:"nt", ref:"Luke 24; John 20",
  s:"On the third day the tomb was empty — Jesus rose from the dead and His friends saw Him alive. Death is defeated, and everything sad is coming untrue."},
 {n:19, x:2081, y:827, t:"Jesus Says Go!", tag:"nt", ref:"Matthew 28:18–20",
  s:"The risen Jesus sent His followers out to make disciples of all nations, baptising and teaching them — with the promise, 'I am with you always.'"},
 {n:20, x:2311, y:783, t:"Jesus to Heaven", tag:"nt", ref:"Acts 1:1–11",
  s:"Jesus went up to heaven to rule at God's right hand. He promised to send the Holy Spirit — and that one day He will come back the same way He left."},
 {n:21, x:2293, y:549, t:"The Holy Spirit Comes", tag:"nt", ref:"Acts 2",
  s:"At Pentecost, God's Spirit came with the sound of wind and tongues of fire. Peter preached the good news, and about 3,000 people believed in one day."},
 {n:22, x:2071, y:479, t:"Church Everywhere", tag:"nt", ref:"Acts 2:42–47; 8–28",
  s:"The good news spread from Jerusalem to Judea, Samaria and the ends of the earth. People like Paul planted churches everywhere they went."},
 {n:23, x:2111, y:175, t:"Jesus Will Return", tag:"nt", ref:"Acts 1:11; Revelation 19",
  s:"One day Jesus will return as King of kings, to judge the world and put everything right. So we stay ready, living for Him while we wait."},
 {n:24, x:2351, y:185, t:"Hope of Heaven Forever", tag:"nt", ref:"Revelation 21–22",
  s:"God will make a new heaven and a new earth, and wipe away every tear. His people will live with Him forever — the happy ending that never ends."}
];

const TAGS = {ot:["Old Testament","ot"], mid:["Between the Testaments","mid"], nt:["New Testament","nt"]};

const app   = document.getElementById('app');
const layers = {
  bg:   {el:document.getElementById('bgLayer'),   f:0.35},
  dots: {el:document.getElementById('dotsLayer'), f:0.62},
  fg:   {el:document.getElementById('fgLayer'),   f:1.00}
};
const halo = document.getElementById('halo');

let idx = 0, vw=0, vh=0, S=1;

function layout(){
  vw = app.clientWidth; vh = app.clientHeight;
  // zoom so an icon (~166 world px) is ~40% of viewport width, min coverage guaranteed
  S = Math.max(vw*0.40/(ICON_R*2), vh*1.02/WORLD.h, vw/WORLD.w);
  // depth = relative scale; every layer spans the whole journey, smaller = slower = farther
  layers.fg.s   = S;
  layers.dots.s = Math.max(S*0.94, vh*1.01/WORLD.h, vw/WORLD.w);
  layers.bg.s   = Math.max(S*0.84, vh*1.01/WORLD.h, vw/WORLD.w);
  for (const k in layers){
    const L = layers[k];
    L.w = WORLD.w*L.s; L.h = WORLD.h*L.s;
    L.el.style.width  = L.w+'px';
    L.el.style.height = L.h+'px';
  }
  const d = ICON_R*2*S*1.02;
  halo.style.width = d+'px';
  halo.style.height = d+'px';
  goTo(idx, true);
}

function goTo(i, instant){
  idx = Math.max(0, Math.min(STORIES.length-1, i));
  const st = STORIES[idx];
  const cardH = document.getElementById('card').offsetHeight;
  const visH = Math.max(320, vh - cardH + 24);   // scene area not hidden by the card
  const fg = layers.fg;
  const camXMax = Math.max(1, fg.w - vw);
  const camYMax = Math.max(1, fg.h - visH);
  const camX = Math.max(0, Math.min(camXMax, st.x*S - vw/2));
  const camY = Math.max(0, Math.min(camYMax, st.y*S - visH*0.52));
  const fx = camX/camXMax, fy = camY/camYMax;   // journey fraction, shared by all layers
  for (const k in layers){
    const L = layers[k];
    const ox = fx * Math.max(0, L.w - vw);
    const oy = fy * Math.max(0, L.h - visH);
    if (instant) L.el.style.transition = 'none';
    L.el.style.transform = `translate3d(${-ox}px, ${-oy}px, 0)`;
    if (instant){ L.el.offsetHeight; L.el.style.transition = ''; }
  }
  // halo lives inside fg layer (scale = layers.fg.s)
  const fs = layers.fg.s;
  halo.style.left = (st.x*fs - ICON_R*fs*1.02) + 'px';
  halo.style.top  = (st.y*fs - ICON_R*fs*1.02) + 'px';
  updateCard(st, instant);
}

function updateCard(st, instant){
  const inner = document.getElementById('cardInner');
  const fill  = () => {
    document.getElementById('numChip').textContent = st.n;
    document.getElementById('storyTitle').textContent = st.t;
    document.getElementById('storyText').textContent = st.s;
    document.getElementById('refText').textContent = st.ref;
    document.getElementById('counter').textContent = st.n + ' / ' + STORIES.length;
    const [label, cls] = TAGS[st.tag];
    const te = document.getElementById('testament');
    te.textContent = label; te.className = 'testament ' + cls;
    document.getElementById('progressFill').style.width = (st.n/STORIES.length*100)+'%';
    document.getElementById('prevBtn').disabled = (idx===0);
    document.getElementById('nextBtn').disabled = (idx===STORIES.length-1);
    document.getElementById('navHint').textContent =
      idx===0 ? 'Start the journey →' : (idx===STORIES.length-1 ? 'The end — for now!' : 'Stop '+st.n+' of '+STORIES.length);
  };
  if (instant){ fill(); return; }
  inner.classList.add('swap');
  setTimeout(()=>{ fill(); inner.classList.remove('swap'); }, 340);
}

document.getElementById('prevBtn').addEventListener('click', ()=>goTo(idx-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(idx+1));
window.addEventListener('keydown', e=>{
  if (e.key==='ArrowRight') goTo(idx+1);
  if (e.key==='ArrowLeft')  goTo(idx-1);
});

/* swipe */
let tx0=null, ty0=null;
app.addEventListener('touchstart', e=>{ tx0=e.touches[0].clientX; ty0=e.touches[0].clientY; }, {passive:true});
app.addEventListener('touchend', e=>{
  if (tx0===null) return;
  const dx = e.changedTouches[0].clientX - tx0;
  const dy = e.changedTouches[0].clientY - ty0;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.4) goTo(idx + (dx<0?1:-1));
  tx0=ty0=null;
}, {passive:true});

/* tap an icon in the scene to jump to it */
document.getElementById('scene').addEventListener('click', e=>{
  const r = app.getBoundingClientRect();
  const fg = layers.fg;
  const m = new DOMMatrixReadOnly(getComputedStyle(fg.el).transform);
  const wx = (e.clientX - r.left - m.m41) / fg.s;
  const wy = (e.clientY - r.top  - m.m42) / fg.s;
  let best=-1, bd=1e9;
  STORIES.forEach((st,i)=>{
    const d=(st.x-wx)**2+(st.y-wy)**2;
    if(d<bd){bd=d;best=i;}
  });
  if (best>=0 && bd < (ICON_R*1.5)**2) goTo(best);
});

window.addEventListener('resize', layout);
layout();
</script>
</body>
</html>
