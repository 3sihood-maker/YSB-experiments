<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The locker room</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#05070b;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#dff3ff;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  /* ================= SCENE 1 — the locker-room door ================= */
  #door{position:fixed;inset:0;z-index:30;overflow:hidden;background:#05070b;cursor:pointer;
    transition:opacity .45s ease}
  #door.gone{opacity:0;pointer-events:none}
  #dbackdrop{position:absolute;inset:-8%;background-size:cover;background-position:center;
    filter:blur(38px) brightness(.42) saturate(.85);transform:scale(1.1)}
  /* The stage carries the whole scene. Its transform-origin is the camera axis — the one
     point that does not move between the wide plate and the close one — so pushing in is
     a plain scale about that point. */
  #dstage{position:absolute;left:50%;top:50%;width:1557px;height:2100px;
    margin:-1050px 0 0 -778.5px;transform-origin:54.240% 38.635%;
    will-change:transform;overflow:hidden}
  .dl{position:absolute;display:block;will-change:opacity,transform}
  #dblur,#dfocus,#dopen{left:0;top:0;width:100%;height:100%;object-fit:cover}
  #dfocus{opacity:1}
  /* The open-door plate was shot 1.712x closer. Scaled down about the same axis it lines
     up with the wide plate exactly, so the cut between them is a match cut, not a fade
     between two different framings. */
  #dopen{opacity:0;transform-origin:54.240% 38.635%;transform:scale(0.58418)}
  #dgrad{position:absolute;inset:0;background:linear-gradient(to bottom,
    rgba(0,0,0,0) 10%,rgba(0,0,0,.10) 22%,rgba(0,0,0,.30) 45%,rgba(0,0,0,.56) 72%,rgba(0,0,0,.62) 100%)}
  /* the scripture is cut into its three paragraphs so each knock can reveal one */
  #dtextbox{left:25.883%;top:44.667%;width:47.270%;height:31.667%}
  .dpar{position:absolute;left:0;width:100%;opacity:0;will-change:opacity,transform}
  #dexit{left:38.985%;top:81.667%;width:22.030%;height:11.000%;cursor:pointer;
    animation:exitGlow 3.6s ease-in-out infinite}
  /* warm light spilling out of the doorway */
  #dlight{position:absolute;left:44%;top:16%;width:34%;height:56%;opacity:0;mix-blend-mode:screen;
    background:radial-gradient(closest-side,rgba(255,238,205,.95),rgba(255,205,140,.42) 42%,transparent 74%);
    filter:blur(30px)}
  /* a soft breath of light on the door rather than a box — an inset shadow reads as a
     visible rectangle against a dark plate */
  #doorhot{position:absolute;left:41%;top:23.5%;width:27.5%;height:46.5%;cursor:pointer;opacity:0;
    background:radial-gradient(closest-side,rgba(255,244,214,.17),rgba(255,244,214,.06) 55%,rgba(255,244,214,0) 78%)}
  #doorhot.ready{animation:knockPulse 2.8s ease-in-out infinite}
  @keyframes knockPulse{0%,100%{opacity:0}55%{opacity:1}}
  @keyframes dIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  @keyframes exitGlow{0%,100%{opacity:.88;filter:brightness(1)}50%{opacity:1;filter:brightness(1.22)}}
  /* the nudge waits five seconds, then appears under the exit sign */
  #dtip{position:absolute;left:16%;width:68%;top:93.4%;text-align:center;opacity:0;
    color:#ffeecd;font-size:44px;letter-spacing:.2em;text-transform:uppercase;
    text-shadow:0 3px 22px #000,0 0 50px #000;transition:opacity 1.1s ease;pointer-events:none}
  #dtip.show{opacity:.9;animation:tipBreathe 2.8s ease-in-out infinite}
  @keyframes tipBreathe{0%,100%{opacity:.55}50%{opacity:1}}
  #dskip{position:fixed;right:16px;bottom:16px;z-index:32;opacity:0;transition:opacity .8s ease;
    color:#cfe3ff;background:rgba(8,12,20,.5);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);
    padding:9px 16px;border-radius:999px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  #dskip.show{opacity:.6}
  #dskip:hover{opacity:1}
  #whiteout{position:fixed;inset:0;z-index:33;background:#fff;opacity:0;pointer-events:none}
  /* taking the exit */
  #bye{position:fixed;inset:0;z-index:70;background:#000;opacity:0;pointer-events:none;
    display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;
    padding:32px;transition:opacity .75s ease}
  #bye.on{opacity:1;pointer-events:auto}
  #bye p{color:#e8f1ff;font-size:clamp(19px,4.4vw,27px);line-height:1.55;font-weight:300;
    letter-spacing:.01em;opacity:0;transform:translateY(10px);
    transition:opacity .9s ease .35s,transform .9s ease .35s}
  #bye.on p{opacity:1;transform:none}
  #byeback{margin-top:34px;background:none;border:0;cursor:pointer;color:#7d93ad;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;opacity:0;transition:opacity 1s ease}
  #byeback.on{opacity:.75}
  #whiteout{position:fixed;inset:0;z-index:33;background:#fff;opacity:0;pointer-events:none}
  .shakeit{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}
  #hud{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:34;
    display:flex;gap:8px}
  #hud button{width:46px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.18);
    background:rgba(10,16,28,.55);backdrop-filter:blur(10px);color:#dff3ff;font-size:19px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .18s ease,opacity .3s ease}
  #hud button:active{transform:scale(.92)}
  #hud button.off{opacity:.45}
</style>
</head>

<script>
(function(){
'use strict';
var door=document.getElementById('door'),dstage=document.getElementById('dstage'),
    dtip=document.getElementById('dtip'),dskip=document.getElementById('dskip'),
    whiteout=document.getElementById('whiteout');
var started=false;
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function shake(ms,el){el=el||door;el.classList.remove('shakeit');void el.offsetWidth;
  el.classList.add('shakeit');setTimeout(function(){el.classList.remove('shakeit');},ms||520);}

/* ---------- audio (all synthesized, no files) ---------- */
var AC=null,master=null,sfxG=null,musG=null,noiseBuf=null,soundOn=true,beatOn=false,beatTimer=null;
function audio(){
  if(AC)return AC;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=.9;
  var comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=7;
  master.connect(comp);comp.connect(AC.destination);
  sfxG=AC.createGain();sfxG.gain.value=1;sfxG.connect(master);
  musG=AC.createGain();musG.gain.value=0;musG.connect(master);
  var n=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
  var d=noiseBuf.getChannelData(0),last=0;
  for(var i=0;i<n;i++){var wn=Math.random()*2-1;last=(last+.02*wn)/1.02;d[i]=(wn*.75+last*1.4)*.5;}
  return AC;
}
function noise(dur,gain,f0,f1,q,dest){
  var s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  var bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=q||1.2;
  var t=AC.currentTime;bp.frequency.setValueAtTime(f0,t);bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
  var g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+dur*.18);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(bp);bp.connect(g);g.connect(dest||sfxG);s.start(t);s.stop(t+dur+.05);
}
function tone(type,f0,f1,dur,gain,dest,detune){
  var o=AC.createOscillator();o.type=type;var t=AC.currentTime;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  if(detune)o.detune.value=detune;
  var g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+.05);
}
var S={
  whoosh:function(){if(!ok())return;noise(.55,.3,300,4200,1.1);noise(.5,.16,2600,240,.9);},
  riser:function(){if(!ok())return;tone('sawtooth',120,1500,.85,.09);noise(.85,.12,400,5200,1.6);},
  impact:function(){if(!ok())return;tone('sine',180,38,.5,.62);tone('triangle',90,30,.6,.35);noise(.28,.4,1400,180,.7);},
  pop:function(){if(!ok())return;tone('triangle',520,180,.14,.22);noise(.12,.16,2400,700,1.4);},
  paper:function(){if(!ok())return;noise(.2,.2,1800,5200,.8);},
  bounce:function(){if(!ok())return;tone('sine',420,120,.16,.34);noise(.07,.12,900,300,1);},
  dribble:function(){if(!ok())return;tone('sine',300,90,.2,.3);noise(.09,.1,700,200,1);},
  whistle:function(){if(!ok())return;
    var t=AC.currentTime;for(var k=0;k<2;k++){var o=AC.createOscillator();o.type='sine';
      o.frequency.setValueAtTime(1900+k*38,t);
      var lfo=AC.createOscillator();lfo.frequency.value=26;var la=AC.createGain();la.gain.value=120;
      lfo.connect(la);la.connect(o.frequency);lfo.start(t);lfo.stop(t+.5);
      var g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.03);
      g.gain.setValueAtTime(.1,t+.34);g.gain.exponentialRampToValueAtTime(.0001,t+.48);
      o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+.5);}
    noise(.45,.05,2000,2600,6);},
  cheer:function(){if(!ok())return;
    var s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=.7;
    var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=600;
    var g=AC.createGain();var t=AC.currentTime;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.20,t+.5);
    g.gain.setValueAtTime(.20,t+1.5);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);
    var lfo=AC.createOscillator();lfo.frequency.value=5.5;var la=AC.createGain();la.gain.value=.05;
    lfo.connect(la);la.connect(g.gain);lfo.start(t);lfo.stop(t+3.3);
    s.connect(hp);hp.connect(bp);bp.connect(g);g.connect(sfxG);s.start(t);s.stop(t+3.3);},
  sparkle:function(){if(!ok())return;tone('sine',2400,4200,.18,.06);tone('sine',3200,5200,.14,.04);},
  kick:function(){if(!ok())return;                       /* boot-to-ball thump + air */
    tone('sine',240,60,.22,.5);noise(.13,.34,900,240,.9);noise(.5,.22,500,4600,1.1);},
  knock:function(){if(!ok())return;                      /* three raps on heavy steel */
    [0,170,340].forEach(function(d){setTimeout(function(){if(!ok())return;
      tone('triangle',190,70,.13,.42);tone('sine',95,52,.18,.3);noise(.09,.3,1600,420,1.5);},d);});},
  latch:function(){if(!ok())return;                      /* handle click + heavy swing */
    tone('square',1400,700,.05,.06);noise(.06,.22,3200,1200,3);
    setTimeout(function(){if(!ok())return;
      tone('sawtooth',70,44,.85,.16);noise(.9,.14,240,900,1.3);},120);},
  rumble:function(){if(!ok())return;                     /* the tunnel pulling you in */
    tone('sine',36,96,2.0,.42);tone('triangle',54,140,1.9,.14);noise(2.0,.16,180,2600,.8);}
};
function ok(){return AC&&soundOn;}

/* simple energetic groove, fully synthesized */
function beat(){
  if(!AC)return;var step=0,spb=60/104/2;
  function tick(){
    if(!beatOn)return;
    var s=step%16;
    if(s%4===0){tone('sine',150,45,.22,.55,musG);}                 // kick
    if(s===4||s===12){noise(.13,.28,3000,900,1.1,musG);}           // snare/clap
    if(s%2===1){noise(.045,.09,7000,9000,2.4,musG);}               // hat
    if(s===0||s===6||s===10){tone('square',s===0?220:294,s===0?220:294,.16,.045,musG);}
    if(s===14){tone('square',392,392,.2,.05,musG);}
    step++;beatTimer=setTimeout(tick,spb*1000);
  }
  tick();
}


/* ---------- the plate, fitted to the screen ---------- */
/* scene 1 fits the tall portrait frame: full-bleed when the aspects are close,
   otherwise letterboxed onto a blurred copy of itself so nothing gets cropped away */
var DW=1557,DH=2100,dScale=1,T0x=0,T0y=0;
/* The camera axis is off the middle of the plate, so scaling about it would drag the
   frame off centre. This offset puts the plate back in the middle at rest, and then stays
   fixed while the camera pushes in — which is what keeps the axis pinned. */
var OX=0.54240*DW, OY=0.38635*DH, CX=DW/2, CY=DH/2;
function fitDoor(){
  var w=innerWidth,h=innerHeight,
      cover=Math.max(w/DW,h/DH),contain=Math.min(w/DW,h/DH);
  /* the plate is wide enough that a portrait screen can fill edge to edge and still keep
     the door, the words and the exit sign; only a landscape screen has to letterbox */
  dScale=(cover/contain<=1.85)?cover:contain;
  T0x=(CX-OX)*(1-dScale); T0y=(CY-OY)*(1-dScale);
  if(!started&&typeof setCam==='function')setCam(1);
}
addEventListener('resize',fitDoor);

/* ---------- scene 1: the locker room. Knock three times, a paragraph each ---------- */
var dfocus=document.getElementById('dfocus'),dopen=document.getElementById('dopen'),
    dexit=document.getElementById('dexit'),dlight=document.getElementById('dlight'),
    doorhot=document.getElementById('doorhot'),dtextbox=document.getElementById('dtextbox'),
    pars=[document.getElementById('dp1'),document.getElementById('dp2'),document.getElementById('dp3')];
document.getElementById('dbackdrop').style.backgroundImage=
  'url('+document.getElementById('dblur').getAttribute('src')+')';

/* the wide plate at this scale frames exactly what the close plate frames at 1:1 */
var MATCH=1.71180;
var knocks=0,idleT=null,leaving=false;

function tf(z){ return 'translate('+T0x.toFixed(2)+'px,'+T0y.toFixed(2)+'px) scale('+(dScale*z).toFixed(5)+')'; }
function setCam(z){ dstage.style.transform=tf(z); }
/* a slow breath so the room is never quite still */
var drift=null;
function startDrift(){
  if(reduce)return;
  drift=dstage.animate([{transform:tf(1)},{transform:tf(1.045)}],
    {duration:26000,easing:'ease-in-out',direction:'alternate',iterations:Infinity});
}

function armIdle(){
  clearTimeout(idleT);
  idleT=setTimeout(function(){
    if(!started&&knocks<3)dtip.classList.add('show');
  },5000);
}

function knock(){
  if(started||leaving)return;
  audio();AC.resume&&AC.resume();
  S.knock();
  dtip.classList.remove('show');
  if(knocks>=3)return;
  var p=pars[knocks++];
  if(reduce){ p.style.opacity=1; }
  else{
    p.style.animation='dIn 1.15s cubic-bezier(.2,.8,.3,1) both';
    /* the room takes the knock */
    if(drift)drift.pause();
    dstage.animate([{transform:tf(1)},{transform:tf(1.008),offset:.35},{transform:tf(1)}],
                   {duration:420,easing:'ease-out'}).onfinish=function(){if(drift)drift.play();};
  }
  if(knocks===1&&!reduce)setTimeout(function(){if(!started)dskip.classList.add('show');},1400);
  if(knocks===3){ clearTimeout(idleT); setTimeout(goThroughDoor,reduce?400:1250); }
  else armIdle();
}

function openScene(){
  setCam(1);
  /* the room, the door and the exit sign are there from the first frame — nothing to
     fade up. Only the words wait to be knocked for. */
  if(reduce){ doorhot.classList.add('ready'); armIdle(); return; }
  var cue=function(ms,fn){setTimeout(function(){if(!started)fn();},ms);};
  cue(700,function(){doorhot.classList.add('ready');});
  cue(800,startDrift);
  armIdle();
}

function hidePrompts(){
  [dtip,dskip].forEach(function(e){
    e.classList.remove('show');
    setTimeout(function(){e.style.display='none';},900);
  });
}

function goThroughDoor(){
  if(started||leaving)return;started=true;
  clearTimeout(idleT);
  audio();AC.resume&&AC.resume();
  doorhot.classList.remove('ready');
  if(drift){drift.cancel();drift=null;}
  hidePrompts();
  var fast=reduce;
  var t=function(ms,fn){setTimeout(fn,fast?Math.min(ms,110):ms);};

  /* the words and the exit sign let go */
  t(0,function(){
    [dtextbox,dexit].forEach(function(e){
      e.style.animation='';e.style.transition='opacity .9s ease';e.style.opacity=0;});
  });

  /* walk to the door: the wide plate pushes in until it frames what the close plate frames */
  t(420,function(){
    if(fast){setCam(MATCH);return;}
    S.rumble();
    dstage.animate([{transform:tf(1)},{transform:tf(MATCH)}],
      {duration:1500,easing:'cubic-bezier(.36,0,.5,1)',fill:'forwards'});
  });

  /* the match cut: same framing, door now open */
  t(2020,function(){
    S.latch();shake(300,door);
    dopen.style.transition='opacity .55s ease';dopen.style.opacity=1;
    dlight.style.transition='opacity 1.5s ease';dlight.style.opacity=.8;
  });

  /* and through it */
  t(2560,function(){
    S.cheer();
    if(fast){return;}
    dstage.animate([{transform:tf(MATCH),filter:'blur(0px)'},
                    {transform:tf(MATCH*2.1),filter:'blur(1px)',offset:.45},
                    {transform:tf(MATCH*7),filter:'blur(7px)'}],
      {duration:1750,easing:'cubic-bezier(.55,0,.85,.55)',fill:'forwards'});
    dlight.animate([{opacity:.8},{opacity:1}],{duration:1750,fill:'forwards'});
  });

  /* blow out to light, then we are inside the title */
  t(3950,function(){
    whiteout.animate([{opacity:0},{opacity:1}],{duration:fast?120:340,fill:'forwards',easing:'ease-in'});
  });
  /* Nothing waits on the other side here — the light peaks, then the room is set back
     the way it started so the whole thing can be shown again. */
  t(4340,function(){
    resetScene();
    whiteout.animate([{opacity:1},{opacity:0}],{duration:fast?120:720,fill:'forwards',easing:'ease-out'});
  });
}

/* put the room back to its opening state */
function resetScene(){
  started=false; leaving=false; knocks=0;
  clearTimeout(idleT);
  if(drift){drift.cancel();drift=null;}
  dstage.getAnimations().forEach(function(a){try{a.cancel();}catch(e){}});
  pars.forEach(function(p){p.style.animation='';p.style.opacity='';});
  dtextbox.style.transition=''; dtextbox.style.opacity='';
  dexit.style.transition=''; dexit.style.opacity=''; dexit.style.animation='';
  dopen.style.transition=''; dopen.style.opacity='';
  dlight.style.transition=''; dlight.style.opacity='';
  [dtip,dskip].forEach(function(e){e.style.display='';e.classList.remove('show');});
  bye.classList.remove('on'); byeback.classList.remove('on');
  setCam(1);
  openScene();
}

/* ---------- taking the exit ---------- */
var bye=document.getElementById('bye'),byeback=document.getElementById('byeback');
function leave(){
  if(leaving||started)return;leaving=true;
  clearTimeout(idleT);
  audio();AC.resume&&AC.resume();
  try{S.latch();}catch(e){}
  bye.classList.add('on');
  setTimeout(function(){
    window.close();
    /* a tab the browser will not let a script close just stays on the card */
    setTimeout(function(){byeback.classList.add('on');},900);
  },1700);
}
byeback.onclick=function(){location.reload();};
dexit.addEventListener('click',function(e){e.stopPropagation();leave();});

doorhot.addEventListener('click',function(e){e.stopPropagation();knock();});
door.addEventListener('click',function(){knock();});
dskip.addEventListener('click',function(e){
  e.stopPropagation();
  if(started||leaving)return;started=true;
  clearTimeout(idleT);
  audio();AC.resume&&AC.resume();
  door.classList.add('gone');hidePrompts();
  motes(reduce?0:54);play();
  setTimeout(function(){door.style.display='none';},600);
});


/* ---------- taking the exit ---------- */
var bye=document.getElementById('bye'),byeback=document.getElementById('byeback');
function leave(){
  if(leaving||started)return;leaving=true;
  clearTimeout(idleT);
  audio();AC.resume&&AC.resume();
  try{S.latch();}catch(e){}
  bye.classList.add('on');
  setTimeout(function(){
    window.close();
    /* a tab the browser will not let a script close just stays on the card */
    setTimeout(function(){byeback.classList.add('on');},900);
  },1700);
}
byeback.onclick=function(){resetScene();};
dexit.addEventListener('click',function(e){e.stopPropagation();leave();});


doorhot.addEventListener('click',function(e){e.stopPropagation();knock();});
door.addEventListener('click',function(){knock();});
dskip.addEventListener('click',function(e){
  e.stopPropagation();
  if(started||leaving)return;
  /* skip means show me the rest and get on with it */
  audio();AC.resume&&AC.resume();
  pars.forEach(function(p){p.style.animation='';p.style.opacity=1;});
  knocks=3; clearTimeout(idleT);
  setTimeout(goThroughDoor,reduce?60:420);
});

document.getElementById('bSound').onclick=function(e){
  e.stopPropagation(); audio(); soundOn=!soundOn;
  this.classList.toggle('off',!soundOn); this.innerHTML=soundOn?'&#128266;':'&#128263;';
  if(master)master.gain.setTargetAtTime(soundOn?.9:0,AC.currentTime,.05);
};
document.getElementById('bReplay').onclick=function(e){e.stopPropagation();resetScene();};
addEventListener('keydown',function(e){if(e.key==='r'||e.key==='R')resetScene();});

fitDoor();
openScene();
})();
</script>
