<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Out of Egypt — The Exodus Journey</title>
<style>
  :root{
    --ink:#f6efe0;
    --gold:#e8b64c;
    --sand-far:#7a4d3f;
    --sand-mid:#5c3a38;
    --sand-near:#341f2c;
    --sea:#1e4d6b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:Georgia,'Iowan Old Style','Times New Roman',serif;
    background:#20154a;color:var(--ink);
  }
  .scroll-space{height:700vh}

  /* ---------- fixed stage ---------- */
  .stage{position:fixed;inset:0;overflow:hidden}

  /* sky */
  .sky{position:absolute;inset:0;
    background:linear-gradient(#3d2b6e 0%, #7a4a7a 45%, #d98a5f 78%, #f2b96a 100%);}
  .sun{position:absolute;top:16%;right:20%;width:90px;height:90px;border-radius:50%;
    background:#ffe9b0;box-shadow:0 0 80px 40px rgba(255,220,150,.45);}
  .night{position:absolute;inset:0;opacity:0;
    background:linear-gradient(#0b0926 0%, #1c1546 55%, #3a2358 100%);}
  .moon{position:absolute;top:12%;right:24%;width:64px;height:64px;border-radius:50%;
    background:#f3ecd8;box-shadow:0 0 60px 24px rgba(240,235,215,.35);}
  .stars{position:absolute;inset:0}
  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
  .dawn{position:absolute;inset:0;opacity:0;
    background:linear-gradient(#5a3f7a 0%, #c46a6a 40%, #f5b26a 70%, #ffd98f 100%);}

  /* parallax strips */
  .strip{position:absolute;bottom:0;height:100%;will-change:transform}
  .strip svg{display:block;width:100%;height:100%}
  .strip-far{width:220vw}
  .strip-mid{width:350vw}
  .strip-near{width:600vw}

  /* the travellers */
  .people{position:absolute;bottom:4vh;left:14vw;width:min(300px,34vw);z-index:6;
    will-change:transform;
    animation:walk 1.6s ease-in-out infinite;}
  @keyframes walk{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-6px)}
  }
  .people svg{width:100%;display:block}

  /* pillar of cloud / fire */
  .pillar{position:absolute;bottom:8vh;left:38vw;width:70px;height:62vh;z-index:5;
    opacity:0;will-change:opacity;pointer-events:none;}
  .pillar .cloud,.pillar .fire{position:absolute;inset:0;border-radius:40px;filter:blur(6px)}
  .pillar .cloud{
    background:linear-gradient(to top, rgba(246,239,224,.05), rgba(246,239,224,.85) 30%, rgba(246,239,224,.95));
    animation:sway 5s ease-in-out infinite;}
  .pillar .fire{opacity:0;
    background:linear-gradient(to top, rgba(255,120,40,.9), rgba(255,190,80,.95) 45%, rgba(255,240,180,.9));
    box-shadow:0 0 90px 30px rgba(255,150,60,.35);
    animation:sway 2.4s ease-in-out infinite;}
  @keyframes sway{
    0%,100%{transform:scaleX(1) translateX(0)}
    50%{transform:scaleX(1.12) translateX(4px)}
  }

  /* ---------- header ---------- */
  .header{position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;justify-content:center;padding:26px 5vw;pointer-events:none;}
  .left-wrap{overflow:hidden}
  .header-text{font-size:19px;letter-spacing:.06em}
  .header-text .ch{display:inline-block;transform:translateY(120%) rotate(6deg);opacity:0;
    transition:transform .7s cubic-bezier(.19,1,.22,1),opacity .7s;}
  .is-loaded .header-text .ch{transform:none;opacity:1}

  /* ---------- verse card ---------- */
  .verse-card{position:fixed;top:88px;left:50%;transform:translateX(-50%) translateY(-8px);
    z-index:9;width:min(660px,88vw);text-align:center;
    background:rgba(16,10,38,.55);backdrop-filter:blur(6px);
    border:1px solid rgba(232,182,76,.35);border-radius:14px;
    padding:22px 28px 18px;opacity:0;
    transition:opacity .6s,transform .6s;pointer-events:none;}
  .verse-card.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .verse-text{font-size:clamp(17px,2.6vw,23px);line-height:1.45;font-style:italic}
  .verse-ref{margin-top:10px;font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);}

  /* ---------- title / hint ---------- */
  .title-block{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;pointer-events:none;
    transition:opacity .5s;}
  .subtitle{display:flex;align-items:center;gap:16px;color:var(--gold);
    font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;
    letter-spacing:.34em;text-transform:uppercase;
    opacity:0;transition:opacity 1s .8s;}
  .is-loaded .subtitle{opacity:1}
  .arrow{width:44px;height:1px;background:currentColor;position:relative}
  .arrow::after{content:"";position:absolute;top:-3px;width:8px;height:8px;border-top:1px solid currentColor}
  .arrow-l::after{left:0;border-left:1px solid currentColor;transform:rotate(-45deg)}
  .arrow-r::after{right:0;border-right:1px solid currentColor;transform:rotate(45deg)}
  .title{margin-top:16px;font-weight:400;font-size:clamp(42px,9vw,104px);line-height:1.04;
    text-shadow:0 4px 30px rgba(20,10,40,.5);}
  .title .line{display:block;overflow:hidden}
  .title .line span{display:block;transform:translateY(110%);
    transition:transform 1.1s cubic-bezier(.19,1,.22,1);}
  .is-loaded .title .line:nth-child(1) span{transform:none;transition-delay:.3s}
  .is-loaded .title .line:nth-child(2) span{transform:none;transition-delay:.45s}
  .title em{font-style:italic;color:var(--gold)}
  .hint{margin-top:30px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;
    letter-spacing:.22em;text-transform:uppercase;color:rgba(246,239,224,.6);
    opacity:0;transition:opacity 1s 1.3s;animation:hintPulse 2.2s ease-in-out 2s infinite;}
  .is-loaded .hint{opacity:1}
  @keyframes hintPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

  .credit{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:9;
    font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(246,239,224,.4);pointer-events:none;}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    .header-text .ch,.title .line span,.subtitle,.hint{transform:none!important;opacity:1!important}
  }
</style>
</head>
<body>

<div class="scroll-space"></div>

<div class="stage js-stage">
  <div class="sky"><div class="sun"></div></div>
  <div class="night js-night"><div class="moon"></div><div class="stars js-stars"></div></div>
  <div class="dawn js-dawn"></div>

  <!-- FAR: pyramids · sea horizon · Sinai · distant green hills -->
  <div class="strip strip-far js-far">
    <svg viewBox="0 0 3520 900" preserveAspectRatio="none" aria-hidden="true">
      <g fill="#7a4d3f" opacity=".85">
        <path d="M120 720 L320 480 L520 720 Z"/>
        <path d="M420 720 L580 560 L740 720 Z"/>
        <path d="M660 720 L900 420 L1140 720 Z"/>
      </g>
      <rect x="1150" y="640" width="900" height="80" fill="#2c5a78" opacity=".7"/>
      <path d="M2050 720 L2450 260 L2850 720 Z" fill="#6b4258" opacity=".9"/>
      <path d="M2350 720 L2620 430 L2900 720 Z" fill="#7a4d5f" opacity=".7"/>
      <g fill="#4f7a54" opacity=".8">
        <path d="M2950 720 Q3100 600 3250 700 Q3400 620 3520 690 L3520 720 Z"/>
      </g>
      <rect x="0" y="715" width="3520" height="185" fill="#6b4441"/>
    </svg>
  </div>

  <!-- MID: city of Egypt · walls of the sea · dunes · foothills · Jordan & fields -->
  <div class="strip strip-mid js-mid">
    <svg viewBox="0 0 5600 900" preserveAspectRatio="none" aria-hidden="true">
      <g fill="#5c3a38">
        <!-- Egypt: gate, obelisk, blocks -->
        <rect x="140" y="560" width="70" height="220"/>
        <rect x="240" y="500" width="40" height="280"/>
        <path d="M240 500 L260 440 L280 500 Z"/>
        <rect x="330" y="590" width="180" height="190"/>
        <path d="M330 590 L420 520 L510 590 Z"/>
        <rect x="398" y="660" width="44" height="120" fill="#341f2c"/>
        <!-- dunes across the desert -->
        <path d="M900 780 Q1200 690 1500 770 Q1850 700 2200 780 Q2600 700 3000 775 Q3400 705 3800 780 L3800 900 L900 900 Z"/>
        <!-- Sinai foothills -->
        <path d="M3800 780 L4050 560 L4260 780 Z"/>
        <path d="M4180 780 L4420 600 L4640 780 Z"/>
      </g>
      <!-- Red Sea walls with dry path between -->
      <g>
        <path d="M1500 780 L1500 360 Q1560 330 1620 360 Q1680 330 1740 360 L1740 780 Z" fill="#1e4d6b"/>
        <path d="M1990 780 L1990 360 Q2050 330 2110 360 Q2170 330 2230 360 L2230 780 Z" fill="#1e4d6b"/>
        <path d="M1500 380 Q1620 340 1740 380" stroke="#7fd0e8" stroke-width="10" fill="none" opacity=".7"/>
        <path d="M1990 380 Q2110 340 2230 380" stroke="#7fd0e8" stroke-width="10" fill="none" opacity=".7"/>
        <rect x="1740" y="740" width="250" height="40" fill="#8a6a4f"/>
      </g>
      <!-- Jordan river and green fields -->
      <g>
        <path d="M4900 780 Q4950 700 4920 620 Q4960 560 4940 500 L5000 500 Q5010 580 4980 650 Q5000 720 4960 780 Z" fill="#2c6a8a"/>
        <path d="M5000 780 Q5150 690 5300 760 Q5450 680 5600 750 L5600 900 L5000 900 Z" fill="#3f7a4a"/>
        <ellipse cx="5250" cy="700" rx="60" ry="40" fill="#3f7a4a"/>
        <rect x="5242" y="700" width="14" height="70" fill="#5c3a38"/>
      </g>
      <rect x="0" y="770" width="5600" height="130" fill="#4a2e33"/>
    </svg>
  </div>

  <!-- NEAR: the path itself, reeds, rocks, palms -->
  <div class="strip strip-near js-near">
    <svg viewBox="0 0 9600 900" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 830 Q1200 800 2400 828 Q3600 856 4800 826 Q6000 800 7200 830 Q8400 856 9600 824 L9600 900 L0 900 Z" fill="#341f2c"/>
      <g fill="#341f2c">
        <!-- Egypt gate posts -->
        <rect x="300" y="560" width="46" height="280"/>
        <rect x="520" y="560" width="46" height="280"/>
        <rect x="270" y="520" width="330" height="52"/>
        <!-- reeds by the sea -->
        <g stroke="#341f2c" stroke-width="10" fill="none">
          <path d="M2900 840 Q2890 740 2910 680"/>
          <path d="M2950 845 Q2960 730 2940 670"/>
          <path d="M3010 840 Q3000 750 3025 690"/>
        </g>
        <!-- desert rocks -->
        <ellipse cx="4600" cy="830" rx="90" ry="34"/>
        <ellipse cx="4750" cy="845" rx="50" ry="22"/>
        <ellipse cx="6100" cy="835" rx="70" ry="28"/>
        <!-- palms at the promised land -->
        <g>
          <path d="M8880 840 Q8895 690 8870 600" stroke="#341f2c" stroke-width="16" fill="none"/>
          <path d="M8870 600 Q8790 560 8720 580 M8870 600 Q8950 550 9020 575 M8870 600 Q8850 520 8880 470 M8870 600 Q8930 540 8990 520 M8870 600 Q8800 530 8750 510" stroke="#341f2c" stroke-width="10" fill="none"/>
          <path d="M9250 845 Q9260 720 9245 650" stroke="#341f2c" stroke-width="13" fill="none"/>
          <path d="M9245 650 Q9180 615 9120 630 M9245 650 Q9310 605 9370 625 M9245 650 Q9235 580 9260 540" stroke="#341f2c" stroke-width="9" fill="none"/>
        </g>
      </g>
    </svg>
  </div>

  <!-- pillar of cloud / fire -->
  <div class="pillar js-pillar">
    <div class="cloud"></div>
    <div class="fire js-fire"></div>
  </div>

  <!-- the people of Israel -->
  <div class="people" aria-hidden="true">
    <svg viewBox="0 0 300 120">
      <g fill="#1c1030">
        <!-- Moses with staff -->
        <circle cx="262" cy="34" r="11"/>
        <path d="M248 118 L252 60 Q262 46 274 60 L278 118 Z"/>
        <rect x="284" y="18" width="4" height="100" rx="2"/>
        <path d="M284 18 Q292 10 296 20 Q290 26 284 24 Z"/>
        <!-- followers -->
        <circle cx="210" cy="42" r="10"/>
        <path d="M198 118 L202 66 Q210 54 220 66 L224 118 Z"/>
        <circle cx="170" cy="46" r="9"/>
        <path d="M159 118 L163 70 Q170 60 179 70 L182 118 Z"/>
        <circle cx="136" cy="44" r="9"/>
        <path d="M125 118 L129 68 Q136 58 145 68 L148 118 Z"/>
        <!-- child -->
        <circle cx="106" cy="66" r="7"/>
        <path d="M98 118 L101 82 Q106 74 113 82 L115 118 Z"/>
        <circle cx="70" cy="46" r="9"/>
        <path d="M59 118 L63 70 Q70 60 79 70 L82 118 Z"/>
        <!-- bundle carrier -->
        <circle cx="34" cy="50" r="9"/>
        <path d="M23 118 L27 74 Q34 64 43 74 L46 118 Z"/>
        <ellipse cx="34" cy="34" rx="14" ry="8"/>
      </g>
    </svg>
  </div>

  <!-- verse card -->
  <div class="verse-card js-verse-card" role="status">
    <div class="verse-text js-verse-text"></div>
    <div class="verse-ref js-verse-ref"></div>
  </div>

  <!-- title -->
  <div class="title-block js-title">
    <div class="subtitle">
      <span class="arrow arrow-l"></span>The Book of Exodus<span class="arrow arrow-r"></span>
    </div>
    <h1 class="title">
      <span class="line"><span>Out of Egypt,</span></span>
      <span class="line"><span>toward the <em>Promised Land</em></span></span>
    </h1>
    <div class="hint">Scroll to walk with them &darr;</div>
  </div>
</div>

<header class="header">
  <div class="left-wrap"><span class="header-text js-header-text">The Exodus.</span></div>
</header>

<div class="credit">Scripture: World English Bible</div>

<script>
(function(){
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* header letters */
  var ht = document.querySelector('.js-header-text');
  var txt = ht.textContent.trim();
  ht.textContent = '';
  txt.split('').forEach(function(c,i){
    var s=document.createElement('span');s.className='ch';
    s.style.transitionDelay=(0.03*i)+'s';
    s.innerHTML=c===' '?'&nbsp;':c;ht.appendChild(s);
  });

  /* stars */
  var stars=document.querySelector('.js-stars');
  for(var i=0;i<60;i++){
    var st=document.createElement('i');
    st.style.left=(Math.random()*100)+'%';
    st.style.top=(Math.random()*60)+'%';
    st.style.opacity=(0.3+Math.random()*0.7);
    stars.appendChild(st);
  }

  requestAnimationFrame(function(){requestAnimationFrame(function(){
    document.body.classList.add('is-loaded');
  });});

  /* ---------- journey stations ---------- */
  var verses=[
    {at:0.14, text:'“I have come down to deliver them out of the hand of the Egyptians.”', ref:'Exodus 3 : 8'},
    {at:0.32, text:'“The LORD will fight for you, and you shall be still.”', ref:'Exodus 14 : 14'},
    {at:0.50, text:'“The LORD went before them by day in a pillar of cloud, to lead them.”', ref:'Exodus 13 : 21'},
    {at:0.68, text:'“…and by night in a pillar of fire, to give them light.”', ref:'Exodus 13 : 21'},
    {at:0.86, text:'“…a good and large land, a land flowing with milk and honey.”', ref:'Exodus 3 : 8'}
  ];

  var far=document.querySelector('.js-far'),
      mid=document.querySelector('.js-mid'),
      near=document.querySelector('.js-near'),
      night=document.querySelector('.js-night'),
      dawn=document.querySelector('.js-dawn'),
      pillar=document.querySelector('.js-pillar'),
      fire=document.querySelector('.js-fire'),
      titleBlock=document.querySelector('.js-title'),
      card=document.querySelector('.js-verse-card'),
      vText=document.querySelector('.js-verse-text'),
      vRef=document.querySelector('.js-verse-ref');

  var p=0, target=0, mouseX=0, mouseY=0, mx=0, my=0, currentVerse=-1;

  function onScroll(){
    var max=document.documentElement.scrollHeight - window.innerHeight;
    target = max>0 ? window.scrollY/max : 0;
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('mousemove', function(e){
    mouseX=(e.clientX/window.innerWidth)*2-1;
    mouseY=(e.clientY/window.innerHeight)*2-1;
  });
  onScroll();

  function clamp01(v){return Math.max(0,Math.min(1,v));}
  /* rises 0→1 over [a,b], falls 1→0 over [c,d] */
  function window01(v,a,b,c,d){
    return clamp01((v-a)/(b-a)) * (1-clamp01((v-c)/(d-c)));
  }

  function setVerse(idx){
    if(idx===currentVerse) return;
    currentVerse=idx;
    if(idx<0){card.classList.remove('show');return;}
    card.classList.remove('show');
    setTimeout(function(){
      vText.textContent=verses[idx].text;
      vRef.textContent=verses[idx].ref;
      card.classList.add('show');
    }, currentVerse===-1?0:250);
  }

  function tick(){
    p += (target-p)*(reduced?1:0.08);
    mx += (mouseX-mx)*0.06;
    my += (mouseY-my)*0.06;

    var vw=window.innerWidth;
    var parX=reduced?0:mx, parY=reduced?0:my;

    far.style.transform ='translate3d('+(-(2.2*vw-vw)*p - parX*10)+'px,'+(-parY*6)+'px,0)';
    mid.style.transform ='translate3d('+(-(3.5*vw-vw)*p - parX*22)+'px,'+(-parY*12)+'px,0)';
    near.style.transform='translate3d('+(-(6.0*vw-vw)*p - parX*40)+'px,'+(-parY*20)+'px,0)';

    /* day → night → dawn */
    night.style.opacity = window01(p, .52,.62, .74,.86);
    dawn.style.opacity  = clamp01((p-.80)/.14);

    /* pillar appears after the sea; cloud by day, fire by night */
    var vis = window01(p, .30,.40, .92,1.0);
    pillar.style.opacity = vis;
    fire.style.opacity = night.style.opacity;

    /* title fades as the journey begins */
    titleBlock.style.opacity = 1-clamp01(p/0.08);

    /* which verse? */
    var idx=-1;
    for(var i=verses.length-1;i>=0;i--){
      if(p >= verses[i].at-0.06){idx=i;break;}
    }
    if(p<0.07) idx=-1;
    setVerse(idx);

    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
