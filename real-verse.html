  if(phase!=='pick'||s.state!=='flat')return;
  if(s.item.real){
    phase='reveal';resetView();s.state='hero';hero.t=0;hero.dir=1;hero.from.copy(s.pos);hero.fromQ.copy(s.quat);
    heroScene.add(s.mesh);blurTarget=1;sign.classList.add('fade');chime();whoosh();
    if(s.srBtn)s.srBtn.remove();
    const it=s.item;
    setTimeout(()=>showPanel(`<p class="kicker right">Yes! This one is in the Bible.</p><h2>${esc(it.ref)}</h2>${it.heading?`<h3>${esc(it.heading)}</h3>`:''}<p class="body">${esc(it.expl)}</p><button type="button">Clear the desk</button>`,clearDesk),650);
  }else{
    phase='wrong';resetView();s.ensureBaked();s.state='crumpling';if(s.srBtn)s.srBtn.remove();
    const it=s.item;
    setTimeout(()=>showPanel(`<p class="kicker wrong">${it.kind==='misquote'?'Close, but misquoted':'Not in the Bible'}</p><blockquote>\u201c${esc(it.text)}\u201d</blockquote><p class="body">${esc(it.expl)}</p><button type="button">Try again</button>`,
      ()=>{hidePanel();phase='pick'}),520);
  }
}
function clearDesk(){
  hidePanel();hero.t=0;hero.dir=-1;hero.from.copy(realSheet.pos);hero.fromQ.copy(realSheet.quat);blurTarget=0;whoosh();phase='returning';
}
function beginCleanup(){
  phase='cleanup';$('signTitle').textContent='Flick the paper into the bin!';$('signSub').textContent=`Round ${round+1} of ${ROUNDS.length}`;
  sign.classList.remove('fade');$('srList').innerHTML='';
  let delay=0;sheets.forEach(s=>{if(s.state==='flat'&&!s.item.real){s.ensureBaked();s.autoDelay=delay;delay+=.22;s.state='crumpling';}});
  updateCount();setTimeout(()=>hud.classList.add('show'),300);
}
function updateCount(){$('count').textContent=`${binned} / ${ROUNDS[round].fakes.length}`;}
function roundDone(){
  hud.classList.remove('show');phase='done';
  const last=round===ROUNDS.length-1;
  showPanel(last?`<h2>That's every round!</h2><p class="body">The desk is clear. Thanks for playing.</p><button type="button">Play again</button>`
    :`<h2>Desk cleared!</h2><p class="body">Ready for five more?</p><button type="button">Next round</button>`,()=>{startRound(last?0:round+1);});
}
let skipMode=false;
$('skipBtn').onclick=()=>{ensureAudio();skipMode=true;let d=0;sheets.forEach(s=>{if(s.state==='ball'&&!s.inBin){s.autoToss=d;d+=.3;}});};
$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'\u{1F50A}':'\u{1F507}';$('soundBtn').setAttribute('aria-pressed',soundOn);};

// ---------- pointer: tap to pick, drag to flick, pinch to zoom ----------
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),hit=new THREE.Vector3(),deskPlane=new THREE.Plane(new THREE.Vector3(0,1,0),-.01);
let grabbed=null,dragPlane=new THREE.Plane(),dragTarget=new THREE.Vector3(),hist=[];
const ptrs=new Map();let pinch=null,tap=null;
function setRay(e){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);}
function sheetUnderRay(){
  if(!ray.ray.intersectPlane(deskPlane,hit))return null;
  let top=null;
  for(const s of sheets){if(s.state!=='flat'||s.drop<1)continue;const dx=hit.x-s.pos.x,dz=hit.z-s.pos.z,c=Math.cos(s.home.rot),sn=Math.sin(s.home.rot);
    const lx=dx*c-dz*sn,lz=dx*sn+dz*c;
    if(Math.abs(lx)<s.PW/2&&Math.abs(lz)<s.PH/2&&(!top||s.baseY>top.baseY))top=s;}
  return top;
}
function ballUnderRay(){let best=null,bd=1e9;
  for(const s of sheets){if(s.state!=='ball'||s.inBin)continue;if(ray.ray.intersectSphere(new THREE.Sphere(s.pos,s.R*1.7),hit)){const d=hit.distanceTo(ray.ray.origin);if(d<bd){bd=d;best=s;}}}return best;}
function twoPointers(){const it=ptrs.values();return [it.next().value,it.next().value];}
function startPinch(){
  const [a,b]=twoPointers();if(!a||!b)return;
  pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,zoom:CAM.zoom,pan:CAM.pan.clone()};
}
function updatePinch(){
  const [a,b]=twoPointers();if(!a||!b||!pinch)return;
  const d=Math.hypot(a.x-b.x,a.y-b.y)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  CAM.zoom=CAM.zoomT=clamp(pinch.zoom*(d/pinch.d),1,MAX_ZOOM);
  const wpp=worldPerPixel();
  CAM.pan.set(pinch.pan.x-(mx-pinch.mx)*wpp,pinch.pan.y-(my-pinch.my)*wpp/Math.sin(CAM.pitch));
  CAM.panT.copy(CAM.pan);
}
function dropGrab(){if(grabbed){grabbed.vel.set(0,0,0);grabbed=null;hist.length=0;canvas.style.cursor='default';}}
canvas.addEventListener('pointerdown',e=>{
  ensureAudio();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2){dropGrab();tap=null;startPinch();return;}
  tap={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),moved:0};
  if(phase==='cleanup'){setRay(e);const b=ballUnderRay();
    if(b){grabbed=b;b.autoToss=undefined;canvas.setPointerCapture(e.pointerId);
      dragPlane.set(new THREE.Vector3(0,1,0),-(b.R+.35));
      if(ray.ray.intersectPlane(dragPlane,hit))dragTarget.copy(hit);else dragTarget.copy(b.pos);
      hist.length=0;crackle(.6);}}
});
canvas.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(p){const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;if(tap&&tap.id===e.pointerId)tap.moved+=Math.hypot(dx,dy);}
  if(pinch){updatePinch();return;}
  setRay(e);
  if(grabbed){if(ray.ray.intersectPlane(dragPlane,hit))dragTarget.copy(hit);canvas.style.cursor='grabbing';return;}
  let over=null;
  if(phase==='pick'){over=sheetUnderRay();sheets.forEach(s=>s.mouseHover=s===over);}
  else if(phase==='cleanup')over=ballUnderRay();
  canvas.style.cursor=over?(phase==='cleanup'?'grab':'pointer'):'default';
});
function release(){
  if(!grabbed)return;const b=grabbed;grabbed=null;
  const now=performance.now();let old=hist[0];for(const h of hist)if(now-h.t>=60)old=h;
  if(old&&now-old.t>5){const v=b.pos.clone().sub(old.p).multiplyScalar(1000/(now-old.t));v.y=0;let sp=v.length();
    if(sp>1.2){if(sp>13){v.setLength(13);sp=13;}b.vel.set(v.x,2.4+sp*.5,v.z);}else b.vel.copy(v).multiplyScalar(.5);
    b.angVel.set(Math.random()-.5,Math.random()-.5,Math.random()-.5).multiplyScalar(4+sp);}
  canvas.style.cursor='default';
}
function endPointer(e){
  ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size>=2)startPinch();else{pinch=null;tap=null;}release();return;}
  if(tap&&tap.id===e.pointerId){
    const quick=performance.now()-tap.t<700&&tap.moved<14;
    if(quick&&phase==='pick'){setRay(e);const s=sheetUnderRay();if(s){tap=null;release();pick(s);return;}}
    tap=null;
  }
  release();
}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{e.preventDefault();CAM.zoomT=clamp(CAM.zoomT*Math.exp(-e.deltaY*.0016),1,MAX_ZOOM);if(CAM.zoomT<=1.001)CAM.panT.set(0,0);},{passive:false});

// ---------- physics ----------
const G=-22,up=new THREE.Vector3(0,1,0),tq=new THREE.Quaternion(),tv=new THREE.Vector3(),tn=new THREE.Vector3();
function binR(y){return BIN.rb+(BIN.rt-BIN.rb)*clamp(y/BIN.h,0,1);}
function stepBall(b,dt){
  if(b===grabbed){
    b.pos.lerp(dragTarget,1-Math.exp(-26*dt));
    const bd=layout.bounds;b.pos.x=clamp(b.pos.x,bd.x0+b.R,bd.x1-b.R);b.pos.z=clamp(b.pos.z,bd.z0+b.R,bd.z1-b.R);
    const dx=b.pos.x-BIN.x,dz=b.pos.z-BIN.z,rho=Math.hypot(dx,dz),lim=BIN.rt+b.R+.05;if(rho<lim){b.pos.x=BIN.x+dx/rho*lim;b.pos.z=BIN.z+dz/rho*lim;}
    hist.push({t:performance.now(),p:b.pos.clone()});while(hist.length>14)hist.shift();
    if(hist.length>1){tv.copy(b.pos).sub(hist[hist.length-2].p);b.angVel.set(tv.z,0,-tv.x).multiplyScalar(1/(dt*b.R));}
    b.vel.set(0,0,0);
  }else{
    if(skipMode&&!b.inBin&&b.autoToss===undefined&&b.vel.lengthSq()<.05)b.autoToss=.15+Math.random()*.3;
    if(b.autoToss!==undefined){b.autoToss-=dt;if(b.autoToss<=0){b.autoToss=undefined;const T=.95;
      b.vel.set((BIN.x-b.pos.x)/T,(BIN.h+.5-b.pos.y)/T-.5*G*T,(BIN.z-b.pos.z)/T);b.angVel.set(3,1,-2);crackle(.5);}}
    b.vel.y+=G*dt;b.pos.addScaledVector(b.vel,dt);
    const dx=b.pos.x-BIN.x,dz=b.pos.z-BIN.z,rho=Math.hypot(dx,dz)||1e-6,nx=dx/rho,nz=dz/rho;
    if(!b.inBin&&b.pos.y>BIN.h&&rho<BIN.rt+.7&&b.vel.y<0){b.vel.x-=nx*6*dt;b.vel.z-=nz*6*dt;} // gentle aim assist
    if(b.inBin){
      const lim=Math.max(.02,(b.pos.y>BIN.h?BIN.rt:binR(b.pos.y))-b.R);
      if(rho>lim){b.pos.x=BIN.x+nx*lim;b.pos.z=BIN.z+nz*lim;const vr=b.vel.x*nx+b.vel.z*nz;if(vr>0){b.vel.x-=1.5*vr*nx;b.vel.z-=1.5*vr*nz;}}
      if(b.pos.y<b.R+.02){b.pos.y=b.R+.02;if(b.vel.y<0)b.vel.y*=-.2;b.vel.x*=.9;b.vel.z*=.9;}
    }else{
      if(b.pos.y<BIN.h&&rho<binR(b.pos.y)){b.inBin=true;binned++;updateCount();binSound();if(binned>=ROUNDS[round].fakes.length)setTimeout(roundDone,900);}
      else{
        if(b.pos.y<BIN.h&&rho<binR(b.pos.y)+b.R){const t=binR(b.pos.y)+b.R;b.pos.x=BIN.x+nx*t;b.pos.z=BIN.z+nz*t;const vr=b.vel.x*nx+b.vel.z*nz;if(vr<0){b.vel.x-=1.5*vr*nx;b.vel.z-=1.5*vr*nz;thud(.25);}}
        const dr=rho-BIN.rt,dy=b.pos.y-BIN.h,dd=Math.hypot(dr,dy);
        if(dd<b.R&&dd>1e-5){const k=(b.R-dd)/dd;b.pos.x+=nx*dr*k;b.pos.z+=nz*dr*k;b.pos.y+=dy*k;
          tn.set(nx*dr,dy,nz*dr).divideScalar(dd);const vn=b.vel.dot(tn);if(vn<0){b.vel.addScaledVector(tn,-1.45*vn);thud(.3);}}
        if(b.pos.y<b.R){b.pos.y=b.R;if(b.vel.y<0){const imp=-b.vel.y;b.vel.y=imp>1.2?imp*.35:0;if(imp>2){thud(Math.min(1,imp/12));if(imp>5)crackle(.5);}}}
      }
      const bd=layout.bounds;
      if(b.pos.x<bd.x0+b.R){b.pos.x=bd.x0+b.R;b.vel.x=Math.abs(b.vel.x)*.45;}
      if(b.pos.x>bd.x1-b.R){b.pos.x=bd.x1-b.R;b.vel.x=-Math.abs(b.vel.x)*.45;}
      if(b.pos.z<bd.z0+b.R){b.pos.z=bd.z0+b.R;if(b.vel.z<-2)thud(.3);b.vel.z=Math.abs(b.vel.z)*.4;}
      if(b.pos.z>bd.z1-b.R){b.pos.z=bd.z1-b.R;b.vel.z=-Math.abs(b.vel.z)*.45;}
    }
    const grounded=b.pos.y<=b.R+.003||(b.inBin&&b.pos.y<=b.R+.025);
    if(grounded){const fr=Math.exp(-3*dt);b.vel.x*=fr;b.vel.z*=fr;
      b.angVel.lerp(tv.set(b.vel.z,0,-b.vel.x).multiplyScalar(1/b.R),1-Math.exp(-10*dt));
      if(Math.hypot(b.vel.x,b.vel.z)<.05&&Math.abs(b.vel.y)<.3){b.vel.x=b.vel.z=0;b.angVel.multiplyScalar(.85);}}
    else b.angVel.multiplyScalar(Math.exp(-.3*dt));
  }
  const w=b.angVel.length();if(w>1e-4){tq.setFromAxisAngle(tv.copy(b.angVel).divideScalar(w),w*dt);b.quat.premultiply(tq).normalize();}
}
function ballCollisions(){
  const bs=sheets.filter(s=>s.state==='ball');
  for(let i=0;i<bs.length;i++)for(let j=i+1;j<bs.length;j++){const a=bs[i],b=bs[j];
    tn.copy(b.pos).sub(a.pos);const d=tn.length(),m=a.R+b.R;if(d<m&&d>1e-5){tn.divideScalar(d);const c=(m-d)/2;
      if(a!==grabbed)a.pos.addScaledVector(tn,-c*(b===grabbed?2:1));if(b!==grabbed)b.pos.addScaledVector(tn,c*(a===grabbed?2:1));
      const rv=tv.copy(b.vel).sub(a.vel).dot(tn);if(rv<0){const imp=-1.3*rv/2;a.vel.addScaledVector(tn,-imp);b.vel.addScaledVector(tn,imp);}}}
}

// ---------- hero placement ----------
const camRight=new THREE.Vector3(),camUp=new THREE.Vector3(),camBack=new THREE.Vector3(),mat4=new THREE.Matrix4();
function heroTarget(s,outP,outQ){
  const h=innerHeight,w=innerWidth,pr=panel.getBoundingClientRect();
  const topPx=12+(parseFloat(getComputedStyle(document.documentElement).paddingTop)||0),botPx=panel.classList.contains('show')?pr.top-14:h*.55;
  const fh=clamp((botPx-topPx)/h,.25,.9)*.92,cy=1-(topPx+botPx)/h;
  const t=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const d=Math.max(s.PH/(fh*2*t),s.PW/(.86*2*t*camera.aspect));
  camera.matrixWorld.extractBasis(camRight,camUp,camBack);
  ray.setFromCamera(new THREE.Vector2(0,cy),camera);
  const fwd=tv.copy(camBack).negate(),k=d/ray.ray.direction.dot(fwd);
  outP.copy(ray.ray.origin).addScaledVector(ray.ray.direction,k);
  mat4.makeBasis(camRight,camBack,tn.copy(camUp).negate());outQ.setFromRotationMatrix(mat4);
}

// ---------- main loop ----------
const clock=new THREE.Clock(),yAxis=new THREE.Vector3(0,1,0),eul=new THREE.Euler();
function tick(){
  const dt=Math.min(clock.getDelta(),1/30);
  for(const s of sheets){
    if(s.drop<1){s.drop=Math.min(1,s.drop+dt/.75);}
    if(s.state==='flat'){
      const e=easeIO(clamp(s.drop,0,1)),hv=(s.mouseHover||s.kbHover)&&phase==='pick'?1:0;s.hover=lerp(s.hover,hv,1-Math.exp(-14*dt));
      s.pos.set(s.home.x,s.baseY+s.hover*.07+(1-e)*3.2,s.home.z+(1-e)*-.4);
      eul.set((1-e)*.35*Math.sin(s.drop*9+s.slot),s.home.rot+(1-e)*.6,(1-e)*.3*Math.cos(s.drop*7+s.slot));s.quat.setFromEuler(eul);
    }else if(s.state==='crumpling'){
      if(s.autoDelay>0){s.autoDelay-=dt;}
      else{s.progress=Math.min(1,s.progress+dt/.85);if(Math.random()<.5)crackle(1);
        if(s.progress>=1){s.state='ball';s.vel.set(0,phase==='cleanup'?2.5:1.5,0);s.angVel.set(1.5,0,-1);}}
      s.pos.y=s.groundY();
    }else if(s.state==='ball'){
      if(phase==='cleanup'||phase==='wrong'||phase==='pick'){for(let i=0;i<3;i++)stepBall(s,dt/3);}
    }else if(s===realSheet&&(phase==='reveal'||phase==='returning')){
      hero.t=Math.min(1,hero.t+dt/(hero.dir>0?1.15:.85));
      const p=new THREE.Vector3(),q=new THREE.Quaternion();
      if(hero.dir>0){heroTarget(s,p,q);const e=easeOutBack(hero.t),e2=easeIO(hero.t);
        s.pos.lerpVectors(hero.from,p,e);s.quat.copy(hero.fromQ).slerp(q,Math.min(1,e2*1.15));}
      else{const home=new THREE.Vector3(s.home.x,s.baseY,s.home.z),hq=new THREE.Quaternion().setFromAxisAngle(yAxis,s.home.rot),e=easeIO(hero.t);
        s.pos.lerpVectors(hero.from,home,e);s.pos.y+=Math.sin(hero.t*Math.PI)*.5;s.quat.copy(hero.fromQ).slerp(hq,e);
        if(hero.t>=1){s.state='flat';s.pos.copy(home);scene.add(s.mesh);beginCleanup();}}
    }
    s.U.uProgress.value=s.progress;s.mesh.position.copy(s.pos);s.mesh.quaternion.copy(s.quat);
  }
  if(phase==='cleanup'||phase==='wrong'||phase==='pick')for(let i=0;i<2;i++)ballCollisions();
  if(bakeQueue.length&&phase!=='loading'){phaseT+=dt;if(phaseT>.12){phaseT=0;const s=bakeQueue.shift();if(s.state==='flat')s.ensureBaked();}}

  CAM.uT=(phase==='cleanup'||phase==='done')?1:0;
  CAM.u=lerp(CAM.u,CAM.uT,1-Math.exp(-3*dt));if(Math.abs(CAM.u-CAM.uT)<.002)CAM.u=CAM.uT;
  if(!pinch){CAM.zoom=lerp(CAM.zoom,CAM.zoomT,1-Math.exp(-7*dt));CAM.pan.lerp(CAM.panT,1-Math.exp(-7*dt));}
  applyCamera();
  blur=lerp(blur,blurTarget,1-Math.exp(-(blurTarget>blur?3.2:5)*dt));if(Math.abs(blur-blurTarget)<.002)blur=blurTarget;
  postMat.uniforms.uRadius.value=blur*15*DPR;postMat.uniforms.uDim.value=blur*.28;
  renderer.setRenderTarget(rt);renderer.render(scene,camera);
  renderer.setRenderTarget(null);renderer.render(postScene,postCam);
  if(heroScene.children.some(c=>c.isMesh)){renderer.autoClear=false;renderer.clearDepth();renderer.render(heroScene,camera);renderer.autoClear=true;}
  requestAnimationFrame(tick);
}

// ---------- start ----------
addEventListener('resize',resize);
const fontsReady=document.fonts&&document.fonts.load?Promise.all(['700 60px Caveat','400 60px "Patrick Hand"','700 20px "Atkinson Hyperlegible"'].map(f=>document.fonts.load(f))).catch(()=>{}):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,3000))]).then(()=>{
  resize();startRound(0);$('loading').classList.add('hide');requestAnimationFrame(tick);
});
})();
</script>
</body>
</html>
