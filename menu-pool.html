<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Youth Sports Bible · Menu</title>
<meta name="theme-color" content="#0b2b3d">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0b2b3d;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#eaf6ff;-webkit-font-smoothing:antialiased;overscroll-behavior:none}

  /* the same one-fixed-box trick the title page uses: iOS reports a viewport that is
     taller than what you can actually see, so the height is measured and set here */
  #vp{position:fixed;left:0;top:0;width:100%;height:var(--appvh,100dvh);overflow:hidden}

  #pool{position:absolute;inset:0;width:100%;height:100%;display:block;
    touch-action:manipulation;cursor:pointer}
  #still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:50% 0%;display:none}
  body.nogl #still{display:block}
  body.nogl #pool{display:none}

  /* a touch of shade at the top and bottom so menu items will read over the water */
  #shade{position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(4,18,30,.52) 0%,rgba(4,18,30,.12) 26%,rgba(4,18,30,0) 46%),
      linear-gradient(0deg,rgba(4,18,30,.42) 0%,rgba(4,18,30,0) 32%)}

  /* ------------------------------------------------------------------ *
   *  MENU ITEMS GO HERE.  #menu is an empty, centred column sitting     *
   *  above the water; anything dropped in it will be clickable, and     *
   *  taps that miss it still reach the water underneath.                *
   * ------------------------------------------------------------------ */
  #menu{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:24px;
    pointer-events:none}
  #menu > *{pointer-events:auto}

  #hint{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:4;text-align:center;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
    color:#dbeefc;opacity:0;text-shadow:0 2px 12px rgba(0,10,20,.8);pointer-events:none;
    transition:opacity 1.2s ease}
  #hint.show{opacity:.5}
</style>
</head>
<body>
<div id="vp">
  <canvas id="pool"></canvas>
  <img id="still" alt="Olympic swimming pool">
  <div id="shade"></div>
  <div id="menu"><!-- menu items --></div>
  <div id="hint">Touch the water</div>
</div>

var VS='#version 300 es\n'+
'void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);'+

var FS=`#version 300 es
precision highp float;
out vec4 frag;

uniform sampler2D uPhoto,uMask;
uniform vec2  uRes;         /* canvas size in CSS px          */
uniform float uAsp;         /* photo height / photo width     */
uniform float uTime;
uniform vec4  uRip[6];      /* wx, wz, birth time, unused     */
uniform float uNRip;

/* Where the pool's edges converge, measured off the photograph itself by fitting the
   two water boundaries and intersecting them. Everything about the perspective follows
   from this one point. */
const vec2  VP   = vec2(0.4959,0.2363);
const float KZ   = 0.7637;   /* so z = 1 at the bottom of the photo */
const float LATK = 3.40;     /* world units across, per unit of depth */

/* Distance along the pool for a point on the water, and its lateral offset. A plane seen
   by a pinhole camera has depth proportional to 1/(y - horizon): that single relation is
   what makes the ripples shrink and crowd together toward the far end without any of it
   being faked. */
float depthAt(vec2 uv){ return KZ/max(uv.y-VP.y,0.006); }
vec2  worldAt(vec2 uv,float z){ return vec2((uv.x-VP.x)*z*LATK, z); }

/* one directional wave, returning height and its two slopes */
vec3 wv(vec2 p,float t,vec2 d,float k,float w,float a){
  float s=sin(dot(d,p)*k - t*w);
  float c=cos(dot(d,p)*k - t*w)*k*a;
  return vec3(s*a, c*d.x, c*d.y);
}

/* The resting surface: a couple of long slow swells running the length of the pool, and
   finer cross-ripple on top. A competition pool between races is nearly flat, so the
   amplitudes are small and most of what you see is the reflection sliding about. */
vec3 calmField(vec2 p,float t){
  vec3 h=vec3(0.0);
  /* A long gentle swell down the pool, then progressively finer cross-ripple. The
     amplitudes fall as the wavenumbers rise so the slope — which is what actually moves
     the reflection — stays in the same range across the whole spectrum. */
  h+=wv(p,t,normalize(vec2( 0.10, 1.00)), 2.10,1.15,0.230);
  h+=wv(p,t,normalize(vec2(-0.32, 1.00)), 3.40,1.50,0.150);
  h+=wv(p,t,normalize(vec2( 0.85, 0.32)), 5.10,1.95,0.086);
  h+=wv(p,t,normalize(vec2( 0.42,-1.00)), 8.60,2.70,0.046);
  h+=wv(p,t,normalize(vec2(-0.90, 0.20)),13.50,3.55,0.026);
  h+=wv(p,t,normalize(vec2( 0.62, 0.78)),21.00,4.60,0.013);
  return h;
}

/* A ring thrown out from a tap. The front travels at SPD, the crests behind it are KR
   apart, and the whole thing loses height with distance and with age — so it dies out
   rather than ringing for ever. */
const float SPD=1.35, KR=19.0;
vec3 ripple(vec2 p,float t,vec4 r){
  float age=t-r.z;
  if(age<0.0||age>7.0) return vec3(0.0);
  vec2 dv=p-r.xy;
  float dist=length(dv)+1e-4;
  float front=SPD*age;
  /* nothing has happened yet beyond the wavefront */
  float gate=smoothstep(0.0,0.35,front-dist);
  float fade=exp(-age*0.40)*smoothstep(0.0,0.09,age)*exp(-dist*0.85);
  float amp=0.34*gate*fade;
  float ph=dist*KR-age*SPD*KR;
  float s=sin(ph), c=cos(ph)*KR*amp;
  vec2 n=dv/dist;
  return vec3(s*amp, c*n.x, c*n.y);
}

void main(){
  vec2 px=vec2(gl_FragCoord.x, uRes.y-gl_FragCoord.y);
  /* the photograph is fitted to the width and hung from the top; a screen taller than it
     carries on into open water below, which is featureless, so the join never shows */
  float ph=uRes.x*uAsp;
  vec2 uv=vec2(px.x/uRes.x, px.y/ph);

  float mask=texture(uMask,clamp(uv,vec2(0.0),vec2(1.0))).r;
  vec3 col;

  if(mask<0.004){
    col=texture(uPhoto,clamp(uv,vec2(0.0),vec2(1.0))).rgb;
  }else{
    float z=depthAt(uv);
    vec2  w=worldAt(uv,z);

    vec3 h=calmField(w,uTime);
    for(int i=0;i<6;i++){
      if(float(i)>=uNRip) break;
      h+=ripple(w,uTime,uRip[i]);
    }

    /* How sharp the photograph itself is here. The lens is focused across the middle of
       the pool, so the far end and the very front are soft — the ripple detail we add has
       to lose its edge in the same places or it sits on top of the picture instead of in
       it. */
    float sharp=smoothstep(0.255,0.40,uv.y)*(1.0-smoothstep(0.72,1.30,uv.y));
    sharp=mix(0.25,1.0,sharp);

    /* Slope moves the reflection about. On screen a far ripple must move less than a near
       one by exactly the amount the perspective shrank it, hence the 1/z. The vertical
       throw is the larger of the two because the water is seen at a grazing angle. */
    float amp=mask*mask*(0.7+0.3*sharp)/z;
    vec2 d=vec2(h.y*0.0075, h.z*0.0155)*amp;
    d=clamp(d,vec2(-0.045),vec2(0.045));

    vec2 suv=clamp(uv+d,vec2(0.0),vec2(1.0));
    col=texture(uPhoto,suv).rgb;

    /* Warping only moves what is already in the picture, and the open water in the near
       foreground has nothing in it to move — so the slope is also allowed to shade the
       water directly. Slope rather than height: at this grazing an angle it is the tilt
       of the surface that decides how much sky each patch returns, which is why calm
       water reads as fine bands rather than broad humps. */
    float g=h.z*0.55+h.y*0.30;
    float open=smoothstep(0.62,1.05,uv.y);
    col*=1.0+clamp(g,-1.6,1.6)*(0.013+0.021*open)*mask;
    float glint=smoothstep(0.35,1.05,g)*smoothstep(0.02,0.25,mask);
    col+=vec3(0.55,0.72,0.80)*glint*0.085*sharp/sqrt(z);
    /* and the troughs a shade deeper */
    col-=vec3(0.10,0.06,0.02)*smoothstep(0.30,1.10,-g)*0.16*sharp/sqrt(z);
  }
  frag=vec4(col,1.0);
}
`;

var gl=null;
try{gl=cv.getContext('webgl2',{alpha:false,antialias:false,powerPreference:'low-power'});}catch(e){}

if(!gl){
  /* no WebGL: the photograph on its own, and nothing else changes */
  document.body.classList.add('nogl');
}else{
  var prog=(function(){
    function sh(t,src){var s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(s));
      return s;}
    var p=gl.createProgram();
    gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));
    gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FS));
    gl.linkProgram(p);
    return gl.getProgramParameter(p,gl.LINK_STATUS)?p:null;
  })();
  if(!prog){document.body.classList.add('nogl');}
  else{
    var U={};['uPhoto','uMask','uRes','uAsp','uTime','uRip','uNRip']
      .forEach(function(n){U[n]=gl.getUniformLocation(prog,n);});
    var vao=gl.createVertexArray();

    function tex(img,unit){
      var t=gl.createTexture();
      gl.activeTexture(gl.TEXTURE0+unit);
      gl.bindTexture(gl.TEXTURE_2D,t);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.generateMipmap(gl.TEXTURE_2D);
      return t;
    }

    var DPR=1,W=0,H=0;
    function resize(){
      appVH();
      /* the shader is doing real work per pixel, so full retina is not worth it here —
         the water is soft-edged and 1.4x is indistinguishable from 3x */
      DPR=Math.min(1.4,devicePixelRatio||1);
      W=VPW;H=VPH;
      cv.style.width=W+'px';cv.style.height=H+'px';
      cv.width=Math.max(1,Math.round(W*DPR));
      cv.height=Math.max(1,Math.round(H*DPR));
      gl.viewport(0,0,cv.width,cv.height);
    }
    addEventListener('resize',resize);
    addEventListener('orientationchange',function(){setTimeout(resize,140);});
    if(window.visualViewport){
      visualViewport.addEventListener('resize',resize);
      visualViewport.addEventListener('scroll',resize);
    }

    /* ---------- taps ---------- */
    /* The tap is turned into a point on the water in pool coordinates, so the ring that
       spreads from it is drawn in the world and comes back to the screen already in
       perspective: wide and slow in the foreground, tight and quick at the far end. */
    var VPx=0.4959,VPy=0.2363,KZ=0.7637,LATK=3.40;
    var RIP=new Float32Array(24),NRIP=0,T0=performance.now();
    function now(){return (performance.now()-T0)/1000;}
    function splash(cx,cy){
      var ph=W*(IMGH/IMGW);
      var uvx=cx/W, uvy=cy/ph;
      if(uvy-VPy<0.012)return;                 /* above the water: nothing to disturb */
      var z=KZ/(uvy-VPy);
      var wx=(uvx-VPx)*z*LATK;
      /* newest first, keeping at most six alive */
      for(var i=Math.min(NRIP,5);i>0;i--)
        for(var k=0;k<4;k++)RIP[i*4+k]=RIP[(i-1)*4+k];
      RIP[0]=wx;RIP[1]=z;RIP[2]=now();RIP[3]=0;
      NRIP=Math.min(6,NRIP+1);
      if(hint)hint.classList.remove('show');
    }
    cv.addEventListener('pointerdown',function(e){
      var r=cv.getBoundingClientRect();
      splash(e.clientX-r.left,e.clientY-r.top);
    });

    var loaded=0;
    function ready(){
      if(++loaded<2)return;
      resize();
      gl.useProgram(prog);
      gl.uniform1i(U.uPhoto,0);
      gl.uniform1i(U.uMask,1);
      gl.uniform1f(U.uAsp,IMGH/IMGW);
      requestAnimationFrame(draw);
      setTimeout(function(){hint.classList.add('show');},1400);
      setTimeout(function(){hint.classList.remove('show');},11000);
    }
    [[PHOTO,0],[MASK,1]].forEach(function(o){
      var im=new Image();
      im.onload=function(){tex(im,o[1]);ready();};
      im.onerror=function(){document.body.classList.add('nogl');};
      im.src=o[0];
    });

    var run=true;
    document.addEventListener('visibilitychange',function(){
      run=!document.hidden;
      if(run){T0=performance.now()-lastT*1000;requestAnimationFrame(draw);}
    });
    var lastT=0;
    function draw(){
      if(!run)return;
      lastT=now();
      gl.useProgram(prog);
      gl.bindVertexArray(vao);
      gl.uniform2f(U.uRes,W,H);
      gl.uniform1f(U.uTime,lastT);
      /* rings that have died out stop costing anything */
      while(NRIP>0&&lastT-RIP[(NRIP-1)*4+2]>7.0)NRIP--;
      gl.uniform4fv(U.uRip,RIP.subarray(0,24));
      gl.uniform1f(U.uNRip,NRIP);
      gl.drawArrays(gl.TRIANGLES,0,3);
      requestAnimationFrame(draw);
    }
  }
}
