<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0b2b3d;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#eaf6ff;-webkit-font-smoothing:antialiased;overscroll-behavior:none}

  /* the same one-fixed-box trick the title page uses: iOS reports a viewport that is
     taller than what you can actually see, so the height is measured and set here */
  #vp{position:fixed;left:0;top:0;width:100%;height:var(--appvh,100dvh);overflow:hidden}

  #pool{position:absolute;inset:0;width:100%;height:100%;display:block;
    touch-action:manipulation;cursor:pointer}
  #still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:50% 0%;display:none}
  body.nogl #still{display:block}
  body.nogl #pool{display:none}

  /* a touch of shade at the top and bottom so menu items will read over the water */
  #shade{position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(4,18,30,.52) 0%,rgba(4,18,30,.12) 26%,rgba(4,18,30,0) 46%),
      linear-gradient(0deg,rgba(4,18,30,.42) 0%,rgba(4,18,30,0) 32%)}

  /* The block is 1064 x 1260 in the artwork, so its height follows its width and every
     note is then a percentage of both.
     It is bounded on BOTH axes: the width so it never crowds a phone, the height so on a
     laptop in landscape the bottom note does not run off the screen. One min() does the
     whole job and there is not a media query in it. The height bound came down from 66vh
     to 56vh when the seventh and eighth notes made the block a fifth taller — the whole
     column is padding + 1.35 x bw, so the water below it goes first. */
  #menu{--bw:min(90vw,56vh,700px);
    position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
    align-items:center;pointer-events:none;
    padding-top:min(4.6vw,7vh,88px);
    font-family:YSBSans,Bahnschrift,'DIN Alternate','Segoe UI',system-ui,sans-serif}
  #menu > *{pointer-events:auto}

  #mtitle{width:var(--bw);text-align:center;color:#fff;
    font-weight:800;text-transform:uppercase;letter-spacing:.08em;
    font-size:calc(var(--bw)*.0508);line-height:1.05;
    text-shadow:0 2px 14px rgba(2,22,38,.55),0 1px 2px rgba(2,22,38,.35);
    margin-bottom:calc(var(--bw)*.115);pointer-events:none;
    opacity:0;animation:mIn .45s cubic-bezier(.2,.8,.3,1) forwards}

  #mblock{position:relative;width:var(--bw);height:calc(var(--bw)*1.1842)}

  .note{position:absolute;display:block;text-decoration:none;
    opacity:0;animation:mIn .42s cubic-bezier(.2,.8,.3,1) forwards;
    transition:transform .18s cubic-bezier(.2,.8,.3,1),filter .18s ease;
    /* the artwork's own drop shadow was a separate layer; this is the same shadow, but it
       follows the note when it lifts */
    filter:drop-shadow(0 6px 10px rgba(3,24,40,.24))}
  /* The paper sits back a little so the water reads through it, and comes up to full
     white under the pointer. Only the IMAGE is faded, never the whole note — fading the
     note takes the type with it and the headings go grey. */
  .note img{display:block;width:100%;height:auto;-webkit-user-drag:none;user-select:none;
    opacity:.85;transition:opacity .18s ease}
  .note .t{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding-top:5%;
    color:#141414;text-align:center;line-height:1.06}
  .note .t b{font-weight:800;font-size:calc(var(--bw)*.0508);letter-spacing:.005em}
  .note .t span{font-weight:400;font-size:calc(var(--bw)*.0392);line-height:1.16;
    margin-top:.14em}

  @media (hover:hover){
    .note:hover{transform:translateY(-7px) rotate(-.35deg);
      filter:drop-shadow(0 16px 20px rgba(3,24,40,.32))}
    .note:hover img{opacity:1}
  }
  /* and on a touch screen, where there is no hover, the tap itself brightens it */
  .note:active{transform:translateY(-2px) scale(.988);
    filter:drop-shadow(0 5px 8px rgba(3,24,40,.28))}
  .note:active img,.note:focus-visible img{opacity:1}
  .note:focus-visible{outline:3px solid #ffe58a;outline-offset:6px;border-radius:4px}

  @keyframes mIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

  /* landscape has room to sit the block where the artwork put it, a little right of the
     pool's centre line; a phone standing up does not, so it centres */
  @media (min-aspect-ratio:5/4){ #mblock,#mtitle{margin-left:calc(var(--bw)*.055)} }


  #hint{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:4;text-align:center;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
    color:#dbeefc;opacity:0;text-shadow:0 2px 12px rgba(0,10,20,.8);pointer-events:none;
    transition:opacity 1.2s ease}
  #hint.show{opacity:.5}
</style>
</head>

/* ---------- who arrives, and when ---------- */

   pixels across, so the radii are compressed but keep their order. */

   the frame, how wide across it, and how far off centre. The depth and the world radius
   are then solved from those, so the three of them land in the same place in the picture
   whether it is a laptop in landscape or a phone standing up — on a tall phone, fixed
   depths put all three in the top third with an empty acre of water underneath. */
/* Where each one ends up, now that the notes own the middle.
   The basketball goes in dead centre and low: its crown is six ball diameters across and
   more than two tall, so from there it bursts up BEHIND the notes and spills out either
   side of them, which is exactly what you want it doing — it covers the join between the
   paper and the water instead of competing with it. The ball itself lands below the block
   on a phone and pokes out under it on a laptop.

  {k:'soccer',sy:0.740,dia:0.150,lx:-0.55,fl:0.44,at:5, side:-1,mat:[1,0,.040,1.00]},
  {k:'tennis',sy:0.800,dia:0.082,lx: 0.62,fl:0.28,at:10,side: 1,mat:[.52,.46,.016,1.40]},
  {k:'basket',sy:0.880,dia:0.163,lx: 0.00,fl:0.47,at:15,drop:1, mat:[1,0,.040,1.00]}

  b.on=0; b.wx=0; b.vx=0; b.y=0; b.vy=0; b.wz=1.5; b.R=0.3; b.tx=0;

var TAPS=0, GRAV=14.6;

/* ---------- the splash ---------- */
var DMAX=160, DR=new Float32Array(DMAX*7), NDROP=0;   /* x,z,y, vx,vz,vy, size */

   land like an impact rather than a slow-motion study. The crown is up in four frames. */

     else, so this is a thin garnish in OUR perspective rather than the main event it used
     to be. */
  var n=Math.min(DMAX,40);
  for(var i=0;i<n;i++){
    var jet=i<14;
    var a=Math.random()*6.2832;
    var sp=jet?(0.10+Math.random()*0.40):(1.4+Math.random()*3.2)*power;
    var up=jet?(4.4+Math.random()*3.2):(2.2+Math.random()*3.6)*power;
    var rr=jet?R*0.28:R*(0.70+Math.random()*0.60);
    var o=i*7;
    DR[o]  =wx+Math.cos(a)*rr;
    DR[o+1]=wz+Math.sin(a)*rr*0.85;
    DR[o+2]=jet?R*0.25:R*0.40;
    DR[o+3]=Math.cos(a)*sp;
    DR[o+4]=Math.sin(a)*sp*0.85;

/* Drawn ONCE, and after the ball. The footage's own ball is cut out of the matte, so the
   hole in the middle is exactly ball-shaped and ours shows through it — which means the
   water in front of the ball is in front of it, and the water behind is hidden by it,
   with no second pass and no double-blending. The two match because the sprite is scaled
   by ball radius: the clip's ball is 125 px across in a 760 px crop, and ours is the same
   fraction of the same sprite by construction. */
function drawSplash(t){
  if(!TXS)return;

  var f=age*SPFPS; if(f>=SPN)return;
  var i=f|0, u=f/SPN;
  var wl=toScreen(SPX,SPZ,0.0); if(!wl)return;
  var rp=radPx(SPR,SPZ);
  var hw=rp*SPMETA.widthInRadii*0.5*(SPMETA.scale||1);
  var hh=hw*2.0*SPMETA.aspect;

     the waterline and the clip's own surface lines up with ours. No extra seat any more:
     the green-screen matte keeps its foam skirt right down to the waterline, where the old
     one stopped an inch short and had to be nudged down to hide the gap. */
  var by=wl[1]+hh*SPMETA.base;

     — neither the splash nor the ball sits exactly in the centre of the frame, so
     centring the crop leaves the crown off to one side of ours */

function stepDrops(dt,t){

    var s=toScreen(DR[o],DR[o+1],DR[o+2]);

    DBUF[b+4]=Math.min(1,DR[o+5]*0.14+0.3);

/* ---------- world to screen ---------- */
var W=0,H=0,PH=0,DPR=1;
function toScreen(wx,wz,y){

}
function radPx(R,wz){ return (R/(wz*LATK))*W; }

function pushRipple(wx,wz,amp){

    for(var k=0;k<4;k++)RIP[i*4+k]=RIP[(i-1)*4+k];
  RIP[0]=wx;RIP[1]=wz;RIP[2]=now();RIP[3]=amp;

var T0=performance.now();
function now(){return (performance.now()-T0)/1000;}

/* ---------- taps ---------- */
function tap(cx,cy){
  var uvy=cy/PH;
  if(uvy-VPY<0.012)return;
  var z=KZ/(uvy-VPY);
  var wx=(cx/W-VPX)*z*LATK;
  /* a tap that lands on a ball shoves it instead of only rippling */
  for(var i=0;i<CAST.length;i++){
    var b=CAST[i];
    if(b.on!==2)continue;
    var s=toScreen(b.wx,b.wz,b.y);
    if(!s)continue;
    var r=radPx(b.R,b.wz);
    if(Math.hypot(s[0]-cx,s[1]-cy)<r*1.15){
      var dir=cx<s[0]?1:-1;
      b.vx+=dir*(0.35+Math.random()*0.25);
      b.vy-=1.1;
      spinUp(b,-dir*(0.9+Math.random()*0.5));
      break;
    }
  }
  pushRipple(wx,z,1.0);
  TAPS++;
  for(var j=0;j<CAST.length;j++){

}
function enter(b){

       0.72 units a second and let drag take it: with drag at 0.55 the whole journey is
       v0/0.55 = 1.3 units however long you wait, and the trip in from off-stage is three
       or four — so the ball stalled a third of the way, never reached its mark, never
       reached the settled state, and sat half off the edge of the screen ignoring taps.
       Closed form always lands. */
    var half=0.5*b.wz*LATK;

cv.addEventListener('pointerdown',function(e){
  var r=cv.getBoundingClientRect();

/* ---------- sizing ---------- */
function layout(){
  CAST.forEach(function(b){
    var was=b.wz>0?b.wx/Math.max(0.5*b.wz*LATK,1e-3):0;   /* keep it where it was, in
                                                             fractions of the width */
    var uvy=b.sy*H/PH;
    b.wz=Math.max(0.34,KZ/Math.max(0.05,uvy-VPY));
    b.R=(b.dia*Math.min(W,H*0.95)*0.5)*b.wz*LATK/W;

    b.tx=b.lx*half;

       travelling to the wrong place */

function resize(){
  appVH();

  W=VPW;H=VPH;PH=W*(IMGH/IMGW);

/* ---------- how a ball rides ---------- */
/* A ball only feels waves longer than itself: the ripples crossing under it average out
   over the width of its footprint and leave it alone. Sampling the field at the middle
   and at four points around the rim, and taking the mean, is that averaging — without it
   the fine octaves come straight through and the ball twitches. */

  var h=0,gx=0,gz=0,d=b.R*0.9,i;

    h+=WOUT[0];gx+=WOUT[1];gz+=WOUT[2];

         — a ball that vanishes for a second reads as dropped down a hole */
      b.vy=Math.max(b.vy,-3.4);
      splash(b.wx,b.wz,b.R,1.0);
      if(hint)hint.classList.remove('show');
    }
    if(b.wet){
      /* Buoyancy as a damped spring. It used to be stiff (k=95, c=9) and the ball was
         back at rest inside a third of a second — which was fine on its own, but against
         the filmed splash it left the ball bobbing high under a crown that is still in
         the air. In the footage the ball stays down for most of a second. Slack spring,
         light damping: under, back up, and settled about when the splash has gone. */
      var tgt=surf+b.fl*b.R;
      b.vy+=(-(b.y-tgt)*40.0-b.vy*5.2)*dt;
      b.y+=b.vy*dt;

         through the water; this renderer draws nothing below the waterline, so a ball that
         submerges simply vanishes and leaves the splash hanging over an empty pool. It is
         held to a cap above the surface instead. */

  gl.uniform1f(UB.uRefl,0.0);
  gl.uniform2f(UB.uC,c[0]*DPR,c[1]*DPR);
  gl.uniform1f(UB.uWaterY,wl[1]*DPR);

/* ---------- the loop ---------- */
var BALLU=new Float32Array(12), LAST=0, run=true;

});
var prev=0;
function draw(){
  if(!run)return;
  var t=now(), dt=Math.min(0.05,t-prev); prev=t; LAST=t;
  while(NRIP>0&&t-RIP[(NRIP-1)*4+2]>8.0)NRIP--;

  var i;

     given cv.width/cv.height; this one was the odd man out, and it only ever looked right
     because every test machine happened to be at DPR 1. */

  gl.uniform1f(UW.uAsp,IMGH/IMGW);

  gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  /* far ones first, so a nearer ball paints over one behind it */
  var order=CAST.slice().sort(function(a,b){return b.wz-a.wz;});
  for(i=0;i<order.length;i++){gl.depthMask(true);gl.clear(gl.DEPTH_BUFFER_BIT);drawBall(order[i]);}
  drawSplash(t);

  if(nd){
    gl.useProgram(pD);
    gl.bindVertexArray(dvao);
    gl.bindBuffer(gl.ARRAY_BUFFER,dvbo);
    gl.bufferSubData(gl.ARRAY_BUFFER,0,DBUF,0,nd*5);
    gl.uniform2f(UD.uRes,cv.width,cv.height);
    gl.drawArrays(gl.POINTS,0,nd);
    gl.bindVertexArray(null);
  }
  requestAnimationFrame(draw);
}

/* ---------- assets ---------- */
var TXP=null,TXM=null,TXS=null,BA={},pending=2,done=0;
function got(){ if(++done>=pending)start(); }
function start(){
  resize();
  dvao=gl.createVertexArray();gl.bindVertexArray(dvao);
  dvbo=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,dvbo);
  gl.bufferData(gl.ARRAY_BUFFER,DBUF.byteLength,gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,20,0);
  gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,2,gl.FLOAT,false,20,12);
  gl.bindVertexArray(null);
  prev=now();
  requestAnimationFrame(draw);
  setTimeout(function(){hint.classList.add('show');},1400);
  setTimeout(function(){hint.classList.remove('show');},11000);
}
(function(){
  var i1=new Image();
  i1.onload=function(){TXP=tex(i1);got();};
  i1.onerror=function(){document.body.classList.add('nogl');};
  i1.src=PHOTO;
  var i2=new Image();
  i2.onload=function(){TXM=tex(i2);got();};
  i2.onerror=function(){document.body.classList.add('nogl');};
  i2.src=MASK;
  /* the drawn splash, wanted only once and late, so nothing waits on it either. No
     mipmaps: the cells sit shoulder to shoulder and a smaller level would mix them. */
  var i3=new Image();
  i3.onload=function(){
    TXS=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,TXS);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,i3);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  };
  i3.src=SPLASH;
  /* the balls arrive late and are not needed to draw the pool, so nothing waits on them */
  CAST.forEach(function(b){
    var rec=PACK[b.k]; if(!rec)return;
    var slot=BA[b.k]={m:mesh(rec)};
    [['base','bc'],['nrm','nr'],['rough','ro']].forEach(function(o){
      var im=new Image();
      im.onload=function(){slot[o[0]]=tex(im);};
      im.src='data:image/webp;base64,'+rec[o[1]];
    });
  });
})();
})();}

</script>
