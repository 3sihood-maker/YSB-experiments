014 so you'd never look at ordinary life the same way again.",tag:"the material"}],Kc=[{q:"\u201CParable\u201D (parabol\u0113) literally means\u2026",opts:["A sacred riddle","Thrown alongside","A short sermon","A hidden law"],a:1,why:"A story thrown down alongside real life \u2014 meaning sparks in the gap."},{q:"Roughly how much of Jesus' recorded teaching is parables?",opts:["About 5%","About a tenth","About a third","Nearly all of it"],a:2,why:"Around a third \u2014 roughly 40 parables. It was his signature move."},{q:"Why did parables work like trojan horses?",opts:["They were easy to memorise","They got past people's defences before landing the point","They were required by law","They were only for children"],a:1,why:"An innocent story slips in\u2026 then detonates. Nathan did it to King David; Jesus perfected it."}],fr=[{id:"mustard",icon:"\u25CF",iconSize:8,name:"The Mustard Seed",ref:"Matthew 13:31\u201332",color:g.green,story:"The kingdom of God is like a mustard seed \u2014 the smallest seed in the garden. Someone plants it, and it grows into a shrub so big the birds nest in its branches.",surface:"A tiny seed becomes a big plant.",hidden:"A mustard seed is about 1\u20132 mm across, and the plant can hit 3 metres. Jesus is saying God's kingdom starts embarrassingly small \u2014 twelve nobodies in a backwater province \u2014 and quietly outgrows every empire watching it.",fact:"Everyone expected the kingdom to arrive like a cedar of Lebanon \u2014 a mighty imperial tree. Jesus picked a garden weed instead. It's almost a joke: small, unstoppable, and growing in your backyard.",quiz:{q:"Why is the mustard seed such a subversive image for the kingdom?",opts:["Mustard was illegal to plant","People expected a mighty cedar; Jesus chose a tiny garden plant","Mustard seeds are actually huge","Birds were considered unclean"],a:1,why:"Empires got pictured as giant cedars. Jesus swaps in a backyard shrub: small start, unstoppable spread."}},{id:"treasure",icon:"\u25C6",iconSize:22,name:"Treasure & the Pearl",ref:"Matthew 13:44\u201346",color:g.gold,story:"A man finds treasure buried in a field, and in his joy sells everything he has to buy that field. A merchant finds one perfect pearl and does the same.",surface:"Two people give up everything for one find.",hidden:"The key word is JOY. Nobody forces either of them. The kingdom isn't a grim sacrifice \u2014 it's the deal of a lifetime that makes everything else look cheap. You don't lose your life; you trade up.",fact:"There were no banks. In a land of wars and raids, burying your valuables WAS the bank \u2014 fields genuinely held forgotten treasure. And pearls, not diamonds, were the most precious gem of the ancient world. Jesus chose the two most electric \u201Cjackpot\u201D images his listeners had.",quiz:{q:"What word drives both the treasure and the pearl stories?",opts:["Fear","Duty","Joy","Luck"],a:2,why:"\u201CIn his joy\u201D he sells everything. The kingdom is a trade-up, not a shakedown."}},{id:"sower",icon:"\u2058",iconSize:20,name:"The Sower",ref:"Mark 4:1\u201320",color:g.clay,story:"A farmer scatters seed everywhere. Some hits the path, some hits rock, some falls among thorns \u2014 and some lands in good soil, producing thirty, sixty, a hundred times what was sown.",surface:"Seed grows better in good soil.",hidden:"The question the parable fires back at you: which soil are you? Hard-packed and unbothered? Shallow hype that dies at the first difficulty? Choked by stress and stuff? Or soil where the word actually gets room to grow?",fact:"In first-century Galilee a good harvest returned about 7\u201310 times the seed sown. Jesus says thirty, sixty, a HUNDRED-fold. His audience would have laughed out loud \u2014 it's a miracle-level, economy-breaking number. That's his claim about what one receptive life can produce.",quiz:{q:"Why would a 100-fold harvest make Jesus' audience gasp?",opts:["Harvests were usually about 7\u201310 fold, so 100x is miracle-level","Farmers never counted their harvest","100 was an unlucky number","Seed was too expensive to scatter"],a:0,why:"Normal was 7\u201310x. Thirty, sixty, a hundred-fold is deliberately absurd abundance."}},{id:"prodigal",icon:"\u2302",iconSize:20,name:"The Prodigal Son",ref:"Luke 15:11\u201332",color:g.gold,story:"A son demands his inheritance early, blows it all in a far country, and crawls home rehearsing an apology. His father sees him from far off \u2014 and runs.",surface:"A runaway son gets forgiven.",hidden:"Asking for your inheritance early meant, in effect, \u201CI wish you were dead.\u201D The whole village would expect the father to disown him. Instead the father humiliates himself to restore him \u2014 robe, ring, feast \u2014 before the son even finishes his speech.",fact:"Middle-eastern patriarchs did not run. Ever. Running meant hitching up your robe and showing your legs \u2014 losing your dignity in front of the whole village. The father sprints anyway. It's Jesus' picture of what God is like: dignity thrown away for the sake of getting to you faster.",quiz:{q:"What's shocking about the father running?",opts:["Running was against the law","Dignified patriarchs never ran in public \u2014 it was humiliating","The father was known to be unfit","Sons were supposed to run first"],a:1,why:"A patriarch running \u2014 robe hitched, legs showing \u2014 was social self-humiliation. He does it anyway."}},{id:"samaritan",icon:"\u271A",iconSize:18,name:"The Good Samaritan",ref:"Luke 10:25\u201337",color:g.clay,story:"A man is beaten and left for dead on the Jericho road. A priest passes by. A Levite passes by. Then a Samaritan \u2014 the enemy \u2014 stops, treats his wounds, and pays for his recovery.",surface:"Be kind to strangers.",hidden:"Jesus told this to a law expert who asked \u201Cwho is my neighbour?\u201D \u2014 hoping for a nice, limited list. Jesus makes the HERO a Samaritan, the despised enemy. The question flips from \u201Cwho counts as my neighbour?\u201D to \u201Cwill you be one \u2014 even across enemy lines?\u201D",fact:"The Jericho road drops about 1,000 metres in 27 km of bandit-riddled desert canyon \u2014 everyone listening knew it was genuinely dangerous. And at the end, the law expert can't even bring himself to say the word \u201CSamaritan.\u201D He mumbles \u201C\u2026the one who showed mercy.\u201D The prejudice is that deep \u2014 which is exactly the point.",quiz:{q:"At the end, what can't the law expert bring himself to say?",opts:["The victim's name","The word \u201CSamaritan\u201D","The word \u201Cmercy\u201D","The name of the road"],a:1,why:"He dodges with \u201Cthe one who showed mercy.\u201D He can't name the enemy as the hero \u2014 and Jesus lets that hang in the air."}},{id:"lost",icon:"\u25CE",iconSize:20,name:"Lost Sheep, Lost Coin",ref:"Luke 15:1\u201310",color:g.green,story:"A shepherd leaves ninety-nine sheep to find one that's lost \u2014 and throws a party when he finds it. A woman turns her house upside down for one lost coin, then celebrates with her neighbours.",surface:"God looks for lost things.",hidden:"Jesus tells these because religious leaders are grumbling that he eats with \u201Csinners.\u201D His answer: heaven throws a bigger party over one found person than over ninety-nine who never left. Lost people aren't a problem to God \u2014 they're the treasure.",fact:"The lost coin was a drachma \u2014 roughly a full day's wages. And village houses were dark, with tiny or no windows, which is why she needs a lamp and a broom at midday. Jesus paints God as a woman sweeping in the dark, refusing to give up on you. That image alone scandalised some listeners.",quiz:{q:"Why does Jesus tell the lost-and-found parables in the first place?",opts:["To teach shepherding skills","Religious leaders were grumbling that he ate with \u201Csinners\u201D","A coin had actually been lost that day","To explain village architecture"],a:1,why:"They're his defence of the guest list: heaven parties hardest over the found."}},{id:"unforgiving",icon:"\u2260",iconSize:20,name:"The Unforgiving Servant",ref:"Matthew 18:21\u201335",color:g.gold,story:"A servant owes his king ten thousand talents and is forgiven the lot. He then finds a colleague who owes him a hundred denarii \u2014 and has him thrown into prison.",surface:"Forgive people who owe you.",hidden:"The parable answers Peter's question: \u201CHow many times should I forgive \u2014 seven?\u201D Jesus: seventy-seven. Then he tells a story where the maths makes the point brutally: forgiven people who won't forgive haven't understood what just happened to them.",fact:"Do the maths. Ten thousand talents \u2248 60 million denarii \u2014 hundreds of thousands of YEARS of wages. It's a deliberately impossible, comic number, like owing someone a trillion dollars. The second debt? About three months' pay. Jesus builds the absurdity into the arithmetic itself.",quiz:{q:"Roughly how do the two debts compare?",opts:["They're about equal","The first is maybe double the second","The first is hundreds of thousands of years of wages vs about 100 days","The second is bigger"],a:2,why:"10,000 talents vs 100 denarii \u2014 a comically impossible debt vs three months' pay. The joke IS the lesson."}},{id:"builders",icon:"\u25B2",iconSize:18,name:"The Two Builders",ref:"Matthew 7:24\u201327",color:g.clay,story:"Two people build houses. One digs down to rock; one builds straight onto sand. The same storm hits both. One house stands. One collapses spectacularly.",surface:"Build carefully.",hidden:"This is the mic-drop ending of the Sermon on the Mount. Both builders HEAR Jesus' words \u2014 the only difference is one acts on them. Hearing, agreeing, even admiring Jesus changes nothing. Building does.",fact:"The twist: from the street, both houses look identical. Same design, same walls, maybe the sand house went up faster and cheaper. The only difference is invisible \u2014 until the storm. Jesus ends his most famous sermon by saying: the storm is coming for everyone; your foundation is the only variable.",quiz:{q:"What's the ONLY difference between the two builders?",opts:["One heard Jesus' words and one didn't","One acted on the words; both heard them","One had better materials","One avoided the storm"],a:1,why:"Both hear. One builds on it. Same storm, different ending."}}],Yc=[{id:"decoder",name:"Decoder",desc:"Cracked what a parable is",icon:"\u2317"},{id:"digger",name:"Digger",desc:"Uncovered 3 hidden layers",icon:"\u25C6"},{id:"scholar",name:"Deep Diver",desc:"Completed 4 parables",icon:"\u2726"},{id:"master",name:"Parable Master",desc:"Completed every parable",icon:"\u265B"},{id:"streak",name:"On Fire",desc:"5 correct answers in a row",icon:"\u26A1"}];function Np({xp:e,level:t}){let n=Math.min(100,e%100/100*100);return(0,w.jsxs)("div",{style:{display:"flex",alignItems:"center",gap:10},children:[(0,w.jsxs)("div",{style:{fontFamily:O.display,fontSize:11,color:g.gold,background:g.card,border:`1px solid ${g.goldDim}`,borderRadius:6,padding:"4px 8px",whiteSpace:"nowrap"},children:["LV ",t]}),(0,w.jsx)("div",{style:{flex:1,height:8,background:g.card,borderRadius:99,overflow:"hidden"},children:(0,w.jsx)("div",{style:{width:`${n}%`,height:"100%",background:`linear-gradient(90deg, ${g.goldDim}, ${g.gold})`,borderRadius:99,transition:"width .5s cubic-bezier(.2,.8,.2,1)"}})}),(0,w.jsxs)("div",{style:{fontFamily:O.body,fontSize:12,color:g.inkDim,whiteSpace:"nowrap"},children:[e," XP"]})]})}function Lp({msg:e}){return e?(0,w.jsx)("div",{style:{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:g.gold,color:"#1A1512",fontFamily:O.display,fontSize:13,padding:"10px 18px",borderRadius:10,boxShadow:"0 8px 30px rgba(0,0,0,.5)",zIndex:50,animation:"popIn .25s cubic-bezier(.2,.8,.2,1)"},children:e}):null}function ou({tag:e,surface:t,hidden:n,color:r,revealed:l,onReveal:o}){return(0,w.jsxs)("button",{onClick:o,style:{display:"block",width:"100%",textAlign:"left",background:l?g.bg2:g.
