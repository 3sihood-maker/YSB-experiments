<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baba — attitude of gratitude</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0a0806;color:#f3ece0;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}

  /* ---------- the page, on a table ---------- */
  #room{position:fixed;inset:0;overflow:hidden;touch-action:none;
    background:radial-gradient(ellipse 90% 70% at 50% 42%,#241a12 0%,#120d09 55%,#070505 100%)}
  #stage{position:absolute;left:0;top:0;width:1419px;height:1920px;transform-origin:0 0;
    will-change:transform;box-shadow:0 60px 160px rgba(0,0,0,.85),0 6px 26px rgba(0,0,0,.6)}
  #bg{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* the words sit above the paper but must not swallow a touch meant for it */
  .el,.tx{position:absolute;will-change:transform,opacity}
  .tx{z-index:3;pointer-events:none}
  .el{z-index:2}
  #note{z-index:4}
  .el img,.tx img{display:block;width:100%;height:auto;pointer-events:none}
  /* every free piece hangs on its own parallax wrapper so the camera and the tilt
     can move independently of each other */
  .pw{position:absolute;inset:0;will-change:transform}

  /* the paper strips themselves are the way in: touch one and its words come up */
  .strip{position:absolute;z-index:1;cursor:pointer;border-radius:6px;
    background:radial-gradient(ellipse 60% 60% at 50% 50%,rgba(255,238,205,.5),rgba(255,226,180,0) 72%);
    opacity:0;transition:opacity .5s ease}
  .strip.waiting{animation:waiting 3.4s ease-in-out infinite}
  .strip:active{opacity:.75;transition:opacity .08s}
  @keyframes waiting{0%,100%{opacity:0}55%{opacity:.30}}
  .el{cursor:pointer;opacity:0}
  .el.in{opacity:1}
  .tx{opacity:0;transform:translateY(14px)}
  .tx.in{opacity:1;transform:none;
    transition:opacity .85s cubic-bezier(.2,.8,.3,1),transform .85s cubic-bezier(.2,.8,.3,1)}

  /* the sketch draws itself on */
  #sketch{clip-path:inset(0 100% 0 0)}
  #sketch.in{clip-path:inset(0 0 0 0);transition:clip-path 1.5s cubic-bezier(.35,.7,.3,1),opacity .5s ease}

  /* a warm pool of light that follows whatever the camera is reading */
  #lamp{position:absolute;pointer-events:none;mix-blend-mode:soft-light;opacity:0;
    background:radial-gradient(ellipse 52% 58% at 50% 50%,rgba(255,238,205,.95),rgba(255,214,150,.35) 45%,transparent 72%);
    transition:opacity 1.2s ease}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.10;mix-blend-mode:overlay}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:7;
    background:radial-gradient(ellipse 76% 64% at 50% 48%,transparent 42%,rgba(0,0,0,.42) 84%,rgba(0,0,0,.72) 100%)}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:8}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:12;pointer-events:none;
    font-family:"Trebuchet MS",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #hud>*{pointer-events:auto}
  .btn{position:absolute;display:flex;align-items:center;justify-content:center;gap:8px;
    border:1px solid rgba(255,226,180,.22);background:rgba(28,18,10,.72);color:#f6e6cd;
    border-radius:999px;cursor:pointer;font:inherit;font-size:12.5px;letter-spacing:.14em;
    text-transform:uppercase;transition:opacity .35s ease,transform .18s ease}
  .btn:active{transform:scale(.94)}
  #next{right:16px;bottom:calc(22px + env(safe-area-inset-bottom));padding:14px 24px;font-weight:700;
    color:#231607;border-color:transparent;background:linear-gradient(100deg,#ffd79a,#f0b463)}
  #prev{left:16px;bottom:calc(22px + env(safe-area-inset-bottom));width:50px;height:50px;padding:0;
    font-size:18px;opacity:0}
  #prev.on{opacity:1}
  #snd{right:16px;top:calc(14px + env(safe-area-inset-top));width:42px;height:42px;padding:0;font-size:15px}
  #dots{position:absolute;left:16px;top:calc(20px + env(safe-area-inset-top));display:flex;gap:6px}
  #dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,226,180,.26);transition:.4s}
  #dots i.on{background:#ffd79a;transform:scale(1.6)}
  #cue{position:absolute;left:0;right:0;bottom:calc(90px + env(safe-area-inset-bottom));text-align:center;
    font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#ffdca6;opacity:0;
    text-shadow:0 2px 14px #000;transition:opacity .7s ease;padding:0 80px}
  #cue.on{opacity:.8}

  /* the invitation to close your eyes */
  #invite{position:absolute;left:50%;transform:translate(-50%,16px);bottom:calc(88px + env(safe-area-inset-bottom));
    padding:15px 26px;border-radius:999px;border:1px solid rgba(255,226,180,.4);cursor:pointer;
    background:rgba(20,13,7,.85);color:#ffe3b4;font:inherit;font-size:13.5px;letter-spacing:.1em;
    opacity:0;pointer-events:none;transition:opacity .7s ease,transform .7s cubic-bezier(.2,1.4,.4,1)}
  #invite.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

  /* ---------- listening in the dark ---------- */
  #dark{position:fixed;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:36px;transition:opacity 1.1s ease}
  #dark.on{opacity:1;pointer-events:auto}
  #dline{font-size:clamp(17px,4.6vw,23px);line-height:1.6;max-width:22em;color:#e9dcc6;
    opacity:0;transition:opacity .9s ease}
  #dline.on{opacity:1}
  #dsub{margin-top:22px;font-family:"Trebuchet MS",sans-serif;font-size:11.5px;letter-spacing:.24em;
    text-transform:uppercase;color:#8d7c63;opacity:0;transition:opacity .9s ease}
  #dsub.on{opacity:1}
  /* the one thing you can see: a soft mark that swells with how close the sound is */
  #ear{width:132px;height:132px;margin-bottom:34px;border-radius:50%;opacity:0;
    border:1px solid rgba(255,226,180,.16);transition:opacity .9s ease;
    display:flex;align-items:center;justify-content:center}
  #ear.on{opacity:1}
  #ear i{display:block;width:14px;height:14px;border-radius:50%;background:#ffd79a;
    box-shadow:0 0 30px rgba(255,215,154,.8);transform:scale(.4);opacity:.5}
  #dskip{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:none;border:0;color:#6d6152;font-family:"Trebuchet MS",sans-serif;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;cursor:pointer;opacity:0;transition:opacity 1s ease}
  #dskip.on{opacity:.8}

  /* ---------- what are you thankful for ---------- */
  #ask{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    z-index:14;width:min(92vw,420px);opacity:0;pointer-events:none;
    transition:opacity .8s ease,transform .8s cubic-bezier(.2,.9,.3,1)}
  #ask.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #ask form{display:flex;gap:8px;background:rgba(24,16,9,.92);border:1px solid rgba(255,226,180,.3);
    border-radius:14px;padding:8px 8px 8px 14px}
  #ask input{flex:1;background:none;border:0;outline:none;color:#f6e6cd;font:inherit;font-size:16px}
  #ask input::placeholder{color:#8d7c63}
  #ask button{border:0;border-radius:9px;padding:10px 15px;cursor:pointer;font-weight:700;font-size:13px;
    color:#231607;background:linear-gradient(100deg,#ffd79a,#f0b463)}
  /* the answer, written onto the page itself */
  #note{position:absolute;opacity:0;transform:translateY(26px) rotate(-1.4deg) scale(.94);
    padding:26px 30px 30px;background:linear-gradient(168deg,#f2e7cd,#e6d6b4 62%,#dcc8a2);
    box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.35);
    transition:opacity .9s ease,transform .9s cubic-bezier(.2,.9,.3,1);pointer-events:none}
  #note.on{opacity:1;transform:rotate(-1.4deg) scale(1)}
  #note b{display:block;font-size:38px;line-height:1.3;color:#2a1c0c;font-weight:400}
  #note i{display:block;font-style:normal;font-size:18px;letter-spacing:.18em;text-transform:uppercase;
    color:#8a6634;margin-bottom:12px;font-family:"Trebuchet MS",sans-serif}

  /* ---------- the end ---------- */
  #end{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;padding:34px;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(14,9,5,.90),rgba(6,4,3,.97));
    transition:opacity 1s ease}
  #end.on{opacity:1;pointer-events:auto}
  #end h2{font-size:clamp(27px,7.4vw,42px);line-height:1.1;color:#ffe3b4;font-weight:400}
  #end p{margin-top:16px;font-size:clamp(15px,4vw,18px);line-height:1.6;max-width:20em;color:#cdbba0}
  #end .again{margin-top:28px;padding:14px 26px;border-radius:999px;border:1px solid rgba(255,226,180,.34);
    background:none;color:#ffdca6;font:inherit;font-size:13px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}

  @media (prefers-reduced-motion:reduce){
    .tx.in,#sketch.in,#invite,#ask,#note,#dark,#end{transition-duration:.01ms!important}
  }
</style>
</head>

/* box is in page units: what the camera should frame. pad keeps it off the edges. */
var STOPS=[
  {grp:[0,1],  box:null,                       cue:'Touch the paper'},
  {grp:[2],    box:[210,430,640,140],          cue:'Touch the paper'},
  {grp:[3],    box:[210,545,660,300],          cue:'Touch the paper', ears:true},
  {grp:[4],    box:[400,955,680,300],          cue:'Touch the paper'},
  {grp:[5],    box:[360,1350,680,230],         cue:'Touch the paper'},
  {grp:[6],    box:[360,1630,700,300],         cue:'Your turn', asks:true},
  {grp:[],     box:null,                       ends:true}
];
var at=-1, cam={x:0,y:0,k:1}, camTo={x:0,y:0,k:1}, camAnim=null;
var vw=0,vh=0,fitK=1;

function fit(){
  vw=innerWidth; vh=innerHeight;
  /* the whole page, laid on the table with room to breathe */
  fitK=Math.min(vw/SW,vh/SH)*0.92;
  var c=document.getElementById('fx');
  c.width=vw*devicePixelRatio; c.height=vh*devicePixelRatio;
  c.style.width=vw+'px'; c.style.height=vh+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  frame(at<0?0:at,true);
}
/* work out where the camera has to sit to put `box` in the middle of the screen */
function target(i){
  var s=STOPS[i];
  if(!s||!s.box) return {k:fitK,x:(vw-SW*fitK)/2,y:(vh-SH*fitK)/2};
  var b=s.box, padX=vw*0.045, padY=vh*0.10;
  /* a line of text wants a comfortable measure — filling a 1440px window with one
     paragraph makes it harder to read, not easier */
  var measure=Math.min(vw-padX*2,780);
  var k=Math.min(measure/b[2],(vh-padY*2)/b[3]);
  k=Math.max(fitK,Math.min(k,fitK*4.2));            /* never further out than the full page */
  /* sit the block a little above the middle, where the eye goes first */
  var x=vw/2-(b[0]+b[2]/2)*k, y=vh*0.46-(b[1]+b[3]/2)*k;
  /* A page lying on a table may show a sliver of table at an edge — that reads better
     than forcing it to cover the screen, which shoves the block you are reading into a
     corner whenever it sits near the top or bottom of the page. */
  var slackX=vw*0.06, slackY=vh*0.08;
  if(SW*k>vw) x=Math.max(vw-SW*k-slackX,Math.min(slackX,x)); else x=(vw-SW*k)/2;
  if(SH*k>vh) y=Math.max(vh-SH*k-slackY,Math.min(slackY,y)); else y=(vh-SH*k)/2;
  return {k:k,x:x,y:y};
}
function applyCam(){
  stage.style.transform='translate('+cam.x.toFixed(2)+'px,'+cam.y.toFixed(2)+'px) scale('+cam.k.toFixed(5)+')';
}
function frame(i,instant){
  var t=target(i);
  if(instant||reduce){ cam.x=t.x;cam.y=t.y;cam.k=t.k; applyCam(); return; }
  var f={x:cam.x,y:cam.y,k:cam.k}, t0=performance.now(), ms=1250;
  if(camAnim)cancelAnimationFrame(camAnim);
  /* centre moves straight, zoom moves in log space — otherwise the middle of the
     move swoops away and comes back */
  var fc=[(vw/2-f.x)/f.k,(vh/2-f.y)/f.k], tc=[(vw/2-t.x)/t.k,(vh/2-t.y)/t.k];
  (function step(now){
    var u=Math.min(1,(now-t0)/ms), e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    var k=Math.exp(Math.log(f.k)+(Math.log(t.k)-Math.log(f.k))*e);
    var cx=fc[0]+(tc[0]-fc[0])*e, cy=fc[1]+(tc[1]-fc[1])*e;
    cam.k=k; cam.x=vw/2-cx*k; cam.y=vh/2-cy*k;
    applyCam();
    if(u<1)camAnim=requestAnimationFrame(step);
  })(t0);
}

/* the pool of light sits over whatever we are reading */
function moveLamp(i){
  var s=STOPS[i];
  if(!s||!s.box){ lamp.style.opacity=0; return; }
  var b=s.box, g=Math.max(b[2],b[3])*0.95;
  lamp.style.cssText='position:absolute;pointer-events:none;mix-blend-mode:soft-light;'+
    'left:'+(b[0]+b[2]/2-g)+'px;top:'+(b[1]+b[3]/2-g*0.72)+'px;width:'+(g*2)+'px;height:'+(g*1.44)+'px;'+
    'background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(255,240,210,.95),rgba(255,214,150,.3) 48%,transparent 72%);'+
    'transition:opacity 1.2s ease;opacity:.85';
}

function show(i){
  at=Math.max(0,Math.min(STOPS.length-1,i));
  var s=STOPS[at];
  audio();
  frame(at); moveLamp(at);
  /* reveal this stop's words, one line after another */
  var n=0;
  txEls.forEach(function(e,j){
    if(s.grp.indexOf(TX[j].grp)<0) return;
    if(e.classList.contains('in')) return;
    e.style.transitionDelay=(n*0.22)+'s'; n++;
    setTimeout(function(){ e.classList.add('in'); paper(); }, reduce?0:420+n*220);
  });
  dotsPaint(); setTimeout(strips,900);
  prevB.classList.toggle('on',at>0);
  cue.textContent=s.cue||''; cue.classList.toggle('on',!!s.cue);
  invite.classList.toggle('on',!!s.ears&&!earsDone);
  ask.classList.toggle('on',!!s.asks);
  if(s.asks)setTimeout(function(){document.getElementById('askin').focus();},700);
  endEl.classList.toggle('on',!!s.ends);
  nextB.style.opacity=s.ends?0:'';
  nextB.style.pointerEvents=s.ends?'none':'';
  if(s.ends)S.warm();
}
function dotsPaint(){
  for(var i=0;i<dots.children.length;i++)dots.children[i].classList.toggle('on',i===at);
}
STOPS.forEach(function(){dots.appendChild(document.createElement('i'));});

/* A strip can hold more than one beat — the questions share a sheet — so touching it
   again brings up what is still to come on that paper. */
Array.prototype.forEach.call(document.querySelectorAll('.strip'),function(el){
  el.addEventListener('click',function(ev){
    ev.stopPropagation(); audio(); AC.resume&&AC.resume();
    if(earsOn)return;
    var want=+el.dataset.s;
    if(want===1&&shown(2)&&!shown(3))want=2;      /* second question, same sheet */
    S.paper(); motes(ev.clientX,ev.clientY,9);
    el.animate([{opacity:.7},{opacity:0}],{duration:700,easing:'ease-out'});
    show(want);
  });
});
function shown(g){
  for(var i=0;i<TX.length;i++) if(TX[i].grp===g) return txEls[i].classList.contains('in');
  return false;
}
/* a slow breath of light on any sheet still holding words back */
function strips(){
  Array.prototype.forEach.call(document.querySelectorAll('.strip'),function(el){
    var st=STOPS[+el.dataset.s], left=false;
    if(st)st.grp.forEach(function(g){ if(!shown(g))left=true; });
    if(+el.dataset.s===1&&!shown(3))left=true;
    el.classList.toggle('waiting',left);
  });
}

/* ---------- the pieces that are not glued down ---------- */
var els=[['sketch',.5],['photo',.85],['heart',.7]];
els.forEach(function(e,i){
  var el=document.getElementById(e[0]);
  setTimeout(function(){ el.classList.add('in'); },reduce?0:700+i*420);
  el.addEventListener('click',function(ev){
    ev.stopPropagation(); audio();
    if(e[0]==='sketch'){ S.bell(); el.animate([{transform:'rotate(0)'},{transform:'rotate(-4deg) scale(1.04)'},
        {transform:'rotate(0)'}],{duration:620,easing:'cubic-bezier(.3,1.5,.4,1)'}); }
    else if(e[0]==='photo'){ S.dust(); el.animate([{transform:'translateY(0) rotate(0)'},
        {transform:'translateY(-10px) rotate(1.2deg)'},{transform:'translateY(0) rotate(0)'}],
        {duration:760,easing:'cubic-bezier(.3,1.3,.4,1)'}); motes(ev.clientX,ev.clientY,16); }
    else { S.chime(); el.animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],
        {duration:640,easing:'cubic-bezier(.3,1.6,.4,1)'}); motes(ev.clientX,ev.clientY,12); }
  });
});

/* ---------- tilt / pointer parallax ---------- */
var px=0,py=0,tx=0,ty=0;
var PL=[['bg',-0.5],['sketch',1.1],['photo',1.6],['heart',1.3]];
function loop(){
  px+=(tx-px)*.06; py+=(ty-py)*.06;
  for(var i=0;i<PL.length;i++){
    var e=document.getElementById(PL[i][0]);
    if(e)e.style.transform='translate3d('+(px*PL[i][1]*13).toFixed(2)+'px,'+(py*PL[i][1]*11).toFixed(2)+'px,0)';
  }
  drawFX(); requestAnimationFrame(loop);
}
addEventListener('pointermove',function(e){tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2;});
addEventListener('deviceorientation',function(e){
  if(e.gamma==null)return;
  tx=Math.max(-1,Math.min(1,e.gamma/26)); ty=Math.max(-1,Math.min(1,(e.beta-45)/26));
});

/* ---------- specks of dust in the lamp light ---------- */
var fx=document.getElementById('fx'),ctx=fx.getContext('2d'),parts=[];
function motes(x,y,n){
  for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-.5)*2.4,vy:-Math.random()*2.2-.3,
    l:1,r:1+Math.random()*2.2});
}
function drawFX(){
  ctx.clearRect(0,0,vw,vh);
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=.028; p.vx*=.99; p.l-=.012;
    if(p.l<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=p.l*.8; ctx.fillStyle='#ffe6b8';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* ============ sound, all of it synthesised ============ */
var AC=null,MAS=null,muted=false,amb=null;
function audio(){
  if(AC)return AC;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  MAS=AC.createGain(); MAS.gain.value=.9; MAS.connect(AC.destination);
  var n=AC.createBufferSource(),b=AC.createBuffer(1,AC.sampleRate*4,AC.sampleRate),c=b.getChannelData(0);
  for(var i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*.5;
  n.buffer=b; n.loop=true;
  var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=210;
  amb=AC.createGain(); amb.gain.value=.05;
  n.connect(lp);lp.connect(amb);amb.connect(MAS);n.start();
  return AC;
}
function ok(){return AC&&!muted;}
function nz(dur,gain,f0,f1,q,dest){
  if(!ok())return;
  var b=AC.createBuffer(1,Math.max(1,AC.sampleRate*dur),AC.sampleRate),c=b.getChannelData(0);
  for(var i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);
  var s=AC.createBufferSource(); s.buffer=b;
  var f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=q||1;
  f.frequency.setValueAtTime(f0,AC.currentTime);
  f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),AC.currentTime+dur);
  var g=AC.createGain(); g.gain.setValueAtTime(gain,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  s.connect(f);f.connect(g);g.connect(dest||MAS);s.start();
}
function tn(type,f0,f1,dur,gain,dest){
  if(!ok())return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),AC.currentTime+dur);
  g.gain.setValueAtTime(gain,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  o.connect(g);g.connect(dest||MAS);o.start();o.stop(AC.currentTime+dur+.02);
}
var S={
  paper:function(){nz(.20,.13,2200,900,.9);},
  /* the ball in blind soccer has bells inside it */
  bell:function(dest,vol){
    if(!ok())return;
    var v=vol||1;
    [2540,3120,3870,4610].forEach(function(f,i){
      tn('sine',f*(1+(Math.random()-.5)*.02),f*.985,.20+i*.02,(.055-i*.009)*v,dest);
    });
    nz(.05,.05*v,4200,2600,3,dest);
  },
  dust:function(){nz(.34,.10,1500,420,.8);},
  chime:function(){tn('sine',880,1320,.5,.10);tn('sine',1320,1760,.45,.05);},
  kick:function(){tn('sine',150,52,.24,.4);nz(.11,.24,1700,320,1.2);},
  thud:function(){tn('sine',96,44,.22,.2);},
  warm:function(){tn('sine',196,294,1.5,.10);tn('sine',294,392,1.7,.06);}
};
function paper(){S.paper();}

/* ============ listening in the dark ============ */
/* The ball circles you. Nothing to look at — you tap when it sounds like it is
   straight ahead. This is the part of Baba's page that cannot be read, only heard. */
var dark=document.getElementById('dark'),dline=document.getElementById('dline'),
    dsub=document.getElementById('dsub'),ear=document.getElementById('ear'),
    earDot=ear.querySelector('i'),dskipB=document.getElementById('dskip');
var earsDone=false,earsOn=false,pan=null,panT=0,ballT=null,tries=0,earRAF=null;

function say(t,s){
  dline.classList.remove('on'); dsub.classList.remove('on');
  setTimeout(function(){
    dline.textContent=t; dsub.textContent=s||'';
    dline.classList.add('on'); if(s)dsub.classList.add('on');
  },reduce?0:420);
}
function startEars(){
  if(earsOn)return; earsOn=true; tries=0;
  audio(); AC.resume&&AC.resume();
  invite.classList.remove('on');
  dark.classList.add('on'); dskipB.classList.add('on');
  amb.gain.setTargetAtTime(.02,AC.currentTime,.5);
  say('Close your eyes.','Listening');
  setTimeout(function(){
    say('The ball has bells inside it. Tap the moment it sounds straight ahead of you.','Tap when it is in front');
    ear.classList.add('on');
    pan=AC.createStereoPanner?AC.createStereoPanner():null;
    var out=pan||AC.createGain(); if(pan)pan.connect(MAS); else out.connect(MAS);
    panT=Math.random()*6.28;
    var ring=function(){
      panT+=0.42;
      var p=Math.sin(panT);
      if(pan)pan.pan.setTargetAtTime(p,AC.currentTime,.05);
      S.bell(out,1-Math.abs(p)*0.45);
      var near=1-Math.abs(p);
      earDot.style.transform='scale('+(0.4+near*1.5).toFixed(2)+')';
      earDot.style.opacity=(0.35+near*0.65).toFixed(2);
      ballT=setTimeout(ring,300);
    };
    ring();
    dark.addEventListener('click',guess);
  },reduce?60:2600);
}
function guess(e){
  if(e&&e.target===dskipB)return;
  if(!ballT)return;
  var p=Math.sin(panT), near=Math.abs(p)<0.30;
  tries++;
  if(near||tries>=4){
    clearTimeout(ballT); ballT=null;
    dark.removeEventListener('click',guess);
    S.kick();
    ear.classList.remove('on');
    say(near?'That is how Baba plays. Every player on the pitch is finding that sound.'
            :'Harder than it looks. Baba does this at full speed, with ten other players around him.',
        'Blind soccer');
    setTimeout(endEars,reduce?200:3900);
  }else{
    S.thud();
    say(['Not quite. Listen again.','Still off to one side.','Wait for it to come round.'][Math.min(tries-1,2)],
        'Tap when it is in front');
  }
}
function endEars(){
  clearTimeout(ballT); ballT=null; earsOn=false; earsDone=true;
  dark.removeEventListener('click',guess);
  dark.classList.remove('on'); dskipB.classList.remove('on');
  dline.classList.remove('on'); dsub.classList.remove('on'); ear.classList.remove('on');
  if(AC)amb.gain.setTargetAtTime(.05,AC.currentTime,.6);
  invite.classList.remove('on');
}
invite.addEventListener('click',function(e){e.stopPropagation();startEars();});
dskipB.addEventListener('click',function(e){e.stopPropagation();endEars();});

/* ============ what are you thankful for ============ */
document.querySelector('#ask form').addEventListener('submit',function(e){
  e.preventDefault();
  var v=document.getElementById('askin').value.trim();
  if(!v)return;
  audio();
  note.querySelector('b').textContent='“'+v+'”';
  note.classList.add('on');
  S.chime(); motes(vw/2,vh*0.6,26);
  ask.classList.remove('on');
  cue.classList.remove('on');           /* the note says it now — no need for a caption too */
  document.getElementById('askin').blur();
});

/* ============ getting about ============ */
function go(d){ if(earsOn)return; show(at+d); }
nextB.onclick=function(e){e.stopPropagation();go(1);};
prevB.onclick=function(e){e.stopPropagation();go(-1);};
document.getElementById('again').onclick=function(){
  txEls.forEach(function(e){e.classList.remove('in');e.style.transitionDelay='';});
  note.classList.remove('on'); document.getElementById('askin').value='';
  earsDone=false; at=-1; show(0);
};
document.getElementById('snd').onclick=function(e){
  e.stopPropagation(); muted=!muted; this.textContent=muted?'🔇':'🔊';
  if(MAS)MAS.gain.setTargetAtTime(muted?0:.9,AC.currentTime,.05);
  if(!muted){audio();AC.resume&&AC.resume();}
};
room.addEventListener('click',function(e){
  if(earsOn)return;
  audio(); AC.resume&&AC.resume();
  if(e.target.closest('.el'))return;
  motes(e.clientX,e.clientY,7); S.paper();
});
var sx=0,sy=0,st=0;
room.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;st=Date.now();});
room.addEventListener('pointerup',function(e){
  var dx=e.clientX-sx,dy=e.clientY-sy;
  if(Date.now()-st>700)return;
  if(Math.abs(dy)>60&&Math.abs(dy)>Math.abs(dx)){go(dy<0?1:-1);return;}
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1);
});
addEventListener('keydown',function(e){
  if(document.activeElement===document.getElementById('askin'))return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go(-1);}
  if(e.key==='Escape'&&earsOn)endEars();
});
addEventListener('resize',fit);

/* a whisper of film grain, drawn once */
(function(){
  var c=document.createElement('canvas'); c.width=c.height=140;
  var x=c.getContext('2d'),d=x.createImageData(140,140);
  for(var i=0;i<d.data.length;i+=4){var v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  x.putImageData(d,0,0);
  document.getElementById('grain').style.background='url('+c.toDataURL()+')';
})();

fit(); loop(); show(0); strips();
</script>
</body>
</html>
