<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speed Lights</title>
<meta name="color-scheme" content="dark">
<style>
  :root{ --bg:#030824; }
  :root:not([data-theme="light"]){ --bg:#030824; }
  :root[data-theme="dark"]{ --bg:#030824; }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);}
  body{background:radial-gradient(120% 90% at 0% 50%,#0b2a7a 0%,#050c33 40%,#12051c 100%);}
  #field{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none;}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<script>
(()=>{
'use strict';
const cv=document.getElementById('field');
const gl=cv.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){return;} // CSS gradient remains as fallback

// ---------- seeded RNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(20260918);
const gauss=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*v);};

// ---------- shaders ----------
const BG_VS=[
'attribute vec2 aP;',
'void main(){gl_Position=vec4(aP,0.,1.);}'
].join('\n');

const BG_FS=[
'precision highp float;',
'uniform vec2 uRes,uO,uPtr;',
'uniform float uTime,uAspect,uPortrait;',
'float ln(float d,float w){return 1.-smoothstep(w,w*2.4,abs(d));}',
'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
'void main(){',
'  vec2 f=gl_FragCoord.xy/uRes;',
'  float A=uAspect;',
'  vec2 p=(f*2.-1.)*vec2(A,1.);',
'  float px=2./uRes.y;',
'  bool P=uPortrait>.5;',
// base: ink navy on the left, near-black plum on the right
'  vec3 col=mix(vec3(.010,.032,.115),vec3(.030,.008,.045),smoothstep(-A,A*.9,p.x));',
'  col*=mix(1.,.55,smoothstep(.1,-1.1,p.y));',
'  col+=vec3(.50,.03,.12)*.20*exp(-length(p-vec2(A*.85,.8))*1.25);',
'  col+=vec3(.12,.10,.48)*.16*exp(-length(p-vec2(0.,-.35))*1.4);',
// abstract sport layer (parallax + slow drift)
'  vec2 m=p-uPtr*.035+vec2(sin(uTime*.05),cos(uTime*.043))*.02;',
'  float L=0.;',
// running-track lanes
'  vec2 tc=P?vec2(-.15,-2.1):vec2(-A*.05,-2.45);',
'  float r=length(m-tc);',
'  float q=(r-1.3)/.105;',
'  if(q>-.5&&q<8.5){float d=(fract(q+.5)-.5)*.105;L+=ln(d,px*.7)*.9;}',
// ball with seams
'  vec2 bc=P?vec2(.1,.58):vec2(A*.6,.42);',
'  float br=P?.34:.52;',
'  float an=uTime*.035;',
'  vec2 b=mat2(cos(an),-sin(an),sin(an),cos(an))*(m-bc);',
'  float inside=1.-smoothstep(br-px,br+px,length(b));',
'  L+=ln(length(b)-br,px*.8);',
'  L+=inside*(ln(b.x,px*.7)+ln(b.y,px*.7)+ln(length(b-vec2(br*1.25,0.))-br*.78,px*.7)+ln(length(b+vec2(br*1.25,0.))-br*.78,px*.7));',
// centre circle + halfway line + spot
'  vec2 cc=P?vec2(-.12,-.62):vec2(-A*.52,.66);',
'  float cr=P?.24:.33;',
'  L+=ln(length(m-cc)-cr,px*.7);',
'  L+=ln(m.x-cc.x,px*.7)*smoothstep(1.2,.25,abs(m.y-cc.y));',
'  L+=1.-smoothstep(.010,.010+px*2.,length(m-cc));',
'  col+=vec3(.55,.72,1.)*L*(P?.038:.055);',
// floodlight bank
'  vec2 fl=P?vec2(-.25,.93):vec2(A*.08,.9);',
'  for(int i=0;i<6;i++){',
'    for(int j=0;j<2;j++){',
'      vec2 lp=fl+vec2(float(i)*.055,float(j)*.05);',
'      float d=length(m-lp);',
'      col+=vec3(.75,.85,1.)*(.035*exp(-d*14.)+.35*(1.-smoothstep(.006,.006+px*1.5,d))*.35);',
'    }',
'  }',
// vanishing-point glow
'  float od=length(p-uO);',
'  col+=vec3(.25,.55,1.)*.55*exp(-od*2.6)+vec3(.85,.93,1.)*.9*exp(-od*24.);',
// vignette + grain
'  col*=1.-.38*smoothstep(.55,1.6,length(p/vec2(A,1.)));',
'  col+=(hash(gl_FragCoord.xy+fract(uTime)*97.)-.5)*.014;',
'  gl_FragColor=vec4(col,1.);',
'}'
].join('\n');

const ST_VS=[
'precision highp float;',
'attribute vec2 aTS;',
'attribute vec4 aSeed;',
'uniform float uTime,uAspect,uR,uRot,uRib,uWS,uPull,uTh0,uTh1;',
'uniform vec2 uO,uPtr;',
'varying float vT,vS,vTw;',
'varying vec4 vSeed;',
'vec2 bz(vec2 a,vec2 b,vec2 c,float t){float k=1.-t;return k*k*a+2.*k*t*b+t*t*c;}',
'vec2 crv(float t,float th){',
'  vec2 d1=vec2(cos(uRot*.6),sin(uRot*.6));',
'  return bz(uO,uO+d1*uR*uPull,uO+uR*vec2(cos(th),sin(th)),t);',
'}',
'void main(){',
'  float t=aTS.x;float u=aSeed.x;',
'  float th=mix(uTh0,uTh1,u)+uRot+.045*sin(uTime*.23+aSeed.y*6.283)+uPtr.y*.12*(u-.35);',
'  vec2 p=crv(t,th);',
'  vec2 d=normalize(crv(min(t+.003,1.),th)-crv(max(t-.003,0.),th)+1e-6);',
'  vec2 n=vec2(-d.y,d.x);',
'  float wav=sin(t*(5.+aSeed.z*4.)-uTime*(1.2+aSeed.w)+aSeed.y*6.283);',
'  p+=n*wav*t*(uRib>.5?.05:.016);',
'  float w;float tw=1.;',
'  if(uRib>.5){',
'    tw=cos(t*3.2-uTime*.8*(.8+aSeed.z*.4)+aSeed.y*6.283);',
'    w=(.05+.06*aSeed.w)*(.2+t*1.1)*(.16+.84*abs(tw));',
'  }else{',
'    w=(.0022+.0055*aSeed.w)*(.3+t*1.5)*3.5;',
'  }',
'  p+=n*aTS.y*w*uWS;',
'  vT=t;vS=aTS.y;vTw=abs(tw);vSeed=aSeed;',
'  gl_Position=vec4(p.x/uAspect,p.y,0.,1.);',
'}'
].join('\n');

const ST_FS=[
'precision highp float;',
'uniform float uPhase,uRib;',
'varying float vT,vS,vTw;',
'varying vec4 vSeed;',
'vec3 pal(float u){',
'  vec3 c=mix(vec3(1.,.74,.18),vec3(.10,.80,1.),smoothstep(.04,.14,u));',
'  c=mix(c,vec3(.16,.36,1.),smoothstep(.28,.44,u));',
'  c=mix(c,vec3(.56,.26,1.),smoothstep(.46,.6,u));',
'  c=mix(c,vec3(1.,.22,.76),smoothstep(.64,.78,u));',
'  c=mix(c,vec3(1.,.10,.16),smoothstep(.8,.96,u));',
'  return c;',
'}',
'void main(){',
'  vec3 c=pal(vSeed.x);',
'  float t0=vSeed.z*.28*(1.-uRib);',
'  float fade=smoothstep(t0,t0+.12,vT)*(1.-smoothstep(.8,1.,vT));',
'  float v=vS;',
'  if(uRib<.5){',
'    float core=exp(-v*v*38.);',
'    float halo=exp(-v*v*4.5)*.28;',
'    float s=fract(vT*(1.2+vSeed.y*1.8)-uPhase*(.35+vSeed.w*.55)+vSeed.z*7.);',
'    float pulse=pow(s,9.)*1.8;',
'    float I=(.09+.17*vSeed.w+pulse*.9)*fade;',
'    vec3 hot=mix(c,vec3(1.),.6*core*pulse/(1.+pulse));',
'    gl_FragColor=vec4(hot*(core*1.15+halo)*I,1.);',
'  }else{',
'    float a=abs(v);',
'    float edge=smoothstep(1.,.8,a);',
'    float b=v-.35*sin(vT*6.-uPhase*.7+vSeed.y*6.);',
'    float sheen=.07+.35*pow(a,5.)+.45*exp(-b*b*14.);',
'    float bright=1.+(1.-vTw)*1.4;',
'    gl_FragColor=vec4(c*sheen*edge*bright*fade*1.25,1.);',
'  }',
'}'
].join('\n');

function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const k=gl.getActiveUniform(p,i).name;u[k]=gl.getUniformLocation(p,k);}return{p,u};}

const bg=prog(BG_VS,BG_FS);
const st=prog(ST_VS,ST_FS);

// full-screen triangle
const bgBuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bgBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);

// ---------- strip geometry ----------
function strips(seeds,segs){
  const nv=seeds.length*(segs+1)*2;
  const ts=new Float32Array(nv*2),sd=new Float32Array(nv*4),idx=new Uint16Array(seeds.length*segs*6);
  let v=0,k=0;
  seeds.forEach(s=>{
    const base=v;
    for(let i=0;i<=segs;i++){
      const t=i/segs;
      for(const side of[-1,1]){ts[v*2]=t;ts[v*2+1]=side;sd.set(s,v*4);v++;}
    }
    for(let i=0;i<segs;i++){const a=base+i*2;idx.set([a,a+1,a+2,a+1,a+3,a+2],k);k+=6;}
  });
  const b1=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b1);gl.bufferData(gl.ARRAY_BUFFER,ts,gl.STATIC_DRAW);
  const b2=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b2);gl.bufferData(gl.ARRAY_BUFFER,sd,gl.STATIC_DRAW);
  const bi=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bi);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
  return{b1,b2,bi,count:idx.length};
}

const small=Math.min(innerWidth,innerHeight)<700;
const NSTREAK=small?200:320;
const CLUSTERS=[.2,.36,.52,.64,.76,.9];
const streakSeeds=[];
for(let i=0;i<NSTREAK;i++){
  let u=rnd()<.45?rnd():CLUSTERS[(rnd()*CLUSTERS.length)|0]+gauss()*.05;
  u=Math.min(1,Math.max(0,u));if(u<.25&&rnd()<.35)u=.25+rnd()*.5;
  streakSeeds.push([u,rnd(),rnd(),Math.pow(rnd(),1.6)]);
}
const ribbonSeeds=[[.22,.1,.3,.6],[.4,.55,.7,.3],[.55,.8,.2,.8],[.66,.25,.9,.5],[.76,.65,.4,.9],[.86,.4,.6,.4],[.3,.9,.1,.7]]
  .slice(0,small?5:7);
const streaks=strips(streakSeeds,48);
const ribbons=strips(ribbonSeeds,120);

// ---------- state ----------
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let dpr=Math.min(devicePixelRatio||1,2),W=0,H=0,aspect=1;
const ptr={x:0,y:0,tx:0,ty:0,lx:null,ly:null};
let boost=0,speed=1,phase=0,time=0;

function resize(){
  W=Math.max(1,Math.round(innerWidth*dpr));H=Math.max(1,Math.round(innerHeight*dpr));
  cv.width=W;cv.height=H;aspect=W/H;gl.viewport(0,0,W,H);
}
addEventListener('resize',resize);resize();

function onMove(x,y){
  ptr.tx=x/innerWidth*2-1;ptr.ty=-(y/innerHeight*2-1);
  if(ptr.lx!==null){boost=Math.min(2.2,boost+Math.hypot(x-ptr.lx,y-ptr.ly)/Math.max(innerWidth,innerHeight)*6);}
  ptr.lx=x;ptr.ly=y;
}
addEventListener('pointermove',e=>onMove(e.clientX,e.clientY),{passive:true});
addEventListener('pointerdown',e=>{ptr.lx=e.clientX;ptr.ly=e.clientY;boost=Math.min(2.2,boost+.8);},{passive:true});

function bindStrip(g){
  gl.bindBuffer(gl.ARRAY_BUFFER,g.b1);const a1=gl.getAttribLocation(st.p,'aTS');gl.enableVertexAttribArray(a1);gl.vertexAttribPointer(a1,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,g.b2);const a2=gl.getAttribLocation(st.p,'aSeed');gl.enableVertexAttribArray(a2);gl.vertexAttribPointer(a2,4,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,g.bi);
}

// adaptive resolution
let slow=0,fast=0;
function tune(dt){
  if(dt>0.024){slow++;fast=0;}else if(dt<0.014){fast++;slow=0;}else{slow=Math.max(0,slow-1);}
  if(slow>40&&dpr>.6){dpr=Math.max(.6,dpr-.15);slow=0;resize();}
  if(fast>240&&dpr<Math.min(devicePixelRatio||1,2)){dpr=Math.min(Math.min(devicePixelRatio||1,2),dpr+.1);fast=0;resize();}
}

let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  tune(dt);
  const rate=reduce?.35:1;
  ptr.x+=(ptr.tx-ptr.x)*Math.min(1,dt*2.5);ptr.y+=(ptr.ty-ptr.y)*Math.min(1,dt*2.5);
  boost*=Math.exp(-dt*1.6);
  speed+=((1+boost)-speed)*Math.min(1,dt*4);
  time+=dt*rate;phase+=dt*rate*speed;

  const portrait=aspect<.9;
  const O=portrait?[-aspect*1.02,-.08+ptr.y*.05]:[-aspect*.92,.1+ptr.y*.07];
  const R=portrait?2.3:2*aspect+.6;
  const rot=portrait?.2:0;

  gl.disable(gl.BLEND);
  gl.useProgram(bg.p);
  gl.bindBuffer(gl.ARRAY_BUFFER,bgBuf);
  const ap=gl.getAttribLocation(bg.p,'aP');gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
  gl.uniform2f(bg.u.uRes,W,H);gl.uniform2f(bg.u.uO,O[0],O[1]);gl.uniform2f(bg.u.uPtr,ptr.x,ptr.y);
  gl.uniform1f(bg.u.uTime,time);gl.uniform1f(bg.u.uAspect,aspect);gl.uniform1f(bg.u.uPortrait,portrait?1:0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.disableVertexAttribArray(ap);

  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  gl.useProgram(st.p);
  gl.uniform1f(st.u.uTime,time);gl.uniform1f(st.u.uPhase,phase);gl.uniform1f(st.u.uAspect,aspect);
  gl.uniform1f(st.u.uR,R);gl.uniform1f(st.u.uRot,rot);gl.uniform2f(st.u.uO,O[0],O[1]);gl.uniform2f(st.u.uPtr,ptr.x,ptr.y);
  gl.uniform1f(st.u.uWS,portrait?.8:1);gl.uniform1f(st.u.uPull,portrait?.3:.55);gl.uniform1f(st.u.uTh0,portrait?-2.1:-2.05);gl.uniform1f(st.u.uTh1,portrait?1.05:.5);

  gl.uniform1f(st.u.uRib,1);bindStrip(ribbons);gl.drawElements(gl.TRIANGLES,ribbons.count,gl.UNSIGNED_SHORT,0);
  gl.uniform1f(st.u.uRib,0);bindStrip(streaks);gl.drawElements(gl.TRIANGLES,streaks.count,gl.UNSIGNED_SHORT,0);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
