<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMX Rider — sticker loop</title>
<!--
  ============================================================================
  BMX RIDER  ·  2D sticker cut out of the video, as a looping sprite cycle
  ============================================================================
  14 frames lifted from the clip (a nose-manual bounce that loops back on
  itself), green screen keyed out, white sticker edge kept intact.

  Usage anywhere in a page:
      <bmx-rider></bmx-rider>
      <bmx-rider h="220" fps="24" flip></bmx-rider>

  Attributes
      h      height in px (default 300)
      fps    frames per second (default 24 = the speed it was filmed at)
      flip   present = rides the other way
      paused present = holds on one frame
      shadow present = drops a soft ground shadow under the sticker

  In JS:  el.setAttribute('paused',''), el.removeAttribute('paused')

  Transparent throughout — nothing but the rider is drawn.
  Self-contained: the sprite sheet is embedded, no network calls.
  Add ?bare=1 to the URL for just the rider on a transparent page.
  ============================================================================
-->
<style>
/* ---- the component ---------------------------------------------------- */
bmx-rider{
  --frames:14;
  --ratio:0.84;              /* frame width ÷ height */
  --h:300px;
  --fps:24;
  display:inline-block;
  width:calc(var(--h) * var(--ratio));
  height:var(--h);
  background-image:var(--bmx-sheet);
  background-repeat:no-repeat;
  background-size:calc(var(--h) * var(--ratio) * var(--frames)) var(--h);
  background-position-x:0;
  animation:bmx-ride calc(14 / var(--fps) * 1s) steps(14) infinite;
  will-change:background-position;
}
@keyframes bmx-ride{
  from{ background-position-x:0 }
  to  { background-position-x:calc(var(--h) * var(--ratio) * var(--frames) * -1) }
}
bmx-rider[paused]{ animation-play-state:paused }
bmx-rider[flip]{ transform:scaleX(-1) }
bmx-rider[shadow]{ filter:drop-shadow(0 calc(var(--h) * .02) calc(var(--h) * .025) rgba(0,0,0,.28)) }
@media (prefers-reduced-motion:reduce){
  bmx-rider{ animation:none }
}

/* ---- demo page only (delete everything below when you lift the component) */
html,body{margin:0;height:100%}
body{
  background:transparent;
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#24303a;display:flex;flex-direction:column;
}
body.bare{display:block}
body.bare .ui,body.bare .hint{display:none}
.stagewrap{flex:1;display:flex;align-items:center;justify-content:center;gap:40px;padding:24px;min-height:50vh;position:relative}
.stagewrap[data-bg="checks"]{
  background-color:#fff;
  background-image:linear-gradient(45deg,#e3e8ec 25%,transparent 25%),linear-gradient(-45deg,#e3e8ec 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e3e8ec 75%),linear-gradient(-45deg,transparent 75%,#e3e8ec 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;
}
.stagewrap[data-bg="white"]{background:#fff}
.stagewrap[data-bg="dark"]{background:#16202a}
.stagewrap[data-bg="photo"]{background:linear-gradient(#8fd9ff,#cdeeff 60%,#8fbf5a 60%,#6ea345)}
body.bare .stagewrap{background:none;padding:0;min-height:0;display:block}
.hint{position:absolute;left:14px;bottom:10px;font-size:12px;color:#8494a1}
.stagewrap[data-bg="dark"] .hint,.stagewrap[data-bg="photo"] .hint{color:#e8f1f7}
.ui{background:#f4f6f8;border-top:1px solid #dde3e8;padding:14px 18px 18px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row label{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#6a7b88}
input[type=range]{width:150px}
button{border:1px solid #cdd6dd;background:#fff;border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
button:hover{background:#e9eef2}
button.on{background:#16202a;color:#fff;border-color:#16202a}
.val{font-variant-numeric:tabular-nums;color:#6a7b88;font-size:12px;min-width:34px}
</style>
</head>
<body>

<div class="stagewrap" data-bg="checks" id="stage">
  <bmx-rider id="demo" h="300"></bmx-rider>
  <div class="hint">transparent background — the checks are the page, not the sticker</div>
</div>

<div class="ui">
  <div class="row">
    <button id="play" class="on">pause</button>
    <button id="flip">flip</button>
    <button id="shadow">ground shadow</button>
    <label>size</label><input type="range" id="h" min="80" max="480" value="300"><span class="val" id="hv">300</span>
    <label>fps</label><input type="range" id="fps" min="4" max="48" value="24"><span class="val" id="fpsv">24</span>
  </div>
  <div class="row">
    <label>preview on</label>
    <button data-bg="checks" class="on">transparent</button>
    <button data-bg="white">white</button>
    <button data-bg="dark">dark</button>
    <button data-bg="photo">scene</button>
  </div>
</div>

class BmxRider extends HTMLElement {
  static get observedAttributes(){ return ['h','fps']; }
  connectedCallback(){ this.style.setProperty('--bmx-sheet', BMX_SHEET); this.sync(); }
  attributeChangedCallback(){ this.sync(); }
  sync(){
    if (this.hasAttribute('h'))   this.style.setProperty('--h',   parseFloat(this.getAttribute('h')) + 'px');
    if (this.hasAttribute('fps')) this.style.setProperty('--fps', parseFloat(this.getAttribute('fps')));
  }
  play(){ this.removeAttribute('paused'); }
  pause(){ this.setAttribute('paused',''); }
}
customElements.define('bmx-rider', BmxRider);

/* ===========================================================================
   demo page wiring (safe to delete)
   =========================================================================== */
(function(){
  if (new URLSearchParams(location.search).has('bare')) document.body.classList.add('bare');
  const el = document.getElementById('demo'), stage = document.getElementById('stage');
  if(!el) return;

  const play = document.getElementById('play');
  play.onclick = ()=>{
    const paused = el.hasAttribute('paused');
    paused ? el.play() : el.pause();
    play.textContent = paused ? 'pause' : 'play';
    play.classList.toggle('on', paused);
  };
  const toggle = (id, attr) => {
    const b = document.getElementById(id);
    b.onclick = ()=>{
      el.toggleAttribute(attr);
      b.classList.toggle('on', el.hasAttribute(attr));
    };
  };
  toggle('flip','flip'); toggle('shadow','shadow');

  ['h','fps'].forEach(id=>{
    const r = document.getElementById(id), out = document.getElementById(id+'v');
    r.addEventListener('input', ()=>{ el.setAttribute(id, r.value); out.textContent = r.value; });
  });

  document.querySelectorAll('.ui [data-bg]').forEach(b=>{
    b.onclick = ()=>{
      stage.dataset.bg = b.dataset.bg;
      document.querySelectorAll('.ui [data-bg]').forEach(o=>o.classList.toggle('on', o===b));
    };
  });
})();
</script>
