<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#fff; --gold:#f2c14e; }
  *{box-sizing:border-box}
  html,body{
    margin:0; height:100%; overflow:hidden; background:#1a4a6e;
    font-family:"Archivo",system-ui,-apple-system,sans-serif;
    color:var(--ink); touch-action:none; -webkit-font-smoothing:antialiased;
  }
  canvas{position:fixed; inset:0; display:block}
  #hit{position:fixed; inset:0; z-index:2; cursor:grab}
  #hit.grabbing{cursor:grabbing}
  #hit:focus-visible{outline:2px solid var(--gold); outline-offset:-6px}

  .chrome{position:fixed; z-index:3; pointer-events:none; text-shadow:0 1px 10px rgba(6,24,38,.55)}
  #brand{
    top:max(16px,env(safe-area-inset-top)); left:0; right:0; text-align:center;
    font-size:11px; font-weight:600; letter-spacing:.34em; text-transform:uppercase;
    color:rgba(255,255,255,0.6);
  }
  #read{
    top:max(14px,env(safe-area-inset-top)); left:max(18px,env(safe-area-inset-left));
    font-variant-numeric:tabular-nums;
    background:rgba(8,26,40,0.26); border-radius:11px; padding:9px 13px 10px;
  }
  #read b{display:block; font-size:26px; font-weight:800; line-height:1; letter-spacing:-0.01em}
  #read span{
    display:block; margin-top:4px; font-size:10px; font-weight:600; letter-spacing:.2em;
    text-transform:uppercase; color:rgba(255,255,255,0.55);
  }
  #hint{
    bottom:calc(18px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center;
    font-size:11px; font-weight:500; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(255,255,255,0.5);
  }
  #hint b{color:var(--gold); font-weight:700}
  @media (max-width:620px){
    #brand{display:none}
    #read b{font-size:21px}
    #hint{bottom:calc(76px + env(safe-area-inset-bottom))}
  }

  #walk{
    position:fixed; z-index:4; right:max(18px,env(safe-area-inset-right));
    bottom:calc(18px + env(safe-area-inset-bottom));
    font:800 13px/1 "Archivo",system-ui,sans-serif; letter-spacing:.22em; text-transform:uppercase;
    color:#14301f; background:#e8dc9a; border:0; border-radius:999px;
    padding:15px 26px; cursor:pointer; box-shadow:0 8px 28px rgba(10,40,30,.35);
    transition:background .2s ease, transform .12s ease;
  }
  #walk:hover{background:#f4ecbb}
  #walk:active{transform:translateY(1px)}
  #walk[aria-pressed="true"]{background:#fff}
  #walk:focus-visible{outline:2px solid #fff; outline-offset:3px}

  #boot{
    position:fixed; inset:0; z-index:9; display:grid; place-items:center;
    background:#1a4a6e; text-align:center; padding:28px; transition:opacity .8s ease;
    font-size:11px; font-weight:600; letter-spacing:.3em; text-transform:uppercase;
    color:rgba(255,255,255,0.55);
  }
  #boot.gone{opacity:0; pointer-events:none}
  #fallback{
    position:fixed; inset:0; z-index:20; display:none; place-items:center;
    background:#1a4a6e; padding:32px; text-align:center;
    font-size:14px; line-height:1.6; color:rgba(255,255,255,.8);
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="hit" tabindex="0" role="application"
     aria-label="An archery range seen from an arrow on the string. Drag to look, shoot to loose the arrow down the field into the centre target."></div>

<div class="chrome" id="brand">Youth Sports Bible</div>
<div class="chrome" id="read"><b>48 m</b><span>to the targets</span></div>
<div class="chrome" id="hint">Drag to look &middot; <b>shoot</b> down the range</div>
<button id="walk" type="button" aria-pressed="false">Shoot</button>

<div id="boot">Setting up the range&hellip;</div>
<div id="fallback">This page needs WebGL. Try a different browser or device.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

const boot = document.getElementById('boot');
if (!window.THREE){ document.getElementById('fallback').style.display='grid'; boot.classList.add('gone'); return; }

/* ============================================================
   The range.

   World Archery shoots 70 m at 122 cm faces. The reference is a poster,
   and its targets are several times that: ten of them fill about three
   quarters of the frame. Matching the picture beats matching the rulebook,
   so the line is at 42 m, the faces are 2.4 m, the lanes are 2.7 m so the
   butts nearly touch, and the shot is a 46-degree lens rather than a wide
   one — it is the long lens that stacks the hedge, the hills and the sky
   into flat bands the way the artwork does. One unit is one metre.
   ============================================================ */
const RANGE   = 42;                 // shooting line to target line
const BUTTS   = 9;                  // odd, so there is a real centre butt to fly the red flag over
const LANE_W  = 3.00;
const FIELD_W = BUTTS*LANE_W;       // 27 m of mown grass
const HALF_W  = FIELD_W/2;
const FACE_R  = 1.20;               // 2.4 m faces
const HFOV    = 46;                 // degrees across, held fixed whatever the screen
const HEDGE_Z = RANGE + 9;          // the back hedge stands behind the butts
const SIDE_X  = HALF_W + 8.5;
const MID     = (BUTTS - 1)/2;      // the centre butt — index 4 of nine
const MY_LANE = MID;                // you shoot at it
const laneX   = -HALF_W + (MY_LANE + 0.5)*LANE_W;   // dead centre
const FACE_Y  = FACE_R + 0.62;      // height of the centre of the gold

/* ============================================================
   Palette — lifted off the reference. Cool, evening, and very flat:
   almost everything is unlit, because the moment a real light lands
   on this it stops looking like the poster and starts looking like
   a game.
   ============================================================ */
const C = {
  skyTop:   '#2c7cc0', skyMid: '#63a9d6', skyHaze: '#c3e0ef',
  cloud:    '#d3e8f5', cloudLo:'#bcdcee',
  hillFar:  '#8fc3c2', hillMid:'#6daea6', hillNear:'#559a8d',
  treeDk:   '#2b6a64', treeMd: '#3d8277', treeLt:  '#57a089',
  hedgeDk:  '#12304f', hedgeMd:'#1b4067', hedgeLt: '#24537d',
  fence:    '#b7cbd7', fencePost:'#93adbd',
  grassNr:  '#3f7f69', grassMd:'#53a07f', grassFr: '#69ae88',
  faceWhite:'#f3f6f7', faceBlack:'#2a2a2e', faceBlue:'#37a7da',
  faceRed:  '#e23c31', faceGold: '#f7cf3d',
  boss:     '#d9bd82', bossRim: '#c3a165',
  woodLt:   '#a9835a', woodDk:  '#7d5e3d',
  pole:     '#dbe5eb', board:   '#f0c93f', boardInk:'#1f2d38',
  flagRed:  '#d8443c', flagYel: '#f2cd47',
  shaft:    '#262c34', vane:    '#b4322b', vaneLt:  '#e8ebee', nock:'#e0692b',
  tuftDk:   '#2b5f51'
};

/* ============================================================
   Scene
   ============================================================ */
const canvas = document.getElementById('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
} catch(e){
  document.getElementById('fallback').style.display='grid'; boot.classList.add('gone'); return;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
const FOG_NEAR = 150, FOG_FAR = 620;
scene.fog = new THREE.Fog(new THREE.Color(C.skyHaze).getHex(), FOG_NEAR, FOG_FAR);

const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 3000);

const basic = (c, opts) => new THREE.MeshBasicMaterial(Object.assign({color:c}, opts||{}));

/* ---------- a little value noise, for grass wear and hedge tops ---------- */
function hash(n){ const s = Math.sin(n)*43758.5453; return s - Math.floor(s); }
function vnoise(x){
  const i = Math.floor(x), f = x - i;
  const u = f*f*(3 - 2*f);
  return hash(i)*(1 - u) + hash(i + 1)*u;
}
function fbm(x){
  return vnoise(x)*0.55 + vnoise(x*2.13 + 7.1)*0.3 + vnoise(x*4.7 + 19.3)*0.15;
}

/* ============================================================
   Sky — a gradient dome, with the clouds drawn into it rather than
   hung in front of it. They are long flat lozenges in the artwork, and
   a lozenge is cheaper to describe in a shader than to build.
   ============================================================ */
(function sky(){
  const CLOUDS = [
    // azimuth, elevation, half-width, half-height, softness, strength
    // elevations kept low: the shot is a long lens, so anything much above
    // ten degrees is off the top of the frame and the sky reads as empty
    [-0.30, 0.150, 0.150, 0.0150, 0.55, 0.95],
    [-0.13, 0.196, 0.080, 0.0100, 0.60, 0.72],
    [ 0.09, 0.112, 0.190, 0.0135, 0.55, 0.90],
    [ 0.27, 0.168, 0.110, 0.0095, 0.60, 0.68],
    [-0.52, 0.088, 0.145, 0.0115, 0.55, 0.78],
    [ 0.46, 0.070, 0.120, 0.0090, 0.60, 0.58]
  ];
  let decl = '', body = '';
  CLOUDS.forEach((c, i) => {
    decl += `const vec4 K${i} = vec4(${c[0].toFixed(3)}, ${c[1].toFixed(3)}, ${c[2].toFixed(3)}, ${c[3].toFixed(4)});\n`;
    body += `  s += cloud(az, el, K${i}, ${c[4].toFixed(2)})*${c[5].toFixed(2)};\n`;
  });

  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uTop:{value:new THREE.Color(C.skyTop)},
      uMid:{value:new THREE.Color(C.skyMid)},
      uHaze:{value:new THREE.Color(C.skyHaze)},
      uCloud:{value:new THREE.Color(C.cloud)},
      uCloudLo:{value:new THREE.Color(C.cloudLo)}
    },
    vertexShader:`varying vec3 vD;
      void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      varying vec3 vD;
      uniform vec3 uTop, uMid, uHaze, uCloud, uCloudLo;
      ${decl}
      /* a lozenge: wide, shallow, soft at the ends, with a lumpy top edge so
         it does not read as a stretched ellipse */
      float cloud(float az, float el, vec4 k, float soft){
        float dx = (az - k.x)/k.z;
        float lump = 0.60 + 0.40*sin(dx*7.0) + 0.22*sin(dx*13.7 + 1.9);
        float dy = (el - k.y)/(k.w*max(lump, 0.25));
        float r = dx*dx + dy*dy;
        return 1.0 - smoothstep(1.0 - soft, 1.0, r);
      }
      void main(){
        float h = clamp(vD.y, -1.0, 1.0);
        vec3 c = mix(uHaze, uMid, smoothstep(-0.01, 0.22, h));
        c = mix(c, uTop, smoothstep(0.16, 0.80, h));

        float az = atan(vD.x, vD.z)/3.14159265;     // −1 … 1
        float el = h;
        float s = 0.0;
      ${body}
        s = clamp(s, 0.0, 1.0);
        // a touch darker underneath, as the artwork has them
        vec3 cc = mix(uCloudLo, uCloud, smoothstep(0.0, 0.45, s));
        c = mix(c, cc, s*0.92);
        gl_FragColor = vec4(c, 1.0);
      }`
  });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(1400, 48, 28), m);
  dome.frustumCulled = false;
  scene.add(dome);
  window.__SKY = dome;
})();

/* ============================================================
   Distant hills — three silhouettes, each a strip whose top edge is a
   sum of sines. Paler and lower as they go back, so the depth reads
   without any haze doing the work for them.
   ============================================================ */
function ridge(z, baseY, amp, freq, phase, colour, width){
  const N = 220, pos = [], idx = [];
  for (let i=0;i<=N;i++){
    const t = i/N, x = (t - 0.5)*width;
    const u = t*freq + phase;
    const y = baseY + amp*(0.55*Math.sin(u*6.28) + 0.30*Math.sin(u*15.1 + 1.7)
                          + 0.15*Math.sin(u*31.3 + 4.2));
    pos.push(x, -40, z, x, y, z);
  }
  for (let i=0;i<N;i++){
    const a = i*2;
    idx.push(a, a+2, a+1, a+1, a+2, a+3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  // DoubleSide, because which way a strip of triangles happens to wind is
  // not worth reasoning about for something that is only ever a silhouette
  const m = new THREE.Mesh(g, basic(colour, {fog:false, side:THREE.DoubleSide}));
  m.frustumCulled = false;
  scene.add(m);
  return m;
}
/* Beyond the back hedge, not behind the camera: you are looking down the
   range at +z, so open country has to be laid out ahead of you. */
ridge(HEDGE_Z + 900, 68, 26, 2.6, 0.0, C.hillFar,  2600);
ridge(HEDGE_Z + 640, 40, 20, 3.4, 2.3, C.hillMid,  2000);
ridge(HEDGE_Z + 430, 20, 13, 4.1, 5.7, C.hillNear, 1500);

/* ============================================================
   Trees — flat clumps on a billboard. Round blobs in three greens with
   a darker underside, which is how the artwork draws them.
   ============================================================ */
function treeTexture(){
  const W = 256, H = 256, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const blob = (x, y, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill(); };
  g.fillStyle = '#3a5f55';
  g.fillRect(W*0.46, H*0.62, W*0.08, H*0.30);          // trunk
  const puffs = [
    [128, 150, 62, C.treeDk], [ 86, 128, 46, C.treeDk], [172, 132, 48, C.treeDk],
    [128, 100, 52, C.treeMd], [ 96,  96, 34, C.treeMd], [164,  98, 36, C.treeMd],
    [120,  74, 34, C.treeLt], [150,  80, 26, C.treeLt], [ 98,  78, 22, C.treeLt]
  ];
  for (const [x,y,r,col] of puffs) blob(x, y, r, col);
  return new THREE.CanvasTexture(c);
}
const TREE_TEX = treeTexture();
const trees = [];
function tree(x, z, h, tint){
  const w = h*0.95;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({map:TREE_TEX, transparent:true, depthWrite:false,
                                 color:tint || 0xffffff, fog:false}));
  m.position.set(x, h*0.46, z);
  scene.add(m); trees.push(m);
  return m;
}
(function scatterTrees(){
  // a line of them just behind the back hedge, then progressively paler
  // groups further out, so the field reads as sitting in open country
  for (let i=0;i<34;i++){
    const x = -220 + hash(i*3.1)*440;
    if (Math.abs(x) < 11) continue;      // keep the sightline to the butts clear
    tree(x, HEDGE_Z + 12 + hash(i*7.7)*34, 8 + hash(i*5.3)*8, 0xffffff);
  }
  for (let i=0;i<20;i++)
    tree(-620 + hash(100 + i*2.7)*1240, HEDGE_Z + 150 + hash(200 + i*4.1)*160,
         16 + hash(300 + i*1.9)*14, 0xcfe3de);
  for (let i=0;i<16;i++)
    tree(-1000 + hash(400 + i*3.3)*2000, HEDGE_Z + 400 + hash(500 + i*5.9)*220,
         26 + hash(600 + i*2.1)*18, 0xa9cfd0);
})();

/* ============================================================
   The ground.

   One shader: a depth ramp, the mowing stripes down the range, a pale
   band inside each hedge where the mower turns, and enough wear to stop
   thirty-four metres of flat green reading as a sheet of paper.
   ============================================================ */
(function ground(){
  const g = new THREE.PlaneGeometry(2400, 2400, 1, 1);
  g.rotateX(-Math.PI/2);
  const m = new THREE.Mesh(g, new THREE.ShaderMaterial({
    fog: true,
    uniforms: Object.assign({
      uNear:{value:new THREE.Color(C.grassNr)},
      uMid: {value:new THREE.Color(C.grassMd)},
      uFar: {value:new THREE.Color(C.grassFr)},
      uLane:{value:LANE_W}, uHalf:{value:HALF_W}, uRange:{value:RANGE},
      uHedgeZ:{value:HEDGE_Z}, uSideX:{value:SIDE_X}
    }, THREE.UniformsLib.fog),
    vertexShader:`
      varying vec3 vW; varying float vFogDepth;
      void main(){
        vW = position;
        vec4 mv = modelViewMatrix*vec4(position, 1.0);
        vFogDepth = -mv.z;
        gl_Position = projectionMatrix*mv;
      }`,
    fragmentShader:`
      varying vec3 vW; varying float vFogDepth;
      uniform vec3 uNear, uMid, uFar, fogColor;
      uniform float uLane, uHalf, uRange, uHedgeZ, uSideX, fogNear, fogFar;

      float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453); }
      float n2(vec2 p){
        vec2 i = floor(p), f = fract(p), u = f*f*(3.0 - 2.0*f);
        return mix(mix(h2(i), h2(i + vec2(1,0)), u.x),
                   mix(h2(i + vec2(0,1)), h2(i + vec2(1,1)), u.x), u.y);
      }
      float fbm2(vec2 p){
        return n2(p)*0.55 + n2(p*2.17 + 3.1)*0.28 + n2(p*4.6 + 9.7)*0.17;
      }

      void main(){
        vec2 p = vW.xz;
        float t = clamp(p.y/uRange, -0.4, 1.6);

        vec3 c = mix(uNear, uMid, smoothstep(-0.15, 0.55, t));
        c = mix(c, uFar, smoothstep(0.55, 1.25, t));

        // outside the mown field it goes flatter and cooler
        float inField = 1.0 - smoothstep(uHalf, uHalf + 3.0, abs(p.x));
        c = mix(c*0.92, c, inField);

        // mowing stripes, up and down the range
        float lane = (p.x + uHalf)/uLane;          // 0 at the left edge of butt 1
        float parity = mod(floor(lane), 2.0);
        float edge = abs(fract(lane) - 0.5);
        float soft = smoothstep(0.0, 0.045, edge);
        c *= 1.0 + (parity - 0.5)*0.115*soft*inField;

        // the mower's turning strip inside each hedge
        float turn = smoothstep(uHalf - 4.5, uHalf - 1.5, abs(p.x))*inField;
        c = mix(c, c*1.10, turn);

        // wear: broad patches, then a finer graze
        float w = fbm2(p*0.045) - 0.5;
        c *= 1.0 + w*0.10;
        c *= 1.0 + (fbm2(p*0.55) - 0.5)*0.045;

        // a scuffed track down the middle of the range, as the artwork has
        float trackC = smoothstep(3.4, 0.6, abs(p.x + 2.0))*smoothstep(-6.0, 16.0, p.y)
                     * smoothstep(uRange + 4.0, uRange - 18.0, p.y);
        c *= 1.0 - trackC*0.05*(0.4 + fbm2(p*0.32));

        // the hedge lays a shadow at its foot
        float hs = smoothstep(uHedgeZ, uHedgeZ - 7.0, p.y)*smoothstep(uHedgeZ - 16.0, uHedgeZ - 8.0, p.y);
        c *= 1.0 - hs*0.10;
        float ss = smoothstep(uSideX, uSideX - 6.0, abs(p.x));
        c *= 1.0 - ss*0.06;

        // the shooting line, and the waiting line ten metres behind it
        float sl = smoothstep(0.10, 0.05, abs(p.y))*inField;
        float wl = smoothstep(0.09, 0.045, abs(p.y + 10.0))*inField;
        c = mix(c, vec3(0.93, 0.96, 0.97), max(sl*0.55, wl*0.34));

        float f = smoothstep(fogNear, fogFar, vFogDepth);
        gl_FragColor = vec4(mix(c, fogColor, f), 1.0);
      }`
  }));
  m.position.y = 0;
  m.frustumCulled = false;
  scene.add(m);
})();

/* ============================================================
   Hedges.

   A strip with a noisy top edge and a leafy mottle, which is the whole
   trick: a box reads as a wall, and a wall is what the first attempt at
   this looked like. Vertex colours carry the top-to-bottom gradient.
   ============================================================ */
function hedgeTexture(){
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, S, S);
  for (let i=0;i<2600;i++){
    const x = Math.random()*S, y = Math.random()*S, r = 3 + Math.random()*9;
    const v = 128 + (Math.random() - 0.45)*70;
    g.fillStyle = 'rgb(' + (v|0) + ',' + (v|0) + ',' + (v|0) + ')';
    g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const HEDGE_TEX = hedgeTexture();

/* axis: 'x' runs along world x at fixed z, 'z' runs along world z at fixed x */
function hedge(axis, from, to, at, depth, height, seed, faceSign){
  const N = Math.max(24, Math.round(Math.abs(to - from)/1.4));
  const pos = [], col = [], uv = [], idx = [];
  const dk = new THREE.Color(C.hedgeDk), md = new THREE.Color(C.hedgeMd), lt = new THREE.Color(C.hedgeLt);
  const len = Math.abs(to - from);

  for (let i=0;i<=N;i++){
    const t = i/N, s = from + (to - from)*t;
    const top = height*(0.94 + 0.085*fbm(seed + t*len*0.32))
              + 0.13*Math.sin(t*len*2.1 + seed) + 0.07*Math.sin(t*len*5.7 + seed*1.7);
    const put = (x, y, z, col3, u, v) => {
      pos.push(x, y, z); col.push(col3.r, col3.g, col3.b); uv.push(u, v);
    };
    const near = md.clone().lerp(dk, 0.72);
    const crown = md.clone().lerp(lt, 0.38);
    if (axis === 'x'){
      put(s, 0,   at,              near, t*len/6, 0);            // foot, front
      put(s, top, at,              crown, t*len/6, top/6);       // top, front
      put(s, top, at + depth*faceSign, lt, t*len/6, top/6 + 0.5);// top, back
    } else {
      put(at,              0,   s, near, t*len/6, 0);
      put(at,              top, s, crown, t*len/6, top/6);
      put(at + depth*faceSign, top, s, lt, t*len/6, top/6 + 0.5);
    }
  }
  for (let i=0;i<N;i++){
    const a = i*3, b = (i+1)*3;
    idx.push(a, b, a+1, a+1, b, b+1);          // the face
    idx.push(a+1, b+1, a+2, a+2, b+1, b+2);    // the top
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    vertexColors: true, map: HEDGE_TEX, side: THREE.DoubleSide
  }));
  scene.add(m);
  return m;
}

hedge('x', -SIDE_X - 2, SIDE_X + 2, HEDGE_Z, 2.6, 4.2, 3.7, 1);     // behind the butts
hedge('z', -26, HEDGE_Z + 1, -SIDE_X, 2.4, 3.2, 11.3, -1);          // left

/* a pale boundary fence behind the left hedge, as the artwork has */
(function fence(){
  /* It runs across the middle distance out to the left, past the end of
     the left hedge — a straight pale line to break up the grass, the way
     the artwork uses it. Posts and two rails, no more. */
  const Z0 = HEDGE_Z + 26, Z1 = HEDGE_Z + 40;   // it drifts a little away from us
  const X0 = -232, X1 = -SIDE_X - 7;
  const N = 30, H = 1.75;
  const at = t => ({ x: X0 + (X1 - X0)*t, z: Z0 + (Z1 - Z0)*t });

  const postG = new THREE.BoxGeometry(0.20, H, 0.20);
  const postM = basic(C.fencePost);
  for (let i=0;i<=N;i++){
    const p = at(i/N);
    const m = new THREE.Mesh(postG, postM);
    m.position.set(p.x, H/2, p.z);
    scene.add(m);
  }

  const a = at(0), b = at(1);
  const len = Math.hypot(b.x - a.x, b.z - a.z);
  const ang = Math.atan2(b.x - a.x, b.z - a.z);
  const railM = basic(C.fence);
  [H - 0.16, H*0.55].forEach(y => {
    const r = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.14, len), railM);
    r.position.set((a.x + b.x)/2, y, (a.z + b.z)/2);
    r.rotation.y = ang;
    scene.add(r);
  });
})();

/* ============================================================
   The butts — a World Archery 122 cm face on a straw boss, standing on
   the wooden tripod every international field uses, with a numbered
   board and a wind flag on a pole behind it.
   ============================================================ */
function faceTexture(){
  const S = 1024, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const R = S/2;
  const disc = (frac, col) => {
    g.fillStyle = col; g.beginPath(); g.arc(R, R, R*frac, 0, 6.283); g.fill();
  };
  /* Ten rings of equal width, two to a colour: white, black, blue, red,
     gold from the rim in, scoring 1 outside to 10 in the middle. Band k
     runs from radius (1 − k/10) to (0.9 − k/10), so filling largest disc
     first lays them all down in one pass. */
  const cols = [C.faceWhite, C.faceWhite, C.faceBlack, C.faceBlack,
                C.faceBlue,  C.faceBlue,  C.faceRed,   C.faceRed,
                C.faceGold,  C.faceGold];
  g.fillStyle = C.faceWhite; g.fillRect(0, 0, S, S);
  for (let k=0;k<10;k++) disc(1 - k*0.1, cols[k]);

  // the dividing lines: dark everywhere except the one inside the black,
  // where a dark line on a dark ring would simply vanish
  g.lineWidth = R*0.0030;
  for (let k=1;k<10;k++){
    const f = 1 - k*0.1;
    g.strokeStyle = (Math.abs(f - 0.7) < 0.01) ? '#f3f6f7' : 'rgba(30,30,34,0.85)';
    g.beginPath(); g.arc(R, R, R*f, 0, 6.283); g.stroke();
  }
  // the inner ten, and the cross in the middle
  g.strokeStyle = 'rgba(30,30,34,0.85)';
  g.beginPath(); g.arc(R, R, R*0.05, 0, 6.283); g.stroke();
  g.beginPath();
  g.moveTo(R - R*0.028, R); g.lineTo(R + R*0.028, R);
  g.moveTo(R, R - R*0.028); g.lineTo(R, R + R*0.028);
  g.stroke();

  // ring numbers along the horizontal, right of the gold, as the face has them
  const ink = ['#22222a','#22222a','#f3f6f7','#f3f6f7','#f3f6f7',
               '#f3f6f7','#f3f6f7','#f3f6f7','#22222a','#22222a'];
  g.font = '600 ' + Math.round(R*0.046) + 'px Arial, Helvetica, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let k=0;k<10;k++){
    g.fillStyle = ink[k];
    g.fillText(String(k + 1), R + R*(0.95 - k*0.1), R);
  }
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  return t;
}
const FACE_TEX = faceTexture();

/* A numbered board above each butt. Numbers, no words. */
function boardTexture(n){
  const W = 192, H = 136, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = C.board; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(28,40,50,0.35)'; g.lineWidth = 6;
  g.strokeRect(3, 3, W - 6, H - 6);
  g.fillStyle = C.boardInk;
  g.font = 'bold 96px Arial, Helvetica, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(String(n), W/2, H/2 + 5);
  return new THREE.CanvasTexture(c);
}

/* A box between two points — the tripod is easier to describe as struts
   than as a pile of rotations worked out by hand. */
const _up = new THREE.Vector3(0, 1, 0);
function strut(ax, ay, az, bx, by, bz, w, col){
  const a = new THREE.Vector3(ax, ay, az), b = new THREE.Vector3(bx, by, bz);
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, len, w), basic(col));
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(_up, d.normalize());
  return m;
}

/* ---------- flags ----------
   A plane with a travelling wave in the vertex shader. Cheap, and the only
   way a flat-shaded flag reads as cloth is if the shading follows the wave,
   so the same sine is handed to the fragment stage as a varying. */
const FLAG_GEO = (function(){
  const g = new THREE.PlaneGeometry(0.66, 0.42, 18, 6);
  g.translate(0.33, 0, 0);                 // hinge at the pole
  return g;
})();
const flagMats = [], flags = [];
function flagMaterial(colour, phase){
  const m = new THREE.ShaderMaterial({
    side: THREE.DoubleSide, fog: false,
    uniforms: { uTime:{value:0}, uPhase:{value:phase}, uAmp:{value:1},
                uCol:{value:new THREE.Color(colour)} },
    vertexShader:`
      uniform float uTime, uPhase, uAmp;
      varying float vSh;
      void main(){
        vec3 p = position;
        float w = uv.x;
        float t = uTime + uPhase;
        float a = sin(w*7.5 - t*2.3);
        vSh = a;
        p.z += (a*0.055 + sin(w*14.0 - t*3.3)*0.020)*w*uAmp;
        p.y += sin(w*5.5 - t*1.9)*0.028*w*uAmp;
        p.x -= w*w*0.05*uAmp;              // it shortens a touch as it ripples
        gl_Position = projectionMatrix*modelViewMatrix*vec4(p, 1.0);
      }`,
    fragmentShader:`
      uniform vec3 uCol;
      varying float vSh;
      void main(){ gl_FragColor = vec4(uCol*(0.86 + 0.16*(0.5 + 0.5*vSh)), 1.0); }`
  });
  flagMats.push(m);
  return m;
}

const butts = [];
(function targets(){
  for (let i=0;i<BUTTS;i++){
    const x = -HALF_W + (i + 0.5)*LANE_W;
    const g = new THREE.Group();

    // the boss: a straw disc a little proud of the face all round
    const boss = new THREE.Mesh(
      new THREE.CylinderGeometry(FACE_R*1.05, FACE_R*1.05, 0.17, 44), basic(C.boss));
    boss.rotation.x = Math.PI/2;
    boss.position.set(0, FACE_Y, -0.085);
    g.add(boss);

    const rim = new THREE.Mesh(new THREE.CircleGeometry(FACE_R*1.05, 44), basic(C.bossRim));
    rim.position.set(0, FACE_Y, 0.002);
    g.add(rim);

    const face = new THREE.Mesh(new THREE.CircleGeometry(FACE_R, 72),
      new THREE.MeshBasicMaterial({map:FACE_TEX}));
    face.position.set(0, FACE_Y, 0.006);
    g.add(face);

    /* The tripod. Two legs splay forward and out, a third rakes back, and a
       bar ties the front pair — which is what stops a boss walking over in
       a crosswind, and what the stand in the reference actually is. */
    const topY = FACE_Y - FACE_R*0.52;    // they cross the bottom of the boss, and stop
    for (const sgn of [-1, 1])
      g.add(strut(sgn*0.92, 0, 0.40, sgn*0.24, topY, -0.14, 0.085, C.woodLt));
    g.add(strut(0, 0, -1.10, 0, FACE_Y - FACE_R*0.30, -0.18, 0.085, C.woodDk));
    g.add(strut(-0.70, 0.52, 0.28, 0.70, 0.52, 0.28, 0.070, C.woodDk));

    // the pole behind it, with the lane board and the wind flag
    const POLE_H = 4.45;
    const pole = new THREE.Mesh(new THREE.BoxGeometry(0.055, POLE_H, 0.055), basic(C.pole));
    pole.position.set(0, POLE_H/2, -0.62);
    g.add(pole);

    /* Looking down +z puts +x on the LEFT of the screen, so butt 0 — the one
       at the most negative x — is the rightmost one you see. Count back down
       and lane 1 lands on the left where it belongs. */
    const board = new THREE.Mesh(new THREE.PlaneGeometry(0.74, 0.52),
      new THREE.MeshBasicMaterial({map:boardTexture(BUTTS - i)}));
    board.position.set(0, 3.42, -0.585);
    g.add(board);

    const flag = new THREE.Mesh(FLAG_GEO,
      flagMaterial(i === MID ? C.flagRed : C.flagYel, i*1.37));
    flag.position.set(0.03, POLE_H - 0.30, -0.62);
    flag.rotation.y = -0.85;                // the wind swings this every frame
    g.add(flag); flags.push(flag);

    // a CircleGeometry faces +z and the archer is at −z, so the whole butt
    // turns to face down the range — which also puts the tripod behind it
    g.rotation.y = Math.PI;
    g.position.set(x, 0, RANGE);
    scene.add(g);
    butts.push({ i, group: g, face, x });
  }
})();

/* ============================================================
   The arrow. Deliberately a little stouter than a real 5 mm shaft: at
   thirty centimetres from the eye a true one is a hairline, and the shot
   is meant to read as an arrow, not as a scratch on the lens.
   ============================================================ */
const ARROW_LEN = 0.82;

/* The sun is on the left and behind you, but it is written down twice,
   because the shadow and the shading want different things from it.

   SUN places the shadow, and it has to be LOW. From an arrow's eye the
   ground is a metre and a half below the lens, so a ground point only enters
   a fifteen-degree half-frame once it is six metres ahead — and the shadow
   sits at exactly the sun's elevation below the arrow, whatever the height.
   Above about thirteen degrees it drops off the bottom of the screen
   altogether. Twelve degrees it is, with a modest azimuth so it stays inside
   the frame sideways too.

   SUN_LIGHT shades the arrow, and it has to be SIDEWAYS. A cylinder lying
   along z is shaded entirely by the light's x and y; the z part does nothing
   to it at all, and only serves to blow out the flat caps that face the
   camera — which is why the point read as a bright bolt head the first time.
   Same left-and-behind sun, carried higher and further round. */
const SUN       = new THREE.Vector3(0.13, 0.21, -0.97).normalize();
const SUN_LIGHT = new THREE.Vector3(0.80, 0.52, -0.28).normalize();

function roundedMat(hex){
  return new THREE.ShaderMaterial({
    uniforms:{ uCol:{value:new THREE.Color(hex)}, uSun:{value:SUN_LIGHT} },
    vertexShader:`
      varying vec3 vN;
      void main(){
        vN = mat3(modelMatrix)*normal;      // no scaling anywhere on the arrow
        gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.0);
      }`,
    fragmentShader:`
      uniform vec3 uCol, uSun;
      varying vec3 vN;
      void main(){
        vec3 n = normalize(vN);
        float lam = 0.5 + 0.5*dot(n, uSun);        // wrapped, so the dark side isn't flat
        float hi  = pow(max(dot(n, uSun), 0.0), 18.0);
        gl_FragColor = vec4(uCol*(0.58 + 0.80*lam) + vec3(hi*0.34), 1.0);
      }`
  });
}

/* The shadow itself — an arrow, not a smudge. Drawn as a hard silhouette
   (shaft, point, two vanes in profile, nock) and then blurred by a separable
   box blur run twice, which is close enough to a Gaussian and does not depend
   on canvas filter support. The blur eats the peak alpha, so it is normalised
   back up afterwards.

   The arrow lies along u, pointing at u = 1. Both meshes that use this have to
   be oriented so that u runs along the arrow. */
const SHADOW_TEX = (function(){
  const W = 256, H = 128, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const cy = H/2, sh = H*0.085;                 // shaft half-thickness

  g.fillStyle = '#fff';
  g.fillRect(W*0.13, cy - sh, W*0.75, sh*2);    // shaft
  g.beginPath();                                // point
  g.moveTo(W*0.86, cy - H*0.125);
  g.lineTo(W*0.995, cy);
  g.lineTo(W*0.86, cy + H*0.125);
  g.closePath(); g.fill();
  for (const q of [-1, 1]){                     // two vanes, swept back
    g.beginPath();
    g.moveTo(W*0.30, cy + q*sh*0.8);
    g.quadraticCurveTo(W*0.21, cy + q*H*0.35, W*0.085, cy + q*H*0.27);
    g.lineTo(W*0.065, cy + q*sh*0.9);
    g.closePath(); g.fill();
  }
  g.fillRect(W*0.02, cy - H*0.085, W*0.06, H*0.17);   // nock

  const img = g.getImageData(0, 0, W, H), d = img.data;
  const a = new Float32Array(W*H), t = new Float32Array(W*H);
  for (let i=0;i<W*H;i++) a[i] = d[i*4 + 3];
  const R = 7;
  const cx  = v => v < 0 ? 0 : (v > W - 1 ? W - 1 : v);
  const cyc = v => v < 0 ? 0 : (v > H - 1 ? H - 1 : v);
  for (let pass=0; pass<2; pass++){
    for (let y=0;y<H;y++) for (let x=0;x<W;x++){
      let sum = 0;
      for (let k=-R;k<=R;k++) sum += a[y*W + cx(x + k)];
      t[y*W + x] = sum/(2*R + 1);
    }
    for (let y=0;y<H;y++) for (let x=0;x<W;x++){
      let sum = 0;
      for (let k=-R;k<=R;k++) sum += t[cyc(y + k)*W + x];
      a[y*W + x] = sum/(2*R + 1);
    }
  }
  let peak = 1;
  for (let i=0;i<W*H;i++) if (a[i] > peak) peak = a[i];
  const k = 236/peak;
  for (let i=0;i<W*H;i++){
    d[i*4] = d[i*4 + 1] = d[i*4 + 2] = 255;
    d[i*4 + 3] = Math.min(255, a[i]*k);
  }
  g.putImageData(img, 0, 0);
  return new THREE.CanvasTexture(c);
})();

/* Barred red vanes, as the reference fletching has them, with a pale spine. */
const VANE_TEX = (function(){
  const W = 96, H = 48, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = C.vane; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(20,10,10,0.45)'; g.lineWidth = 5;
  for (let i=-2;i<10;i++){
    g.beginPath(); g.moveTo(i*11, H); g.lineTo(i*11 + 18, 0); g.stroke();
  }
  g.fillStyle = C.vaneLt; g.fillRect(0, H - 7, W, 7);
  return new THREE.CanvasTexture(c);
})();

function buildArrow(){
  const g = new THREE.Group();            // point at local z = 0, nock at −ARROW_LEN
  const R = 0.0085;

  const pt = new THREE.Mesh(new THREE.ConeGeometry(R*0.88, 0.11, 20), roundedMat('#1a1f26'));
  pt.rotation.x = Math.PI/2;              // apex to +z
  pt.position.z = -0.055;
  g.add(pt);

  const shaftLen = ARROW_LEN - 0.16;
  // radiusTop is the +y end, which rotateX(π/2) swings to +z — the point end
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(R*0.88, R, shaftLen, 20), roundedMat(C.shaft));
  shaft.rotation.x = Math.PI/2;
  shaft.position.z = -0.11 - shaftLen/2;
  g.add(shaft);

  const vaneGeo = new THREE.PlaneGeometry(0.125, 0.042);
  vaneGeo.translate(0, 0.042/2 + R*0.7, 0);       // stand it off the shaft
  vaneGeo.rotateY(Math.PI/2);                     // lie it along z
  for (let v=0;v<3;v++){
    const m = new THREE.Mesh(vaneGeo, new THREE.MeshBasicMaterial({
      map: VANE_TEX, side: THREE.DoubleSide
    }));
    m.rotation.z = v*2.0944;
    m.position.z = -(ARROW_LEN - 0.115);
    g.add(m);
  }

  const nock = new THREE.Mesh(new THREE.CylinderGeometry(R*1.25, R*1.1, 0.05, 16), roundedMat(C.nock));
  nock.rotation.x = Math.PI/2;
  nock.position.z = -(ARROW_LEN - 0.025);
  g.add(nock);

  return g;
}

/* The one you are riding, carried by a rig that holds the flight direction
   rather than the camera's: look around in flight and the view pans past
   the shaft instead of dragging it along, which is what turning your head
   on a moving arrow would actually do. */
const povRig = new THREE.Object3D();
scene.add(povRig);
/* The shot is a shaft running away from under the lens to a point that sits
   low in the frame, converging the way a barrel does. The drop sets how far
   down the point lands: atan(drop/ahead) below the view axis, which at these
   numbers is about seven degrees — roughly three quarters of the way down a
   landscape frame, so the whole arrow lives in the bottom quarter. It also
   has to stay under the shadow's twelve degrees, or the arrow would sit
   below its own shadow. */
const POV_AHEAD = 0.72;
let   POV_DROP  = 0.082;         // resize() sets it from the frame; see below
const povArrow = buildArrow();
povArrow.position.set(0, -POV_DROP, POV_AHEAD);
povRig.add(povArrow);

/* The shadow on the grass. Its size is a designed thing, not a measured one:
   the true shadow of a 17 mm shaft seven metres away is a hairline, so it is
   drawn at the width it needs to read as a shadow and no wider. */
const povShadow = (function(){
  const geo = new THREE.PlaneGeometry(1, 1);
  geo.rotateX(-Math.PI/2);        // lay it on the grass
  geo.rotateY(-Math.PI/2);        // and swing u round to +z, so it points down-range
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    map: SHADOW_TEX, transparent: true, opacity: 0.50,
    color: 0x102e22, depthWrite: false, fog: true
  }));
  /* Seen from eleven degrees above the grass, length down-range foreshortens
     hard: 4.6 m of shadow comes to about seven degrees of frame against
     0.52 m of width at nearly four. Anything shorter stops reading as an
     arrow and goes back to being a smudge. */
  m.scale.set(0.62, 1, 4.60);
  m.renderOrder = 2;
  m.frustumCulled = false;
  scene.add(m);
  return m;
})();
const _tip = new THREE.Vector3();
function placeShadow(heading){
  povArrow.getWorldPosition(_tip);                 // the arrow's origin is its point
  const t = _tip.y/SUN.y;                          // travel away from the sun to the ground
  povShadow.position.set(_tip.x - SUN.x*t, 0.015, _tip.z - SUN.z*t);
  povShadow.rotation.y = heading || 0;             // it lies along the line of flight
}

const stuck = [];                         // arrows already in the boss

/* ============================================================
   Foreground grass — unmown tufts behind the shooting line, which is
   what gives the picture its dark bottom edge
   ============================================================ */
(function tufts(){
  /* One tile, one tuft: about a dozen blades. Packing seventy into the tile
     and then mapping the whole tile onto a half-metre quad was the mistake
     that made the foreground look like pixel art — seventy blades cannot
     resolve across forty pixels, and alphaTest turns the mush into blocks. */
  const S = 256, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.clearRect(0, 0, S, S);
  g.strokeStyle = '#ffffff'; g.lineCap = 'round';
  for (let i=0;i<13;i++){
    const x0 = 34 + Math.random()*(S - 68);
    const lean = (Math.random() - 0.5)*74;
    const h = 110 + Math.random()*130;
    g.lineWidth = 5 + Math.random()*5;
    g.beginPath();
    g.moveTo(x0, S);
    g.quadraticCurveTo(x0 + lean*0.35, S - h*0.62, x0 + lean, S - h);
    g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);

  const NEAR_N = 1500, VERGE_N = 700, N = NEAR_N + VERGE_N;
  const pos = [], uv = [], idx = [], col = [];
  const tint = new THREE.Color();
  for (let i=0;i<N;i++){
    let x, z, near;
    if (i < NEAR_N){
      /* A dense band behind the shooting line — this is the dark bottom edge
         of the picture. It has to be dense rather than wide: at this focal
         length the bottom of the frame only reaches about three metres either
         side of the line of sight, so tufts spread over the full width of the
         field leave four or five in shot and the edge never forms. */
      x = -8.5 + ((i*0.6180339887) % 1)*17;
      z = -15.0 + hash(i*3.9 + 5)*14.5;
      near = true;
    } else {
      // and rough verges either side of the mown field, all the way down
      const j = i - NEAR_N;
      const side = (j % 2) ? 1 : -1;
      x = side*(HALF_W + 0.4 + hash(j*2.3)*(SIDE_X - HALF_W - 0.8));
      z = -14 + hash(j*4.7 + 11)*(HEDGE_Z + 12);
      near = false;
    }
    const w = (near ? 0.32 : 0.26) + hash(i*5.1)*0.24;
    const h = (near ? 0.28 : 0.18) + hash(i*7.3)*(near ? 0.32 : 0.24);
    // a little tone either way, so the fringe is a hedge of grass and not a stencil
    const k2 = 0.82 + hash(i*11.3)*0.40;
    tint.set(C.tuftDk).multiplyScalar(k2);
    // a cross of two quads, so it holds up when you look along it
    for (const rot of [0, Math.PI/2]){
      const dx = Math.cos(rot)*w/2, dz = Math.sin(rot)*w/2;
      const k = pos.length/3;
      pos.push(x - dx, 0, z - dz,  x + dx, 0, z + dz,
               x + dx, h, z + dz,  x - dx, h, z - dz);
      uv.push(0,0, 1,0, 1,1, 0,1);
      for (let q=0;q<4;q++) col.push(tint.r, tint.g, tint.b);
      idx.push(k, k+1, k+2, k, k+2, k+3);
    }
  }
  const g2 = new THREE.BufferGeometry();
  g2.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g2.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g2.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g2.setIndex(idx);
  // alphaTest rather than blending: 900 crossed quads that all write depth
  // cut cleanly against each other, where transparency would wash the
  // whole foreground into a flat translucent haze
  const mesh = new THREE.Mesh(g2, new THREE.MeshBasicMaterial({
    map: tex, alphaTest: 0.35, vertexColors: true, side: THREE.DoubleSide, fog: true
  }));
  mesh.frustumCulled = false;
  scene.add(mesh);
})();

/* ============================================================
   Riding the arrow down the range
   ============================================================ */
const EYE       = 1.62;           // standing at the line, arrow on the string
const FLY_SPEED = 13.0;
const START_S   = -6;

/* Gravity and wind, as accelerations. They are not 9.8 and they are not
   trying to be: the arrow crosses forty-eight metres in under four seconds
   here, where a real one takes two, so the constants are chosen for the size
   of the MISS they produce rather than for physics. At this flight time
   GRAV drops the shot about half a metre — four rings — and a full crosswind
   pushes it about the same sideways. Aim off, or you score sevens. */
const GRAV = 0.085;
const WIND = 0.095;

/* The wind itself: two slow sines, so it wanders instead of cycling. The
   flags are the only instrument you get, which is how a real field works. */
let wind = 0;
function windAt(t){ return 0.58*Math.sin(t*0.17) + 0.36*Math.sin(t*0.29 + 1.4); }

let phase = 'ready';              // ready → fly → stuck
let going = false, flightT = 0, ft = 0, T = 1;
let yaw = 0, restPitch = -0.012, pitch = restPitch, pitchAim = restPitch;
let shotN = 0, wobble = 0;

const camPos  = new THREE.Vector3(laneX, EYE, START_S);
const launch  = new THREE.Vector3(laneX, EYE, START_S);
const vel0    = new THREE.Vector3();
const accel   = new THREE.Vector3();
const velNow  = new THREE.Vector3();
const viewPos = new THREE.Vector3();
const viewAt  = new THREE.Vector3();
const aimPt   = new THREE.Vector3(laneX, FACE_Y, RANGE);
let aimYaw = 0, aimPitch = 0;
let stuckArrow = null, stuckBase = null;
let s = START_S;                  // kept for the readout and the debug hook

const hit = document.getElementById('hit');
const walkBtn = document.getElementById('walk');
const readOut = document.querySelector('#read b');
const readSub = document.querySelector('#read span');

function setBtn(){
  walkBtn.setAttribute('aria-pressed', going ? 'true' : 'false');
  walkBtn.textContent = phase === 'stuck' ? 'Shoot again' : 'Shoot';
}

function reset(){
  if (shotN >= SHOT_CAP){            // stuck[] holds a shadow per arrow too
    for (const a of stuck) scene.remove(a);
    stuck.length = 0; shotN = 0;
  }
  phase = 'ready'; going = false; ft = 0; flightT = 0; s = START_S;
  stuckArrow = null;
  povArrow.visible = true;
  povShadow.visible = true;
  camPos.copy(launch.set(laneX, EYE, START_S));
  aimPt.set(laneX, FACE_Y + 0.5*GRAV*Math.pow((RANGE - START_S)/FLY_SPEED, 2), RANGE);
  yaw = 0; pitch = pitchAim = restPitch;
  setBtn();
  readSub.textContent = 'to the targets';
}
const SHOT_CAP = 6;

/* Where the arrow is pointing is where it is going — before the air gets a
   say. Launch straight at the aim with the velocity that would reach it in T,
   then let gravity and the crosswind act for the whole flight; the shot lands
   at aim + ½·a·T², which is the whole game. */
function loose(){
  const D = RANGE - camPos.z;
  T  = D/FLY_SPEED;
  ft = 0;
  launch.copy(camPos);
  vel0.subVectors(aimPt, launch).divideScalar(T);
  accel.set(WIND*wind, -GRAV, 0);
  phase = 'fly'; going = true; setBtn();
}

/* A tap on the field aims: cast through the pixel onto the plane of the
   targets and shoot at whatever it meets. */
const _ray = new THREE.Raycaster();
const _ndc = new THREE.Vector2();
const TARGET_PLANE = new THREE.Plane(new THREE.Vector3(0, 0, -1), RANGE);
const _p = new THREE.Vector3();
function aimAtPixel(px, py){
  _ndc.set(px/innerWidth*2 - 1, -(py/innerHeight*2 - 1));
  _ray.setFromCamera(_ndc, camera);
  if (!_ray.ray.intersectPlane(TARGET_PLANE, _p)) return false;
  if (_p.z < camPos.z + 2) return false;
  aimPt.set(
    Math.max(-HALF_W + 0.3, Math.min(HALF_W - 0.3, _p.x)),
    Math.max(FACE_Y - FACE_R - 0.2, Math.min(FACE_Y + FACE_R + 0.9, _p.y)),
    RANGE
  );
  return true;
}

function fire(px, py){
  if (phase === 'stuck'){ reset(); return; }
  if (phase === 'fly') return;
  if (px !== undefined) aimAtPixel(px, py);
  loose();
}
walkBtn.addEventListener('click', () => fire());

function impact(pos){
  // which butt did it reach, and where on that butt
  let bi = Math.round((pos.x + HALF_W)/LANE_W - 0.5);
  bi = Math.max(0, Math.min(BUTTS - 1, bi));
  const bx = -HALF_W + (bi + 0.5)*LANE_W;
  let ox = pos.x - bx, oy = pos.y - FACE_Y;
  const r = Math.hypot(ox, oy)/FACE_R;
  const onFace = r <= 1.02;

  /* A miss carries on until it finds the turf, which is where a low one ends
     up in life too. Step the same trajectory forward rather than dropping the
     arrow straight down, so it arrives at the angle it was travelling. */
  const land = pos.clone();
  if (!onFace){
    let t = T;
    // stepped forward only a few metres past the line: a shot that goes under
    // a boss really would skip on for twenty, but an arrow lying that far
    // behind the butts is a payoff frame with nothing in it
    for (let i=0;i<400 && land.y > 0.03 && land.z < RANGE + 5; i++){
      t += 0.02;
      land.copy(launch)
          .addScaledVector(vel0, t)
          .addScaledVector(accel, 0.5*t*t);
    }
    land.y = Math.max(0.03, land.y);
  }

  const a = buildArrow();
  a.position.copy(land);
  velNow.copy(vel0).addScaledVector(accel, onFace ? T : T + 1);
  // the arrow lies along +z, so aim that axis down its own line of travel
  a.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), velNow.clone().normalize());
  if (onFace) a.translateZ(0.09);        // bury the point in the straw
  scene.add(a);
  stuck.push(a);
  stuckArrow = a;
  stuckBase = a.rotation.clone();
  wobble = 1;

  povArrow.visible = false;
  povShadow.visible = false;
  phase = 'stuck'; going = false; setBtn();

  if (onFace){
    /* The shadow the arrow throws on the face. A point p metres out from the
       boss shadows onto the cloth p*(SUN.x, SUN.y)/SUN.z away, so the whole
       arrow lays a short streak from the entry wound down and to the right —
       which is most of what makes it read as standing proud rather than
       printed on. */
    const out = ARROW_LEN - 0.08;
    const sx = -SUN.x/(-SUN.z)*out, sy = -SUN.y/(-SUN.z)*out;
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({
      map: SHADOW_TEX, transparent: true, opacity: 0.22,
      color: 0x2a2118, depthWrite: false, side: THREE.DoubleSide
    }));
    sh.scale.set(Math.hypot(sx, sy)*1.25, 0.125, 1);
    sh.position.set(bx + ox + sx*0.42, FACE_Y + oy + sy*0.42, RANGE - 0.018);
    sh.rotation.z = Math.atan2(sy, sx) + Math.PI;   // point end on the wound
    sh.renderOrder = 3;
    scene.add(sh);
    stuck.push(sh);
  }
  shotN++;

  /* Stand well round to one side and above — about fifty degrees off the
     shaft. Straight behind it, a 0.7 m arrow pointing at you foreshortens
     into a dot; square on, it stops reading as pointing at you at all. */
  const ay = onFace ? FACE_Y + oy : land.y + 0.35;
  viewPos.set(land.x - 2.60, ay + 0.98, land.z - 2.60);
  viewAt.set(land.x, ay - 0.05, land.z - 0.30);
  const d = viewAt.clone().sub(viewPos);
  aimYaw   = Math.atan2(d.x, d.z);
  aimPitch = Math.atan2(d.y, Math.hypot(d.x, d.z));

  readOut.textContent = onFace
    ? String(Math.max(1, 11 - Math.max(1, Math.ceil(r/0.1))))
    : '0';
  readSub.textContent = '';           // the arrow in the gold says the rest
}

let dragging = false, lastX = 0, lastY = 0, moved = 0, downAt = 0;
hit.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  moved = 0; downAt = performance.now();
  hit.setPointerCapture(e.pointerId); hit.classList.add('grabbing');
});
hit.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  yaw   -= dx*0.0030;
  pitch -= dy*0.0024;
  pitch = Math.max(-0.45, Math.min(0.45, pitch));
  yaw   = Math.max(-1.7, Math.min(1.7, yaw));
  pitchAim = pitch;
  lastX = e.clientX; lastY = e.clientY;
});
hit.addEventListener('pointerup', e => {
  if (dragging && moved < 9 && performance.now() - downAt < 550) fire(e.clientX, e.clientY);
  dragging = false; hit.classList.remove('grabbing');
});
hit.addEventListener('pointercancel', () => { dragging = false; hit.classList.remove('grabbing'); });

const keys = {};
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','a','d'].includes(e.key)){ keys[e.key] = true; e.preventDefault(); }
  if (e.key === ' '){ fire(); e.preventDefault(); }
});
addEventListener('keyup', e => { keys[e.key] = false; });

function resize(){
  const aspect = innerWidth/innerHeight;
  camera.aspect = aspect;
  // Hold the horizontal angle, not the vertical one. three.js sizes a camera
  // by its vertical fov, which on a phone held upright squeezes the width
  // until the nine butts are a row of pinheads. Deriving vertical from
  // horizontal keeps the shot the artwork has, portrait or landscape.
  const hHalf = THREE.Math.degToRad(HFOV)/2;
  const vFov  = 2*Math.atan(Math.tan(hHalf)/aspect)*180/Math.PI;
  camera.fov = Math.max(30, Math.min(62, vFov));
  camera.near = 0.02;                    // the shaft passes within a hand's width
  camera.updateProjectionMatrix();
  /* A tall screen buys its width back with a much taller frame, and the extra
     goes almost entirely into empty sky. Settle the view a little lower so the
     butts sit above centre instead of on it. */
  restPitch = -0.012 - Math.max(0, camera.fov - 34)/60*0.16;
  if (!dragging && phase === 'ready') pitchAim = restPitch;

  /* Keep the arrow's SHARE of the frame, not its angle. A fixed drop puts the
     point seven degrees down, which is three quarters of the way down a
     landscape frame but only half way down a portrait one, where the vertical
     angle is twice as wide. Aim for 0.44 of the half-frame — but never past
     ten degrees, because the shadow sits at a flat 11.6° whatever the screen,
     and an arrow below its own shadow looks wrong.

     The camera rests nose-down, and that was lifting the point a good way up
     the frame from where the drop alone put it, so it is added back. */
  const vHalf = THREE.Math.degToRad(camera.fov)/2;
  POV_DROP = POV_AHEAD*Math.tan(Math.min(0.44*vHalf, 0.1745) - restPitch);
  povArrow.position.y = -POV_DROP;
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);
resize();
reset();

const _look = new THREE.Vector3();
const _dir  = new THREE.Vector3();
let prev = performance.now(), clock = 0;
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min((now - prev)/1000, 0.05); prev = now;
  clock += dt;

  wind = windAt(clock);
  for (let i=0;i<flagMats.length;i++){
    flagMats[i].uniforms.uTime.value = clock;
    flagMats[i].uniforms.uAmp.value  = 0.55 + Math.abs(wind)*0.9;
  }
  for (const f of flags) f.rotation.y = -0.85 - wind*0.80;

  if (keys.ArrowLeft || keys.a) yaw += 1.0*dt;
  if (keys.ArrowRight || keys.d) yaw -= 1.0*dt;

  if (phase === 'fly'){
    ft += dt;
    camPos.copy(launch).addScaledVector(vel0, ft).addScaledVector(accel, 0.5*ft*ft);
    velNow.copy(vel0).addScaledVector(accel, ft);
    s = camPos.z;
    flightT += dt;

    _dir.copy(velNow).normalize();
    const rigYaw   = Math.atan2(_dir.x, _dir.z);
    const rigPitch = Math.atan2(_dir.y, Math.hypot(_dir.x, _dir.z));
    povRig.position.copy(camPos);
    povRig.rotation.set(-rigPitch, rigYaw, Math.sin(flightT*2.3)*0.026);
    povRig.updateMatrixWorld(true);
    placeShadow(rigYaw);

    if (!dragging){
      yaw   += (rigYaw - yaw)*Math.min(1, dt*4.0);
      pitchAim = rigPitch;
      pitch += (pitchAim - pitch)*Math.min(1, dt*4.0);
    }
    readOut.textContent = Math.max(0, Math.round(RANGE - s)) + ' m';
    if (ft >= T) impact(camPos.clone());

  } else if (phase === 'ready'){
    /* Standing on the line, the arrow already points where it will be loosed,
       so you can see your aim before you let go. */
    _dir.subVectors(aimPt, camPos).normalize();
    const rigYaw   = Math.atan2(_dir.x, _dir.z);
    const rigPitch = Math.atan2(_dir.y, Math.hypot(_dir.x, _dir.z));
    povRig.position.copy(camPos);
    povRig.rotation.set(-rigPitch, rigYaw, 0);
    povRig.updateMatrixWorld(true);
    placeShadow(rigYaw);
    if (!dragging){
      pitchAim = restPitch;
      pitch += (pitchAim - pitch)*Math.min(1, dt*2.0);
    }
    readOut.textContent = Math.max(0, Math.round(RANGE - s)) + ' m';

  } else {
    const k = 1 - Math.pow(0.015, dt);
    camPos.lerp(viewPos, k);
    if (!dragging){
      yaw   += (aimYaw - yaw)*k;
      pitch += (aimPitch - pitch)*k;
      pitchAim = pitch;
    }
    if (wobble > 0 && stuckArrow){
      wobble = Math.max(0, wobble - dt*0.62);
      const d = wobble*wobble*0.085;
      stuckArrow.rotation.x = stuckBase.x + Math.sin(clock*31)*d;
      stuckArrow.rotation.y = stuckBase.y + Math.sin(clock*27 + 1.1)*d;
    }
  }

  camera.position.copy(camPos);
  _look.set(
    camera.position.x + Math.sin(yaw),
    camera.position.y + Math.tan(pitch),
    camera.position.z + Math.cos(yaw)
  );
  camera.lookAt(_look);
  if (phase === 'fly') camera.rotateZ(Math.sin(flightT*2.3)*0.012);
  window.__SKY.position.copy(camera.position);

  // the trees are flat, so they turn to keep their faces to you
  for (const t of trees) t.rotation.y = Math.atan2(camera.position.x - t.position.x,
                                                   camera.position.z - t.position.z);

  renderer.render(scene, camera);
}

boot.classList.add('gone');
setTimeout(() => boot.remove(), 900);
requestAnimationFrame(t => { prev = t; tick(t); });

window.__RANGE = {
  aim(x, y){ aimPt.set(x, y, RANGE); },
  shadowPx(){
    const v = povShadow.position.clone().project(camera);
    return { x:Math.round((v.x*0.5+0.5)*innerWidth), y:Math.round((-v.y*0.5+0.5)*innerHeight),
             vis:povShadow.visible, pos:[+povShadow.position.x.toFixed(2), +povShadow.position.z.toFixed(2)] };
  },
  fire(){ if (phase !== 'fly') loose(); },
  pixel(px, py){ fire(px, py); },
  reset,
  look(y, p){ yaw = y; pitch = pitchAim = p; },
  state(){ return {
    phase, s:+s.toFixed(2), t:+ft.toFixed(2), T:+T.toFixed(2),
    wind:+wind.toFixed(2), aim:[+aimPt.x.toFixed(2), +aimPt.y.toFixed(2)],
    stuck: stuck.length, shots: shotN
  }; }
};

})();
</script>
</body>
